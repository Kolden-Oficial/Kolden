name: storytelling
version: "1.0.0"
short-title: "Squad de Storytelling"
description: "Squad de 12 mestres do storytelling. Mitologia, screenwriting, narrativa pessoal, business storytelling, improviso, pitching, movimentos sociais."
author: "Synkra AIOS"
license: MIT
slashPrefix: "storytelling"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - storytelling
  - narrative
  - screenplay
  - presentation
  - pitch
  - improv
  - brand-story

components:
  agents:
    - story-chief.md
    - joseph-campbell.md
    - dan-harmon.md
    - blake-snyder.md
    - shawn-coyne.md
    - matthew-dicks.md
    - kindra-hall.md
    - nancy-duarte.md
    - park-howell.md
    - keith-johnstone.md
    - oren-klaff.md
    - marshall-ganz.md
  tasks:
    - analyze-story.md
    - build-narrative.md
    - create-pitch.md
    - create-presentation.md
    - diagnose.md
    - review.md
    - unblock-creative.md
    - write-manifesto.md
  workflows:
    - wf-brand-narrative.yaml
    - wf-story-development.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de storytelling (Campbell/Harmon/Snyder/Klaff/Coyne/...).
  veto:
    historia_inventada_como_real: "HALT em apresentar caso/exemplo como história REAL sem verificar fonte. Anedota inventada é OK como ilustração ROTULADA; passar por real é fraude."
    framework_sem_atribuicao: "HALT em apresentar estrutura narrativa (Jornada do Herói, Save the Cat, Story Circle, Pixar formula) como original sem reconhecer a fonte (Campbell, Snyder, Harmon, etc.)."
    manipulacao_de_audiencia_vulneravel: "HALT em arquitetura emocional desenhada para explorar público vulnerável (luto, doença, vulnerabilidade financeira) sem benefício real declarado."
    spoiler_de_obra_de_terceiro: "HALT em entregar análise/teardown que dependa de spoiler completo de obra protegida sem citação justa (fair use)."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend
