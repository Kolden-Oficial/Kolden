name: advisory-board
version: "1.0.0"
short-title: "Advisory Board"
description: "Board de 11 conselheiros estratégicos — Ray Dalio, Charlie Munger, Naval Ravikant, Peter Thiel, Reid Hoffman, Simon Sinek, Brené Brown, e mais."
author: "Synkra AIOS"
license: MIT
slashPrefix: "advisory-board"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - strategy
  - investment
  - leadership
  - mental-models
  - scaling
  - purpose
  - entrepreneurship

components:
  agents:
    - board-chair.md
    - ray-dalio.md
    - charlie-munger.md
    - naval-ravikant.md
    - peter-thiel.md
    - reid-hoffman.md
    - simon-sinek.md
    - brene-brown.md
    - patrick-lencioni.md
    - derek-sivers.md
    - yvon-chouinard.md
  tasks:
    - convene-board.md
    - diagnose.md
    - evaluate-scaling.md
    - get-founder-counsel.md
    - resolve-culture-crisis.md
    - review.md
    - seek-investment-counsel.md
  workflows:
    - wf-board-meeting.yaml
    - wf-decision-framework.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do Advisory Board (Dalio, Munger, Naval, Thiel, Sinek, ...).
  veto:
    sem_parecer_juridico_ou_fiscal_definitivo: "HALT em qualquer saída apresentada como parecer jurídico, fiscal ou contábil definitivo. Aconselhamento estratégico é OK; parecer vinculante exige profissional habilitado."
    sem_aconselhamento_de_investimento_individual: "HALT em recomendação de investimento específica (compre X, venda Y) que possa ser interpretada como conselho personalizado a uma pessoa física não habilitada."
    framework_sem_procedencia: "HALT em apresentar princípio como 'Munger diz' / 'Dalio diz' sem citação verificável (livro, ano, página/episódio)."
    cita_pessoa_real_como_endosso: "HALT em fazer parecer que o board real (pessoas vivas) endossou uma decisão concreta da Kolden. São personas baseadas em obra pública, não consultoria real."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend

