  - slug: estrutura-narrativa-contemporanea
    titulo: "Estrutura narrativa contemporânea (Campbell → Vogler → Truby)"
    tipo: disciplina
    arquivo: linhagens/estrutura-narrativa-contemporanea.md # a escrever
    mentes: [joseph-campbell, christopher-vogler, john-truby]
    frameworks: [arco-personagem-5-pontos]

  - slug: psicologia-cientifica
    titulo: "Psicologia científica (personalidade, apego, AT, cognitiva, comunicação patológica)"
    tipo: disciplina
    arquivo: linhagens/psicologia-cientifica.md    # a escrever
    mentes: [paul-costa-jr, robert-mccrae, john-bowlby, mary-ainsworth, george-vaillant,
             aaron-beck, stephen-karpman, eric-berne, erik-erikson, gregory-bateson, pete-walker]
    frameworks: [perfil-psicologico-multi-lente, dinamica-relacional]

# ─────────────────────────────────────────────────────────────────────────────
# NOTAS DE FRONTEIRA (curadas pelo genealogista)
# ─────────────────────────────────────────────────────────────────────────────
# `psicologia-cientifica` × `psicanalise-do-desejo` — convivem sem sobreposição.
#   - `psicanalise-do-desejo` é PSICANALÍTICA (Freud → Bernays → Dichter → Lacan,
#     com Jung como ramo paralelo); aplica DESEJO INCONSCIENTE a marca/consumo.
#     Frameworks: [matriz-de-desejo-inconsciente].
#   - `psicologia-cientifica` é PSICOLOGIA CIENTÍFICA/CLÍNICA (Big Five, apego,
#     AT, cognitiva, Bateson); aplica PERFILAMENTO MULTI-LENTE a persona, personagem,
#     dinâmica de relação. Frameworks: [perfil-psicologico-multi-lente, dinamica-relacional].
#   - As duas se complementam: uma escava o desejo, a outra perfila a pessoa.
#     Nenhuma dissolve a outra; o framework escolhe a lente apropriada ao problema.
#
# `formalismo-narratologico` × `estrutura-narrativa-contemporanea` — adjacentes.
#   - `formalismo-narratologico` é a tradição acadêmica (Tomashevsky, Genette) +
#     comparados (Aristóteles, kishōtenketsu, rasa). Frameworks de DIAGNÓSTICO e
#     ESCOLHA DE TRADIÇÃO.
#   - `estrutura-narrativa-contemporanea` é a tradição prática de roteiro
#     (Campbell → Vogler → Truby). Framework de CONSTRUÇÃO DE PERSONAGEM
#     (want/need/lie/ghost).
#   - Convivem porque endereçam problemas diferentes: diagnóstico/escolha vs.
#     construção. Não fundir.
