# EDGES — uma entrada por relação de influência (aresta dirigida de->para).
#   de        — id da mente de origem
#   para      — id da mente de destino
#   tipo      — herdou-de | influenciou
#   natureza  — direta (fonte primária: foi aluno, leu, citou) |
#               inferida (plausível, sem prova primária) |
#               zeitgeist (ar do tempo / influência difusa, não pessoal)
#   fonte     — obra/URL + ano que sustenta a aresta (obrigatória se natureza=direta)
edges:
  - de: sigmund-freud
    para: edward-bernays
    tipo: influenciou
    natureza: direta
    fonte: "Bernays é sobrinho (duplo) de Freud e aplica sua teoria — 'Propaganda' (1928)"
  - de: edward-bernays
    para: ernest-dichter
    tipo: influenciou
    natureza: direta
    fonte: "Dichter estende a aplicação psicanalítica de Bernays ao produto — 'The Strategy of Desire' (1960)"
  - de: sigmund-freud
    para: ernest-dichter
    tipo: influenciou
    natureza: direta
    fonte: "Dichter aplica a psicanálise freudiana ao consumo (pesquisa motivacional)"
  - de: ernest-dichter
    para: vance-packard
    tipo: influenciou
    natureza: direta
    fonte: "Packard documenta e critica a pesquisa motivacional — 'The Hidden Persuaders' (1957)"
  - de: ernest-dichter
    para: louis-cheskin
    tipo: influenciou
    natureza: inferida
    fonte: "inferida — ambos operam motivação/percepção de embalagem na mesma corrente"
  - de: sigmund-freud
    para: jacques-lacan
    tipo: influenciou
    natureza: direta
    fonte: "Lacan: 'retorno a Freud' — releitura do desejo via objet petit a, 'Écrits' (1966)"
  - de: sigmund-freud
    para: carl-jung
    tipo: influenciou
    natureza: direta
    fonte: "Jung foi discípulo de Freud antes da ruptura (inconsciente coletivo/arquétipos)"

  # ─────────────────────────────────────────────────────────────────────────────
  # Arestas da linhagem `ia-simbolica-e-cognicao` (Onda 1 — 2026-07-04)
  # Todas as arestas têm prova de contato documentada.
  # ─────────────────────────────────────────────────────────────────────────────
  - de: alan-turing
    para: john-mccarthy
    tipo: influenciou
    natureza: direta
    fonte: "McCarthy cita Turing (1950) como convocação do campo; proposta de Dartmouth (1955) trata máquina universal como pressuposto"
  - de: alan-turing
    para: marvin-minsky
    tipo: influenciou
    natureza: direta
    fonte: "Minsky cita Turing (1950) explicitamente em 'Steps Toward Artificial Intelligence' (1961)"
  - de: alan-turing
    para: claude-shannon
    tipo: influenciou
    natureza: direta
    fonte: "Turing e Shannon coincidiram em Bell Labs em 1943 (missão SIGSALY); Shannon relata em entrevista a Anthony Liversidge (Omni, 1987)"
  - de: alan-turing
    para: allen-newell
    tipo: influenciou
    natureza: direta
    fonte: "Newell & Simon (1976) 'Computer Science as Empirical Inquiry' atribuem a Physical Symbol System Hypothesis a Turing como precursor"
  - de: alan-turing
    para: herbert-simon
    tipo: influenciou
    natureza: direta
    fonte: "Newell & Simon (1976) — Turing Award Lecture — atribuem PSSH a Turing como precursor"
  - de: claude-shannon
    para: john-mccarthy
    tipo: influenciou
    natureza: direta
    fonte: "McCarthy foi estagiário de Shannon em Bell Labs (1952); co-editaram *Automata Studies* (Princeton University Press, 1956); co-assinaram proposta de Dartmouth (1955)"
  - de: claude-shannon
    para: marvin-minsky
    tipo: influenciou
    natureza: direta
    fonte: "Shannon foi orientador do PhD de Minsky em Princeton (defendido 1954); ambos co-autores da proposta de Dartmouth (1955)"
  - de: claude-shannon
    para: allen-newell
    tipo: influenciou
    natureza: direta
    fonte: "Newell reconhece em 'The Chess Machine' (1955) que o paper de xadrez de Shannon (1950) definiu o problema"
  - de: john-mccarthy
    para: marvin-minsky
    tipo: influenciou
    natureza: direta
    fonte: "Co-fundadores do MIT AI Lab em 1959; co-autores da proposta de Dartmouth (1955); intercâmbio contínuo até McCarthy ir para Stanford em 1962"
  - de: marvin-minsky
    para: john-mccarthy
    tipo: influenciou
    natureza: direta
    fonte: "Simétrica à anterior — co-fundadores do MIT AI Lab (1959)"
  - de: herbert-simon
    para: allen-newell
    tipo: influenciou
    natureza: direta
    fonte: "Simon foi orientador do PhD de Newell em Carnegie Tech (defendido 1957); parceria científica de 42 anos com ~30 coautorias principais (1954-1996)"
  - de: allen-newell
    para: herbert-simon
    tipo: influenciou
    natureza: direta
    fonte: "Simétrica à anterior — parceria Newell-Simon"
  - de: alan-turing
    para: geoffrey-hinton
    tipo: influenciou
    natureza: inferida
    fonte: "inferida — o paper de 1948 sobre 'unorganized machines' antecipa redes neurais; Hinton reconhece a linha em várias entrevistas mas não como fonte direta"
  - de: marvin-minsky
    para: geoffrey-hinton
    tipo: influenciou
    natureza: direta
    fonte: "Hinton (Turing Award Lecture, 2018) reconhece publicamente que *Perceptrons* (Minsky & Papert, 1969) foi motivador de sua pesquisa em backpropagation e deep learning"

  # ─────────────────────────────────────────────────────────────────────────────
  # Arestas da linhagem `conexionismo-deep-learning` (Onda 2 — 2026-07-04)
  # Todas com prova de contato documentada.
  # ─────────────────────────────────────────────────────────────────────────────
  - de: warren-mcculloch
    para: frank-rosenblatt
    tipo: influenciou
    natureza: direta
    fonte: "McCulloch-Pitts 1943 é citado explicitamente por Rosenblatt no §1 de 'The Perceptron' (Psychological Review, 1958)"
  - de: donald-hebb
    para: frank-rosenblatt
    tipo: influenciou
    natureza: direta
    fonte: "*The Organization of Behavior* (Hebb, 1949) — regra hebbiana como inspiração do mecanismo de reforço perceptrônico; Rosenblatt cita em Principles of Neurodynamics (1962)"
  - de: frank-rosenblatt
    para: geoffrey-hinton
    tipo: influenciou
    natureza: direta
    fonte: "Hinton reconhece Rosenblatt como pai da tradição em Ford, 'Architects of Intelligence' (Packt, 2018) e Turing Lecture 2018; backprop de 1986 resolve a lacuna de Principles of Neurodynamics 1962"
  - de: frank-rosenblatt
    para: yann-lecun
    tipo: influenciou
    natureza: direta
    fonte: "LeCun cita Rosenblatt repetidamente em palestras (Turing Lecture 2018; keynote NeurIPS 2016)"
  - de: frank-rosenblatt
    para: kunihiko-fukushima
    tipo: influenciou
    natureza: direta
    fonte: "Neocognitron (Fukushima, Biological Cybernetics 36, 1980) cita Rosenblatt como antecessor do perceptron multicamada"
  - de: kunihiko-fukushima
    para: yann-lecun
    tipo: influenciou
    natureza: direta
    fonte: "LeCun credita Neocognitron (Fukushima 1980) como antecessor arquitetural direto das CNNs em toda palestra sobre história de deep learning"
  - de: marvin-minsky
    para: frank-rosenblatt
    tipo: influenciou
    natureza: direta
    fonte: "adversarial: colegas de classe no Bronx High School of Science (~1945); *Perceptrons* (Minsky & Papert 1969) é resposta técnica direta ao programa de Rosenblatt; Olazaran 1996 (Social Studies of Science 26)"
  - de: geoffrey-hinton
    para: yann-lecun
    tipo: influenciou
    natureza: direta
    fonte: "LeCun fez pós-doutorado com Hinton em Toronto (1987-1988) antes de ir para Bell Labs"
  - de: geoffrey-hinton
    para: yoshua-bengio
    tipo: influenciou
    natureza: direta
    fonte: "Bengio fez pós-doutorado com Hinton em Toronto (1991-1992)"
  - de: yann-lecun
    para: yoshua-bengio
    tipo: influenciou
    natureza: direta
    fonte: "Bengio fez pós-doutorado no Bell Labs sob supervisão de LeCun (1992-1993); coautores de LeNet-5 (Proc. IEEE 1998)"
  - de: geoffrey-hinton
    para: yann-lecun
    tipo: influenciou
    natureza: direta
    fonte: "coautores do artigo 'Deep learning' (Nature 521, 2015) com Bengio; parceria contínua desde os anos 80"
  - de: paul-werbos
    para: geoffrey-hinton
    tipo: influenciou
    natureza: direta
    fonte: "Werbos (tese Harvard 1974) tem prioridade histórica sobre backprop; Hinton reconhece em Turing Award Lecture 2018 como precursor"
  - de: david-rumelhart
    para: geoffrey-hinton
    tipo: influenciou
    natureza: direta
    fonte: "coautoria do paper de backprop em Nature 323 (1986); colaboração no PDP Research Group em San Diego (1982-1986)"
  - de: terrence-sejnowski
    para: geoffrey-hinton
    tipo: influenciou
