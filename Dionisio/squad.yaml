name: movement
version: "1.0.0"
short-title: "Squad de Movimentos"
description: "Squad de 7 agentes para construção de movimentos. Fenomenologia, identidade, manifestos, ciclos de crescimento, medição de impacto."
author: "Synkra AIOS"
license: MIT
slashPrefix: "movement"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - movement
  - community
  - social-impact
  - identity
  - manifesto
  - growth-cycles
  - phenomenology

components:
  agents:
    - movement-chief.md
    - movement-architect.md
    - fenomenologo.md
    - identitario.md
    - estrategista-de-ciclo.md
    - manifestador.md
    - analista-de-impacto.md
  tasks:
    - analyze-phenomenon.md
    - build-movement.md
    - create-identity.md
    - diagnose.md
    - measure-impact.md
    - review.md
    - write-manifesto.md
  workflows:
    - wf-movement-launch.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de movimento (Ganz/community organizing/identidade/manifesto).
  veto:
    movimento_de_fachada: "HALT em construção de 'movimento' cuja função real é só vender — movimento exige propósito coletivo e estrutura de pertencimento, não rótulo de marketing."
    manipulacao_emocional_sem_beneficio: "HALT em uso de gatilho emocional (medo, identidade, pertencimento) que não entregue benefício real ao membro. Movimento usa emoção pelo propósito, não contra ele."
    cooptacao_de_causa: "HALT em apropriar causa social/política viva sem participação real ou consentimento da comunidade afetada."
    manifesto_sem_acao: "HALT em manifesto que termina em declaração sem chamada à ação concreta + estrutura de envolvimento. Manifesto sem ação é poster."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend
