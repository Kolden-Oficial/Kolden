# ═══════════════════════════════════════════════════════════════════
# Squad: Brand Squad
# Domínio: Estratégia de Marca, Identidade e Posicionamento
# Versão: 1.0.0
# ═══════════════════════════════════════════════════════════════════

squad:
  name: brand-squad
  display_name: "Brand Squad"
  version: "1.0.0"
  domain: "Estratégia de marca, identidade, posicionamento, arquitetura, naming, arquétipos e crescimento"
  description: |
    O squad definitivo de estratégia de marca — 10 pensadores de marca lendários clonados como agentes de IA
    mais 4 especialistas funcionais e 1 orquestrador. Do Brand Equity de Aaker ao marketing
    baseado em evidências de Sharp, do Identity Prism de Kapferer ao StoryBrand de Miller — este
    squad cobre cada dimensão da construção de marca, posicionamento, identidade, arquitetura
    e crescimento.
  keywords: [valor de marca, posicionamento, identidade de marca, messaging, arquitetura de marca, naming, arquétipos, identidade visual, StoryBrand, marca de luxo, marca de startup, diferenciação, distintividade]
  entry_agent: brand-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orquestrador de Marca"
    agents: [brand-chief]
    purpose: "Rotear desafios de marca para o especialista certo com base no domínio do problema de marca"
  tier_1_strategy:
    name: "Estratégia de Marca e Equity"
    agents: [david-aaker, kevin-keller, jean-noel-kapferer]
    purpose: "Modelos de brand equity, sistemas de identidade, gestão estratégica de marca"
  tier_1_positioning:
    name: "Posicionamento e Diferenciação"
    agents: [al-ries, byron-sharp, marty-neumeier]
    purpose: "Posicionamento de mercado, estratégia de categoria, diferenciação, crescimento baseado em evidências"
  tier_1_building:
    name: "Construção de Marca e Comunicação"
    agents: [donald-miller, denise-yohn, emily-heyward]
    purpose: "Messaging StoryBrand, fusão marca-cultura, branding de startup"
  tier_1_identity:
    name: "Identidade e Expressão de Marca"
    agents: [alina-wheeler, archetype-consultant, naming-strategist]
    purpose: "Sistemas de identidade visual, arquétipos de marca, estratégia de naming"
  tier_2_support:
    name: "Suporte Especializado"
    agents: [domain-scout, miller-sticky-brand]
    purpose: "Disponibilidade de domínio, implementação de StoryBrand"

