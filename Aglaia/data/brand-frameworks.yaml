# Referência de Frameworks de Marca
# Referenciado por agentes especialistas para aplicação estruturada de metodologia

frameworks:
  aaker_brand_equity:
    source: "David Aaker — Managing Brand Equity (1991), Building Strong Brands (1996)"
    description: "Modelo de cinco pilares para medir e construir brand equity"
    components:
      - name: "Brand Awareness"
        description: "A força da presença da marca na mente do consumidor. Varia do reconhecimento (já ouvi falar disso?) ao top-of-mind (primeira marca em que penso na categoria)."
      - name: "Perceived Quality"
        description: "A percepção do cliente sobre a qualidade ou superioridade geral do produto em relação às alternativas. Não a qualidade real — a qualidade percebida."
      - name: "Brand Associations"
        description: "Tudo o que está mentalmente ligado à marca — atributos, benefícios, atitudes, imagens, símbolos. Quanto mais ricas e positivas, mais forte o equity."
      - name: "Brand Loyalty"
        description: "O apego que os clientes têm pela marca. Vai dos trocadores aos compradores satisfeitos e aos defensores comprometidos. Clientes leais são o ativo mais valioso da marca."
      - name: "Proprietary Brand Assets"
        description: "Marcas registradas, patentes, relações de distribuição e outros ativos que proporcionam vantagem competitiva e protegem o equity."
    when_to_use: "Auditorias de marca, mensuração de equity, planejamento estratégico, gestão de portfólio"

  kapferer_identity_prism:
    source: "Jean-Noel Kapferer — The New Strategic Brand Management (1992)"
    description: "Modelo de seis facetas para definir a identidade de marca como um sistema coerente"
    components:
      - name: "Physique"
        description: "As características físicas e a identidade visual da marca — logo, cores, embalagem, design de produto. Como a marca se parece."
      - name: "Personality"
        description: "O caráter e os traços humanos da marca. Se a marca fosse uma pessoa, como você descreveria sua personalidade?"
      - name: "Culture"
        description: "Os valores, princípios e a origem dos quais a marca se nutre. A ideologia e o sistema de crenças por trás da marca."
      - name: "Relationship"
        description: "O tipo de relacionamento que a marca estabelece com seus clientes. Transacional? Mentoria? Amizade? Parceria?"
      - name: "Reflection"
        description: "O espelho externo — como o cliente-alvo se vê por meio da marca. A autoimagem aspiracional que a marca possibilita."
      - name: "Self-Image"
        description: "O espelho interno — como os clientes se sentem internamente quando usam a marca. O diálogo interno que a marca apoia."
    when_to_use: "Design de identidade de marca, auditorias de consistência, renovação de identidade, alinhamento interno de marca"

  ries_positioning:
    source: "Al Ries & Jack Trout — Positioning: The Battle for Your Mind (1981)"
    description: "A teoria fundacional do posicionamento de marca — possuir um espaço distinto na mente do prospect"
    components:
      - name: "Category Ladder"
        description: "Os consumidores organizam marcas em escadas mentais por categoria. O objetivo é estar no degrau mais alto de uma escada, mesmo que você precise criar uma nova."
      - name: "First Mover Advantage"
        description: "É melhor ser o primeiro em uma categoria do que ser melhor. Se você não puder ser o primeiro, crie uma categoria na qual você seja o primeiro."
      - name: "Own a Word"
        description: "O posicionamento mais poderoso é possuir uma única palavra na mente do prospect. Volvo = segurança. FedEx = entrega de um dia para o outro."
      - name: "Law of the Opposite"
        description: "Se você não é o líder, posicione-se contra o líder. Seja o oposto. Se eles são grandes, seja pequeno. Se eles são antigos, seja novo."
      - name: "Narrow Focus"
        description: "Sacrifique abrangência por profundidade. Uma marca que tenta ser tudo para todos não significa nada para ninguém."
    when_to_use: "Estratégia de posicionamento, análise competitiva, criação de categoria, desenvolvimento de tagline"

  sharp_distinctiveness:
    source: "Byron Sharp — How Brands Grow (2010)"
    description: "Branding baseado em evidências, focado em disponibilidade mental e física"
    components:
      - name: "Mental Availability"
        description: "A probabilidade de que um comprador pense na marca em uma situação de compra. Construída por meio de comunicação consistente e de amplo alcance."
      - name: "Physical Availability"
        description: "Quão fácil é encontrar e comprar a marca. Distribuição, espaço de prateleira, presença digital, acessibilidade."
      - name: "Distinctive Brand Assets"
        description: "Elementos visuais e verbais que estão associados de forma única à marca — cores, formas, sons, personagens, taglines. Distintividade acima de diferenciação."
      - name: "Reach over Frequency"
        description: "Alcançar mais pessoas uma vez é mais eficaz do que alcançar menos pessoas muitas vezes. Priorize o alcance amplo."
      - name: "Category Entry Points"
        description: "As situações e os gatilhos de compra que disparam a necessidade da categoria. As marcas devem se vincular ao maior número possível de pontos de entrada."
    when_to_use: "Estratégia de crescimento, planejamento de mídia, desenvolvimento de ativos de marca, penetração de mercado"

  twelve_archetypes:
    source: "Carl Jung, aplicado ao branding por Margaret Mark & Carol Pearson (The Hero and the Outlaw, 2001)"
    description: "Doze padrões universais de personagem que as marcas podem encarnar para criar conexão emocional"
    components:
      - name: "Innocent"
        description: "Desejo: Paraíso. Meta: Felicidade. Medo: Fazer o errado. Exemplo: Dove, Coca-Cola"
      - name: "Explorer"
        description: "Desejo: Liberdade. Meta: Descoberta. Medo: Conformidade. Exemplo: Jeep, Patagonia"
      - name: "Sage"
        description: "Desejo: Verdade. Meta: Compreensão. Medo: Ignorância. Exemplo: Google, BBC"
      - name: "Hero"
        description: "Desejo: Maestria. Meta: Conquista. Medo: Fraqueza. Exemplo: Nike, FedEx"
      - name: "Outlaw"
        description: "Desejo: Libertação. Meta: Revolução. Medo: Impotência. Exemplo: Harley-Davidson, Virgin"
      - name: "Magician"
        description: "Desejo: Transformação. Meta: Tornar sonhos reais. Medo: Consequências não intencionais. Exemplo: Apple, Disney"
      - name: "Regular Guy"
        description: "Desejo: Pertencimento. Meta: Conexão. Medo: Destacar-se. Exemplo: IKEA, Target"
      - name: "Lover"
        description: "Desejo: Intimidade. Meta: Relacionamento. Medo: Rejeição. Exemplo: Chanel, Godiva"
      - name: "Jester"
        description: "Desejo: Diversão. Meta: Passar um ótimo momento. Medo: Tédio. Exemplo: Old Spice, M&Ms"
      - name: "Caregiver"
        description: "Desejo: Servir. Meta: Ajudar os outros. Medo: Egoísmo. Exemplo: Johnson & Johnson, TOMS"
      - name: "Creator"
        description: "Desejo: Inovação. Meta: Criar algo de valor. Medo: Mediocridade. Exemplo: LEGO, Adobe"
      - name: "Ruler"
        description: "Desejo: Controle. Meta: Ordem e prosperidade. Medo: Caos. Exemplo: Mercedes, Rolex"
    when_to_use: "Desenvolvimento de personalidade de marca, estratégia de messaging, criação de conteúdo, direção de identidade visual"

  storybrand_sb7:
    source: "Donald Miller — Building a StoryBrand (2017)"
    description: "Framework de sete elementos para clarificar o messaging da marca por meio da estrutura de story"
    components:
      - name: "Character"
        description: "O cliente é o herói. Defina quem ele é e o que ele quer."
      - name: "Problem"
        description: "O vilão, e os problemas externo, interno e filosófico que o herói enfrenta."
      - name: "Guide"
        description: "A marca é o guia — expressando empatia e autoridade."
      - name: "Plan"
        description: "Um plano simples de 3 passos que remove a confusão e constrói confiança."
      - name: "Call to Action"
        description: "Um CTA direto (comprar, inscrever-se) e um CTA transicional (baixar, assistir)."
      - name: "Failure"
        description: "As consequências negativas — o que acontece se o herói não agir."
      - name: "Success"
        description: "A transformação positiva — como fica a vida depois."
    when_to_use: "Copy de site, messaging de marca, scripts de vendas, materiais de marketing, pitch decks"

  wheeler_brand_identity_process:
    source: "Alina Wheeler — Designing Brand Identity (2003, 5ª ed. 2017)"
    description: "Processo de cinco fases para desenhar e implementar a identidade de marca"
    components:
      - name: "Fase 1: Conducting Research"
        description: "Auditar a marca existente, analisar concorrentes, entrevistar stakeholders, pesquisar clientes. Compreender antes de criar."
      - name: "Fase 2: Clarifying Strategy"
        description: "Definir posicionamento, arquitetura de marca, estratégia de naming e mensagens-chave. Estratégia antes do design."
      - name: "Fase 3: Designing Identity"
        description: "Explorar conceitos visuais, desenhar o logo, selecionar tipografia e cores, desenvolver o sistema visual."
      - name: "Fase 4: Creating Touchpoints"
        description: "Aplicar a identidade a todos os pontos de contato da marca — cartões de visita, site, embalagem, sinalização, digital, ambiental."
      - name: "Fase 5: Managing Assets"
        description: "Construir as brand guidelines, criar templates, treinar a equipe, estabelecer a governança para a gestão contínua da marca."
    when_to_use: "Projetos completos de identidade de marca, rebrandings, design de sistema de marca, governança de identidade"
