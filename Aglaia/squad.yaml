name: brand-squad
version: "1.0.0"
short-title: "Squad de Marca"
description: "O squad definitivo de estratégia de marca — 10 pensadores lendários de branding clonados como agentes de IA, mais 4 especialistas funcionais e 1 orquestrador. Cobre brand equity, posicionamento, identidade, arquitetura e crescimento."
author: "Synkra AIOS"
license: MIT
slashPrefix: "brand-squad"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - branding
  - brand-strategy
  - positioning
  - identity
  - naming
  - archetype
  - storybrand
  - brand-equity
  - brand-architecture
  - luxury

components:
  agents:
    # Tier 0 — Orquestrador
    - brand-chief.md
    # Tier 1 — Estratégia de Marca e Equity
    - david-aaker.md
    - kevin-keller.md
    - jean-noel-kapferer.md
    # Tier 1 — Posicionamento e Diferenciação
    - al-ries.md
    - byron-sharp.md
    - marty-neumeier.md
    # Tier 1 — Construção de Marca e Comunicação
    - donald-miller.md
    - denise-yohn.md
    - emily-heyward.md
    # Tier 1 — Identidade e Expressão de Marca
    - alina-wheeler.md
    - archetype-consultant.md
    - naming-strategist.md
    # Tier 2 — Suporte Especializado
    - domain-scout.md
    - miller-sticky-brand.md
  tasks:
    # Análise de Marca
    - audit-brand.md
    - diagnose.md
    - review.md
    # Criação de Marca
    - create-positioning.md
    - generate-names.md
    - build-identity.md
    - create-brand-story.md
    - design-architecture.md
    - map-archetype.md
  workflows:
    - wf-brand-creation.yaml
    - wf-rebrand.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de marca (estratégia, posicionamento, identidade, arquitetura).
  veto:
    claim_de_marca_sem_evidencia: "HALT em afirmação sobre brand equity / market position / awareness sem evidência (Sharp/Aaker exigem dado de mercado, não opinião)."
    naming_sem_check: "HALT em proposta de nome de marca sem sinalizar necessidade de checagem de marca registrada (INPI/USPTO/WIPO) e disponibilidade de domínio. Naming sem check é risco legal."
    arquetipo_como_estereotipo: "HALT em apresentar arquétipo (Jung/Mark&Pearson) como caracterização determinista de pessoa real ou de grupo. Arquétipo é lente, não diagnóstico."
    copia_de_marca_existente: "HALT em proposta de identidade visual/verbal que seja imitação reconhecível de marca existente. Inspiração de princípio (Sharp) é OK; copy de execução é violação."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend

routing_matrix:
  brand_equity:
    primary: david-aaker
    secondary: kevin-keller
    triggers: ["brand equity", "valor de marca", "lealdade de marca", "awareness de marca", "associações de marca"]
  brand_identity:
    primary: jean-noel-kapferer
    secondary: alina-wheeler
    triggers: ["identidade de marca", "identity prism", "DNA de marca", "personalidade de marca", "cultura de marca"]
  positioning:
    primary: al-ries
    secondary: marty-neumeier
    triggers: ["posicionamento", "categoria", "foco", "diferenciação", "possuir uma palavra"]
  evidence_based:
    primary: byron-sharp
    secondary: kevin-keller
    triggers: ["how brands grow", "disponibilidade mental", "disponibilidade física", "ativos distintivos"]
  messaging:
    primary: donald-miller
    secondary: miller-sticky-brand
    triggers: ["StoryBrand", "messaging", "one-liner", "brand script", "copy de site"]
  visual_identity:
    primary: alina-wheeler
    secondary: archetype-consultant
    triggers: ["logo", "identidade visual", "brand guidelines", "sistema de design", "pontos de contato"]
  brand_culture:
    primary: denise-yohn
    secondary: donald-miller
    triggers: ["cultura de marca", "marca empregadora", "marca interna", "fusão"]
  startup_brand:
    primary: emily-heyward
    secondary: marty-neumeier
    triggers: ["marca de startup", "marca DTC", "lançar marca", "marca nova"]
  luxury_brand:
    primary: jean-noel-kapferer
    secondary: david-aaker
    triggers: ["luxo", "premium", "prestígio", "estratégia de luxo"]
  naming:
    primary: naming-strategist
    secondary: domain-scout
    triggers: ["naming", "nome de marca", "renomear", "geração de nome", "domínio"]
  archetype:
    primary: archetype-consultant
    secondary: jean-noel-kapferer
    triggers: ["arquétipo", "personalidade de marca", "caráter de marca", "Jung"]
  brand_architecture:
    primary: david-aaker
    secondary: kevin-keller
    triggers: ["arquitetura de marca", "submarcas", "branded house", "house of brands", "portfólio"]
