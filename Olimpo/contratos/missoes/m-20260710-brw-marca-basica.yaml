        narrativa sem "desde 1998"; ICP prioritário hotelaria/corporativo > investidor Airbnb.
      handoff_operacional: { squad: "Aletheia|Aglaia|Orfeu|Caliope", artefato: "brw-movelaria/marca/{premissas-e-premorte,posicionamento,narrativa,mensagens-chave,voz-e-tom}.md" }
      devolucao_lateral: null
      resultado: ""
      assinatura: { por: "apolo", em: "2026-07-10T08:30:16-03:00" }
    - agente: "hefesto"
      especificacao_tecnica: >
        Onda 2 (Harmonia): consolidar brandbook básico md+html documentando a identidade visual EXISTENTE
