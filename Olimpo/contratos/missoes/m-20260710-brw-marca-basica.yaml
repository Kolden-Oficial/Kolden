# intencao_original é lacrada (hash) e nunca mais muda. Schema: ../contrato-de-missao.schema.md
---
missao:
  id: "m-20260710-brw-marca-basica"

  # ── CAMADA 1 — HUMANO (lacrada, imutável) ───────────────────────────────────
  intencao_original:
    input_cru: "@Hermes/ preciso que voce acione todos os squads necessários para criarmos um posicionamento da marca, narrativa, comunicação, brandbook (basico + o que temos)."
    canal: "cli"
    recebida_em: "2026-07-10T08:30:16-03:00"
    hash: "8234fd04e764ce0602560537e121ceda02690b86e0f7c9568eead77057f8a02a"

  # ── CAMADA 2 — HERMES (tradução de intenção) ────────────────────────────────
  hermes:
    dor:
      objetivo_real: >
        Produzir a marca básica da BRW Movelaria — posicionamento, narrativa, comunicação
        (mensagens-chave + voz e tom) e um brandbook enxuto — sistematizando o material já
        existente (dossiê v2, coleta bruta, 129 assets, identidade visual atual) em vez de
        criar do zero. Resolver as incoerências de marca (5+ taglines conflitantes; posicionamento
        ambíguo movelaria×curadoria; selo "1998" sem lastro) sob um eixo único.
      criterio_de_sucesso: >
        Entregar em brw-movelaria/marca/ os 6 artefatos (premissas-e-premorte, posicionamento,
        narrativa, mensagens-chave, voz-e-tom, brandbook md+html) com: (1) UMA tagline única
        substituindo as 5 antigas; (2) cadeia coerente posicionamento→narrativa→mensagens→visual;
        (3) narrativa que NÃO afirma "BRW desde 1998" — reancorada no ofício do Robson; (4) tudo
        marcado v1/hipótese-de-trabalho com pré-morte explícita (H1/H5/WhatsApp/DRE/INPI). Brandbook
        HTML abre com render limpo. Ratificável pelo Ronan.
      restricoes:
        prazo: "sessão única (padrão validado ~1h20, ref. Rosie)"
        orcamento: "sem custo externo; execução offline sobre material local"
        proibicoes:
          - "não reprojetar logo nem gerar novos vetores (só há assets rasterizados)"
          - "não montar design-system DTCG completo (isto é escopo 'completo', não 'básico')"
          - "não fazer pesquisa web sem declarar ferramenta+nível e obter confirmação do Ronan (política global)"
          - "não publicar/usar nada antes do gate humano de ratificação"
          - "não cristalizar posicionamento como definitivo antes de H1+H5 (gate Aletheia do dossiê)"
      contexto:
        - "Material-base: sobre-a-empresa/Projetos/Ativos/brw-movelaria/{dossie.md, coleta-bruta/, anexos/drive-2026-07-06/}"
        - "Identidade visual atual já existe: azul-marinho #1A3D7E + paleta 5 tons (#C1741D, #7B1B1A, #3E2917, #3D4E1E); logo colchete-em-L 'BRW.movelaria'; selo ★★★★★·1998; sans geométrica light; tom poético/minimalista pós-rebrand jan/2026"
        - "DECISÃO DO RONAN (travada): eixo = curadoria/consultoria de mobiliário B2B para hotelaria e investidores Airbnb (nicho de maior margem)"
        - "DECISÃO DO RONAN (travada): legado '1998/35 anos' = reancorar no Robson (pedigree pessoal do fundador), sem afirmar que a entidade BRW existe desde 1998"
        - "Brandbooks-modelo de referência estrutural: Projetos/Ativos/omiron/brandbook/ e rosie/brandbook/"
      nivel_de_risco: "verde"
    dor_completo: true
    perguntas_abertas: []
    matriz_de_risco:
      reversibilidade: "reversivel"
      impacto: "baixo"
      faixa: "verde"
      autonomia: "executa-e-avisa"
    ordem_de_maquina: >
      Lavrar este Contrato; despachar via Zeus/Apolo três ondas de subagentes (Onda 0 Aletheia →
      Onda 1 paralela Aglaia+Orfeu+Caliope → Onda 2 Harmonia), cada onda escrevendo artefato em
      disco em brw-movelaria/marca/; reconciliar na subida (Hermes vs critério + delta Explore
      independente); devolver ao Ronan para ratificação.
    assinatura: { por: "hermes", em: "2026-07-10T08:30:16-03:00" }

  # ── CAMADA 3 — ZEUS (decomposição + roteamento) ─────────────────────────────
  zeus:
    diagnostico: >
      Missão de marca de escopo 'básico' sobre base madura. Dono executivo natural: Apolo (CMO) —
      develop_brand_strategy. A missão toca 4 domínios operacionais em paralelo (discovery, branding
      núcleo, narrativa, copy) + 1 de consolidação visual (design). Decompõe-se em 3 ondas com
      dependência temporal: Aletheia fixa premissas → Aglaia/Orfeu/Caliope produzem em paralelo sobre
      as mesmas premissas → Harmonia consolida o brandbook por último (depende das saídas verbais).
    decomposicao:
      - parte: "Premissas explícitas (validado×hipótese) + pré-morte + eixo curadoria-B2B fundamentado"
        executivo_destino: "apolo"
        motivo: "discovery/validação de marca é insumo de posicionamento — squad Aletheia"
      - parte: "Posicionamento (STP, POP/POD, mantra), arquétipo, Identity Prism, arquitetura de marca, tagline única"
        executivo_destino: "apolo"
        motivo: "núcleo de estratégia de marca — squad Aglaia"
      - parte: "Narrativa/manifesto/arco reancorado no Robson"
        executivo_destino: "apolo"
        motivo: "storytelling de marca — squad Orfeu"
      - parte: "Mensagens-chave, one-liner, pilares, voz-e-tom formalizado"
        executivo_destino: "apolo"
        motivo: "comunicação/copy de marca — squad Caliope"
      - parte: "Brandbook básico (md+html): visual existente sistematizado + verbal novo + correções sinalizadas"
        executivo_destino: "hefesto"
        motivo: "execução/sistematização de identidade visual — squad Harmonia"
    paralelo: ["Aglaia", "Orfeu", "Caliope"]   # Onda 1 acionada simultaneamente sobre as premissas da Onda 0
    consolidacao: >
      6 artefatos entregues em brw-movelaria/marca/ (premissas-e-premorte, posicionamento, narrativa,
      mensagens-chave, voz-e-tom, brandbook md+html). Cadeia coerente sob eixo único curadoria-B2B:
      posicionamento→narrativa→mensagens→voz→visual falam a mesma tese ("móvel é ativo que rende").
      Tagline única "Curadoria que rende." (Aglaia; Caliope convergiu de forma independente). "1998"
      neutralizado nos 7 arquivos (reancorado no Robson; selo redesenhado sem a data). Tudo carimbado
      v1/hipótese com pré-morte H1/H5/WhatsApp/DRE/INPI. Sem arbitragem (nenhuma divergência material
      entre squads). Verificação independente (proxy-Dike) apontou 5 reparos (2 materiais: tags de
      ferramenta vazadas no brandbook.md + cadeia mensagens/voz não-reconciliada com posicionamento);
      todos corrigidos por Hermes na rodada 1 de correção.
    arbitragem: null
    assinatura: { por: "zeus", em: "2026-07-10T08:30:16-03:00" }

  # ── CAMADA 4 — EXECUTIVOS (especificação técnica) ───────────────────────────
  executivos:
    - agente: "apolo"
      especificacao_tecnica: >
        Marca básica sob eixo curadoria-B2B-para-investidores. Onda 0 (Aletheia) entrega
        premissas-e-premorte.md. Onda 1 (Aglaia/Orfeu/Caliope) entrega posicionamento.md, narrativa.md,
