        Sinalizar correções (tagline única; ressalva do selo 1998). NÃO reprojetar logo. Referência de
        estrutura: omiron/brandbook e rosie/brandbook.
      handoff_operacional: { squad: "Harmonia", artefato: "brw-movelaria/marca/brandbook.{md,html}" }
      devolucao_lateral: null
      resultado: ""
      assinatura: { por: "hefesto", em: "2026-07-10T08:30:16-03:00" }

