  # ── CAMADA 1 — HUMANO (lacrada, imutável) ───────────────────────────────────
  intencao_original:
    input_cru: |
      @Hermes com base em tudo que sabemos agora sobre IA, os repositórios que clonamos,
      os próprios agents da @C:\Kolden\ e até o segundo maior agent o @Caos , vamos agora
      criar uma metodologia unificada, sei que o CAOS já tem, porém agora estou sentindo
      falta de padronização nos agents, arquivos padronizados, documentos padronizados,
      quero uma hierarquia completa que fique simples de entender, vamos nos basear em
      todas as mentes pensante sobre IA para construirmos essa hierarquia de agents e no
      fim quero ter um documento oficial dentro da pasta @C:\Kolden\ que relate o que vai
      encontrar em cada pasta, em seguida quero também padronizar coisas como o system
      prompt dos agents, dos subagents, o próprio comando, quero separar o uso do "@" e
      "/" de maneira correta, quero conseguir ler de maneira clara e organizada cada
      agent, sinto que hoje tem agent que tem muito arquivo e outros não, quero criar um
      framework, ou melhor um método, esse será o método da Kolden para ter uma
      infraestrutura robusta e completa de agents de ponta a ponta, podemos até
      referenciar quem foi as nossas inspirações para cada momento do nosso método, vale
      ressaltar que eu quero fazer por ondas/levas, quero ajustar agente por agent, em
      sessões diferentes, mas preciso que seja pradonizado, me faça perguntas se não
      ficou claro meu proposito de gestão/organização e hierarquia de ecossistema com IA.
    canal: "chat"
    recebida_em: "2026-07-05T22:50:00-03:00"
