        - "Convenção `@` vs `/` documentada mas descentralizada em: Caos/CLAUDE.md, Hermes/squads-catalog.yaml, Caos/modelos/convencao-de-cli-e-tooling.md"
        - "5 buckets de capacidade Kolden validados em produção (radar.yaml, 118 tarefas ativas)"
        - "3 skills globais em C:\\Kolden\\.claude\\skills\\ hoje: briefing-padrao, hermes-chief, ritual-de-encerramento — Método vai adicionar /metodo e /padronizar"
