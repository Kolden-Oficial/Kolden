  # ── CAMADA 3 — ZEUS (decomposição + roteamento) ─────────────────────────────
  zeus:
    diagnostico: |
      Missão de META-ARQUITETURA — nível mais alto que qualquer Contrato anterior. Toca
      identidade estrutural dos 26 squads + o próprio documento oficial da Kolden.
      Executivo natural é HEFESTO (CTO — arquitetura de sistemas de agents), sucedendo
      Atena (CAIO, Fase 1) e reafirmando escolha de Hefesto em Fase 2 (m-20260705).

      Hefesto delega a execução operacional em CASCATA:
      - Onda 1: CAOS (dogfooding — a fábrica padroniza a si mesma) + LICEU (procedência
        canônica) + DIKE (verificação independente)
      - Ondas 2-26: cada squad-alvo se torna executor da própria onda, com Caos
        fornecendo skills auxiliares (busca-de-referencias, vigia-de-ecossistema,
        consulta-ao-registro) e Liceu fornecendo procedência quando linhagem/mente
        não for óbvia; DIKE verifica INDEPENDENTE em toda onda

      Alternativas rejeitadas:
        (a) Fazer tudo Hermes centralizado — inviável: 26 squads têm expertise própria
        (b) Delegar a Prometeu (framework de engenharia) — Prometeu é framework, não
            executor; ele fornece skills mas não redesenha squads
        (c) Delegar a Dedalo (skill-centric) — Dedalo é meta-agent de Claude Code, não
            padronizador de squads
    decomposicao:
      - parte: "Ratificação técnica: framework do Liceu (Fase 1) + 14 modelos do Caos + hierarquia 5 camadas de AGENTS.md são a base canônica do Método; consolidados em METODO-KOLDEN.md"
        executivo_destino: "hefesto"
        motivo: "CTO ratifica que a arquitetura convergiu para o padrão canônico"
      - parte: "Onda 1 = Caos piloto (dogfooding); 6 sub-ondas herdando m-20260705 + escrever METODO-KOLDEN.md v1.0"
        executivo_destino: "hefesto"
        motivo: "Caos redesenha Caos + Caos escreve o Método — meta-loop; Hefesto orquestra"
      - parte: "Ondas 2-26 = aplicar Método aos 25 squads restantes em grupos A-G"
        executivo_destino: "hefesto"
        motivo: "Hefesto delega cada onda ao squad-alvo com Dike verificando"
    paralelo: []
    consolidacao: |
      Ao fim da Onda 1: METODO-KOLDEN.md v1.0 canônico + Caos padronizado + CAOS-CL-002
      canônico + skills /metodo e /padronizar. Handoff para Onda 2 (Hermes ou Prometeu).

