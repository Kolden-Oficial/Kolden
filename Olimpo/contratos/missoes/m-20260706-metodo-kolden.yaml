  # ── CAMADA 2 — HERMES (tradução de intenção) ────────────────────────────────
  hermes:
    dor:
      objetivo_real: |
        Consolidar em documento único (`METODO-KOLDEN.md` na raiz) a metodologia
        unificada de padronização de agents da Kolden, absorvendo (a) o framework
        arquitetura-de-agents-kolden do Liceu (12 princípios + 5 camadas + 8 critérios
        canônicos — produzido na Fase 1, `m-20260704`); (b) os 14 modelos canônicos do
        Caos (norma imposta via Ritual 9 fases); (c) a hierarquia de 5 camadas
        (Humano→Hermes→Zeus→Executivos→Operacional) do AGENTS.md; (d) as convenções
        PT-BR+kebab-case+mitologia grega+REUSE>ADAPT>CREATE; (e) a convenção `@` vs `/`
        (hoje descentralizada em 3 arquivos); (f) os 5 buckets de capacidade validados
        em produção. Ao mesmo tempo, PADRONIZAR os 26 squads existentes (~261 agentes)
        aplicando o Método um a um em 26 ondas sequenciais (1 onda = 1 squad).

        Reenquadramento: Contrato `m-20260705` (redesenho do Caos, Onda 1 concluída
        ontem, Ondas 2-6 pendentes) vira SUB-CONTRATO da Onda 1 deste Contrato-mãe.
        Nada perdido; as 5 sub-ondas do Caos passam a ser Sub-ondas 1.1-1.5 aqui;
        Sub-onda 1.6 (nova) escreve `METODO-KOLDEN.md` v1.0 consolidando aprendizados.

        Objetivo estrutural: coeficiente de variação estrutural entre squads cai de
        120% (medido pré-Método) para <20%; convenção `@` vs `/` centralizada em
        METODO; anatomia canônica de SQUAD + AGENT declarada com procedência a
        Turing/Simon/Minsky/Karpathy/Russell/Bostrom/Brooks/Amodei/Yao/Chase/Anthropic.
      criterio_de_sucesso: |
        Ao fim da Onda 1 (Caos):
        1. `C:\Kolden\METODO-KOLDEN.md` v1.0 publicado com 12 seções mapeadas + rastro
           de referências completo (grep reverso bate com `Liceu/frameworks/...
           /procedencia.md`)
        2. Caos passa 8/8 critérios canônicos — smoke test cria agent especialista
           em vendas SaaS enterprise que passa
        3. Variação estrutural do Caos cai para <10% desvio da anatomia canônica
        4. CAOS-CL-002 vira checklist canônico (era draft na Onda 1 do `m-20260705`)
        5. Skills `/metodo` e `/padronizar <squad>` criadas em `C:\Kolden\.claude\skills\`
        6. Comando `@dike` definido (Dike nasce como agent funcional se decisão de
           Onda 1 assim determinar)

        Ao fim das 26 ondas totais:
        1. Todos os 26 squads têm CLAUDE.md + squad.yaml + agents/*.md + MEMORY.md
           conforme anatomia canônica do METODO
        2. Coeficiente de variação estrutural cai de 120% para <20%
        3. `AGENTS.md` atualizado apontando cada squad para conformidade com o Método
        4. Convenção `@` vs `/` centralizada em METODO; arquivos antigos apontam para
           METODO como fonte
        5. Smoke tests independentes por Dike em amostra de 3 squads (Grupo B + E + F)
           confirmam Método aplicável cross-domínio
      restricoes:
