      Consolidar Método Kolden em documento único METODO-KOLDEN.md na raiz. Onda 1 =
      Caos como piloto (dogfooding — a fábrica padroniza a si mesma antes de padronizar
      as outras 25). Ondas 2-26 aplicam o Método aos demais 25 squads em ordem sugerida
      (grupos A-G). Cada onda produz 5 artefatos padronizados + aplica diff cirúrgico +
      Dike verifica independente. Gate humano OBRIGATÓRIO entre cada onda. Contrato
      m-20260705 fica reenquadrado como sub-contrato da Onda 1 (nada perdido).
