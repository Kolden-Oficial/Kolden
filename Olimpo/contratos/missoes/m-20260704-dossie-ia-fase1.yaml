      especificacao_tecnica: |
        POLÍTICA DE IA DA KOLDEN (ratificada nesta missão):
          - A Kolden é vendor-agnóstica em LLM (CLAUDE.md §1) — dossiê deve refletir
            isso: mapear TODOS os labs frontier (OpenAI, Anthropic, Google DeepMind,
            Meta AI, Mistral, DeepSeek, xAI, Cohere, Kimi/Moonshot, Zhipu AI, Alibaba)
            sem preferência tribal.
          - Ecossistema chinês (DeepSeek R1, Kimi K2.5, GLM-5, Qwen 3.5) tem peso
            equivalente aos anglófonos — Seção 6 do hub é obrigatória, não opcional.
          - Soberania de dados é primeira classe — arquiteturas de agents privilegiadas
            no framework Kolden devem suportar deploy local/self-hosted (Ollama,
            open-weights com licenças permissivas MIT/Apache 2.0).

        HANDOFF AO LICEU:
          - Contrato: aplicar `dissecacao-de-mente` (9 fases) a cada mente das Ondas 1-5,
            e `dissecacao-de-mente` sobre paradigmas (não pessoas) na Onda 6.
          - Ordem das ondas: 1 → 2 → 3 → 4 → 5 → 6, sequencial (rate-limit).
          - Fan-out interno OK dentro da onda: `biografo` + `cartografo-de-modelos` +
            `ceptico-verificador` + `lexicografo` em paralelo por mente (≤3 mentes por
            wave interna para não estourar rate-limit).
          - Onda 6: primeiro LER o dossiê existente (`raciocínio-computacional-...md`)
            para citar e estender, nunca recompilar. Depois consultar Context7 + GitHub
            + HuggingFace para docs canônicas de cada paradigma (ReAct paper 2022,
            CoT paper 2022, AutoGPT repo 2023, LangChain docs, etc.).
          - Após Onda 6: `sintetizador` aplica `sintese-de-framework` sobre as 4
            linhagens principais + a Seção 5 preservada → produz
            `Liceu/frameworks/arquitetura-de-agents-kolden/framework.md` com
            `procedencia.md` rastreável.
          - `bibliotecario` costura o hub e preenche `indice.yaml`.
      handoff_operacional:
        squad: "liceu"
        artefato: |
          Fase 1 completa:
          - Hub expandido (raciocínio-computacional-...md com 10 seções, Seção 5 preservada)
          - ~26 dossiês de mentes/paradigmas em Liceu/mentes/<id>/dossie.md
