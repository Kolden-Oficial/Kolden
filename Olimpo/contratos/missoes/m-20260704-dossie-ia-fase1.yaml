  # ── CAMADA 2 — HERMES (tradução de intenção) ────────────────────────────────
  hermes:
    dor:
      objetivo_real: |
        Produzir um DOSSIÊ COMPLETO DE ESTUDO SOBRE INTELIGÊNCIA ARTIFICIAL como base
        teórica canônica da Kolden — mapeando (a) os maiores nomes/criadores da IA
        (Turing, McCarthy, Minsky, Shannon, Hinton, LeCun, Bengio, Vaswani, Sutskever,
        Karpathy, Fei-Fei Li, Altman, Amodei, Russell, Bostrom, entre outros), (b) suas
        linhagens intelectuais (IA simbólica → conexionismo → transformers → agents), e
        (c) as arquiteturas de agents modernos por paradigma (ReAct, CoT, ToT, AutoGPT,
        LangChain, LangGraph, CrewAI, AutoGen, MCP). O dossiê é o INSUMO da FASE 2
        (redesenho da arquitetura oficial dos agents da Kolden), que será uma sessão
        futura fora desta missão.

        Estruturalmente: hub-and-spoke. O HUB expande o dossiê existente
        `sobre-a-empresa/_conhecimento-institucional/aiox-kolden/raciocínio-computacional-e-arquiteturas-agentic-uma-análise-holística-da.md`
        (242 linhas, NotebookLM 2026-06-30) preservando seu conteúdo como "Seção 5 —
        Estado da Arte 2026" e envolvendo com 9 outras seções (linha do tempo,
        genealogia, arquiteturas por paradigma, ecossistema chinês, safety, implicações
        Kolden, índice). Os SPOKES são dossiês por mente em `Liceu/mentes/<id>/dossie.md`
        seguindo o `_modelo-dossie.md` do Liceu (8 seções + linhagem bidirecional +
        veto de candura fato×folclore).
      criterio_de_sucesso: |
        Ao final da Fase 1:
        1. Contrato lavrado e Onda 1 executada (mínimo) — os 6 fundadores clássicos
           dissecados com dossiê no padrão Liceu passando em LICEU-CL-001.
        2. Hub (arquivo `raciocínio-computacional-...md`) expandido com Seção 5 preservada.
        3. Linhagens principais mapeadas em `Liceu/linhagens/` com prova de contato em
           cada aresta (veto VETO_SEM_LINHAGEM).
        4. Framework operacional Kolden destilado em
           `Liceu/frameworks/arquitetura-de-agents-kolden/framework.md` +
           `procedencia.md` — este é o insumo direto da Fase 2.
        5. Dike reconcilia TPND=0 na subida.
        6. Smoke tests manuais passam (`@liceu quem influenciou Hinton?` → puxa
           Rumelhart/Rosenblatt do dossiê; `@liceu qual a diferença entre ReAct e
           Chain-of-Thought?` → puxa dos dossiês Onda 6).
