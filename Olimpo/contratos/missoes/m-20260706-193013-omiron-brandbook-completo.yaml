    input_cru: '@Hermes com base em tudo que você sabe sobre a c:\Kolden\sobre-a-empresa\Projetos\Ativos\omiron vamos criar o brandbook completo para a marca, use as referências, fontes, tudo que você sabe para criarmos o brandbook, seja cauteloso e acione os melhores squads possiveis para essa funcionalidade, precisamos ser o mais assertivo possivel, pois vamos apresentar para o Ariosto Ribeiro.'
