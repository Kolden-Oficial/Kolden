    ordem_de_maquina: |
      MISSÃO CAMADA-2 CONSOLIDADA. Descer ao Zeus com decomposição PRÉ-DESENHADA
      (validada pelo Ronan via AskUserQuestion 2026-07-06):

      ONDA 1 (paralela) — Aglaia + Harmonia
        Aglaia (brand-chief): 5 markdowns em omiron/brandbook/
          - 00-indice.md
          - 01-posicionamento.md (arquétipo Sábio, público, diferenciação, brand idea)
          - 02-voz-da-marca.md (tom 4 dimensões, do/don't, vocabulário, cadência)
          - 03-identidade-visual.md (símbolo, paleta HEX, tipografia, WCAG 8x8)
          - 04-aplicacoes.md (app, receita física papiro, Instagram, e-mail, deck)
          - 05-manual-operacional.md (governança, checklist pré-publicação, acessibilidade)
        Handoff Aglaia→Caliope obrigatório para o brand-voice.md.
        Handoff Aglaia→Harmonia obrigatório na fronteira visual→tokens.
        Harmonia (design-chief): design-system paralelo em omiron/design-system/
          - 01-fundamentos/ (cores.md, tipografia.md, grafismos.md, tom-visual.md)
          - 02-tokens/ (tokens.json DTCG + tokens.css + tailwind.tokens.js + leia-me.md)
          - 03-componentes/ (leia-me.md com Button, Input, Badge, Card, Table, Dialog, Toast)
        Insumo obrigatório: paleta-hex-extraida.md (extraída dos slides 18-22).

      ONDA 2 — Orfeu (narrativa)
        Redigir manifesto + narrativa dos 4 pilares + copy de onboarding + tom do
        mentor Quíron + proposta de alternativa iconográfica para Marco Aurélio
        (que tem 0 pins reais no Pinterest do cliente). Salvar em
        omiron/brandbook/narrativa/ (manifesto.md, pilares.md, mentor-quiron.md,
        onboarding-copy.md, alternativa-marco-aurelio.md).

      ONDA 3 — Nomos (gate compliance)
        Revisar TUDO da Onda 1+2. Devolver checklist em
        omiron/brandbook/compliance-checklist.md com:
          - Claim médico proibido/aprovado (CFM Res 2.314/2022, Res 2.336/2023)
          - LGPD Art 11 (dado sensível saúde) — vocabulário permitido
          - Tom não-paternalista (auditoria linha a linha)
          - Consentimento informado — modelo para termo do app
          - Gap ANVISA (nomear como pendência para próxima rodada, não bloquear)

      ONDA 4 — Consolidação visual
        Renderizar brandbook.html (nav lateral + 7 seções + matriz WCAG) em
        omiron/brandbook.html. Renderizar deck padrão Rosie em
        omiron/apresentacao/index.html (fonte omiron/apresentacao/deck-conteudo.md).

      GATE FINAL — Dike
        Executar gate-de-subida.sh, produzir matriz de reconciliação de gaps em
        aberto (não escondê-los), veredito sobe/volta-para-correcao. Sem commit.
