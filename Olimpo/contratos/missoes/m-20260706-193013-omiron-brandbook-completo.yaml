  hermes:
    dor:
      objetivo_real: |
        Entregar brandbook COMPLETO da marca Omiron (app de monitoramento terapêutico
        psiquiátrico white-label para a Clínica do Dr. Ariosto Filho / "Ariosto Ribeiro",
        Belo Horizonte) num único empacotamento apresentável, aproveitando 60% de material
        já travado nos dossiês internos (arquétipo, tipografia, paleta visual, metodologia
        de 4 pilares, cenário-âncora slide 18) e fechando os gaps críticos (paleta em HEX
        extraída dos thumbnails Canva, iconografia alternativa para Marco Aurélio que tem
        zero pins reais no Pinterest do cliente, matriz de reconciliação de tensões abertas).
        Formato de saída dual: (a) brandbook estrutural em Markdown + brandbook.html renderizado;
        (b) deck de apresentação padrão Rosie para reunião presencial com Dr. Ariosto (próxima
        janela conhecida: 08/07/2026).
      criterio_de_sucesso: |
        1. Brandbook em 5 capítulos MD seguindo o molde NutriOS Pro v3
           (00-indice, 01-posicionamento, 02-voz-da-marca, 03-identidade-visual,
           04-aplicacoes, 05-manual-operacional) em
           sobre-a-empresa/Projetos/Ativos/omiron/brandbook/.
        2. Design system paralelo em omiron/design-system/ com fundamentos
           (cores, tipografia, grafismos, tom-visual), tokens DTCG (tokens.json + tokens.css
           + tailwind.tokens.js), e componentes documentados (Button, Input, Badge, Card,
           Table, Dialog, Toast).
        3. brandbook.html renderizado com nav lateral sticky + 7 seções + matriz WCAG.
        4. Deck de apresentação em omiron/apresentacao/ (index.html + deck-conteudo.md)
           padrão Rosie: full-height, scroll-snap, nav 220px, tipografia Great Vibes + Garamond.
        5. Paleta em HEX extraída e documentada (não mais em prosa).
        6. Narrativa dos 4 pilares (Corpo/Pensamento/Sentimento/Espírito) com figuras míticas
           costurada por Orfeu — manifesto, copy do mentor Quíron, alternativa iconográfica
           para Marco Aurélio.
        7. Checklist Nomos aprovado: zero claim médico proibido (CFM Res 2.314/2022),
           zero promessa de privacidade sem lastro RLS (LGPD Art 11 — dado sensível saúde),
           tom não-paternalista, sem infantilização.
        8. Matriz de reconciliação de gaps abertos (16 imagens pendentes de envio,
           ritual do Quíron não executado no Caos, NDA formal não assinado, tensão
           maximalismo × UX simples ainda em aberto) — nomeada, não escondida.
        9. Dike verifica completude, aponta degrau de quebra se houver.
      restricoes:
        prazo: |
          Sessão de trabalho ÚNICA. Reunião 08/07/2026 com Ariosto é o horizonte de uso.
          Sem commit até ordem explícita do Ronan (política estrita CLAUDE.md §6).
        orcamento: |
          2 rodadas (teto padrão Camada-2). Se estourar, escala ao Ronan e não fura.
        proibicoes:
          - Nada de commit/push até ordem explícita.
          - Nada de alterar código do app Omiron (AGENTS.md do projeto avisa Next.js
            com breaking changes — brandbook não toca src/).
          - Nada de claim médico ("cura", "diagnóstico", "trate você mesmo"), nem promise
            de eficácia clínica sem lastro em literatura + supervisão médica.
          - Nada de "app de saúde mental fofo" — Ariosto rejeitou explicitamente na
            reunião 01/07. Sem mascotes, avatares abstratos, bolinhas gradientes.
          - Nada de tom paternalista/infantilizador — público é adulto de excelência,
            não "doente psiquiátrico".
          - Nada de exposição de PII em screenshots ou mockups do brandbook.
          - Nada de pesquisa web sem confirmar ferramenta + nível no chat
            (política global gate-busca.cjs).
      contexto:
        - "Cliente: Dr. Ariosto Filho (referido também como 'Ariosto Ribeiro'), psiquiatra, Clínica Omiron BH. Perfil erudito, maximalista, aspira caneta Montblanc, curador visual de 95 pins Pinterest (Alexandria, mitologia, arquitetura clássica, Van Gogh, Hokusai, Caspar David Friedrich)."
        - "Produto: app white-label Next.js + Supabase para monitoramento terapêutico. 7 áreas de check-in (Medicação, Alimentação, Movimento, Conexões Sociais, Estresse, Produtividade, Tóxicos). Escalas HAM-A/HAM-D/YMRS/Madres/Cococolos. Chat realtime. Gamificação com planta virtual (4 estágios). Fase 1 = piloto 5-10 pacientes jul/2026. Fase 2 = SaaS B2B (R$299-599/clínica/mês) em 2027."
        - "Decisões travadas (não reabrir): arquétipo Sábio/Mestre; tipografia Great Vibes (títulos) + Garamond (corpo); paleta preto/dourado/marfim/laranja-âmbar/marrom-couro; elemento unificador papiro; metodologia 4 pilares Corpo(Sansão)/Pensamento(Marco Aurélio)/Sentimento(Psiquê)/Espírito(Hécate); mentor IA Quíron; slogan 'Monitoramento próximo. Tratamento real.'"
        - "Cenário-âncora visual: slide 18 Canva (escadaria monumental + estátuas em nichos + colunas neoclássicas + abóbada). Vencedor confirmado na reunião 01/07."
        - "Molde de entrega: rebrand NutriOS Pro v3 (Contrato m-20260705). Aglaia+Harmonia paralelos, entregam MD + tokens DTCG + brandbook.html. Padrão validado."
        - "Molde de deck: Rosie 2026-07-01 (deck.html full-height, nav lateral 220px, scroll-snap, fio-loop de cor primária em palavras-chave, footer timestamp + brand)."
        - "Gaps abertos nomeados (não bloqueantes se documentados na matriz de reconciliação): 16 imagens dos pilares pendentes de envio pelo Ariosto, ritual do Quíron não executado no Caos, NDA formal não assinado, tensão maximalismo × UX simples viva, tipografia dos slides 1-17 do deck comercial ainda sans-serif (precisa ser rerenderizada)."
        - "Compliance: CFM Res 2.314/2022 (telemedicina — app é engajamento terapêutico, NÃO teleconsulta nem prontuário), LGPD Art 11 (dado sensível saúde exige base legal + RLS já especificado NFR-1), ANVISA (ainda não mapeado), CFP (não aplicável, é psiquiatria)."
        - "Referências internas úteis para os squads: PRD em omiron/docs/prd-omiron-app.md; decisões consolidadas em omiron/docs/pesquisa-referencias/decisoes-consolidadas-brand.md; mapa mental em mapa-mental-consolidado.md; ata reunião em reuniao-2026-07-01-transcricao-e-decisoes.md; análise Pinterest em pinterest/pinterest-ariosto-analise.md; deck Canva analisado em canva-deck-referencias-visuais.md; thumbnails em canva-thumbnails/slide-18-vencedor.png (e 19-22)."
