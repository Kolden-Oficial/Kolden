      para Marco Aurélio, matriz de reconciliação de 5 gaps abertos, compliance clínico).
      A decomposição do Hermes é sólida — molde NutriOS v3 aplicável — mas requer 3 ajustes
      cirúrgicos: (1) Orfeu passa a operar EM PARALELO na Onda 1 (não como Onda 2 sequencial)
      porque a narrativa dos 4 pilares e a alternativa a Marco Aurélio ALIMENTAM o 01-posicionamento
