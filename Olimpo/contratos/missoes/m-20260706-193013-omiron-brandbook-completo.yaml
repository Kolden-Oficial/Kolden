      03-identidade-visual. (3) Caliope permanece como sub-agente dentro do escopo Aglaia
      para 02-voz-da-marca (handoff intra-squad, não sobe como executivo). Nomos como gate
      ANTES de Dike é correto (Nomos = compliance clínico; Dike = completude/hash; filtros
      complementares, não redundantes). Consolidação visual em Onda 4 mantida. Risco vivo
      declarado: tensão maximalismo × UX simples — decidir na reunião 08/07, não travar entrega.
