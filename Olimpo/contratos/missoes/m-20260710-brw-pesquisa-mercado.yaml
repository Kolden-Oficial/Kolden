  # ── CAMADA 2 — HERMES (tradução de intenção) ────────────────────────────────
  hermes:
    dor:
      objetivo_real: >
        Acionar o squad de pesquisa (Argos) para, ancorado no brandbook v1 da BRW (eixo curadoria
        industrial B2B; ICP hotelaria + investidor Airbnb), produzir (1) um dossiê dos principais
        concorrentes e (2) uma lista de prospecção de lugares/organizações na Bahia inteira (polos
        turísticos) que representem excelente oportunidade — hotelaria E studios/short-stay.
      criterio_de_sucesso: >
        Dois artefatos em brw-movelaria/pesquisa/: (a) dossie-concorrentes.md — 8-12 concorrentes
        (locais Salvador + nacionais que atuam na BA) com posicionamento, portfólio, canais, presença
        paga (ad library), preço/nível e onde a BRW ganha/perde vs cada um; matriz comparativa + mapa
        de posicionamento. (b) prospeccao-bahia.md — alvos priorizados por polo (Salvador/RMS, Praia
        do Forte, Costa do Sauípe, Porto Seguro, Ilhéus, Morro de São Paulo, Chapada) em 2 trilhas
        (hotelaria + incorporadoras/empreendimentos de studios), cada alvo com: quem é, por que é
        oportunidade (sinal de compra), tamanho estimado, contato/porta-de-entrada e gancho de pitch
        ancorado no brandbook. Fontes citadas (URL). Achados marcados por confiança (verificado ×
        indício). Ratificável pelo Ronan.
      restricoes:
        prazo: "1 sessão"
        orcamento: "pesquisa web autorizada — Firecrawl+Exa, nível máximo (gate de sessão registrado)"
        proibicoes:
          - "não inventar dados: todo número/afirmação com fonte (URL) ou marcado como estimativa/indício"
          - "não fazer outreach/contato real — só mapear alvos e portas-de-entrada"
          - "não usar WebSearch nativa da Anthropic (soberania) — só Firecrawl e Exa"
          - "não cristalizar como verdade — pesquisa é insumo; validação de campo fica com o cliente"
      contexto:
        - "Ancora no brandbook v1: sobre-a-empresa/Projetos/Ativos/brw-movelaria/marca/ (posicionamento.md tem POP/POD e concorrentes; premissas-e-premorte.md tem ICP)"
        - "Concorrentes já citados no dossiê: locais Salvador = Básica Home, Home Design, Efeito; nacionais hotelaria/corporativo = SYMM, Sular, Rudnick, Breton, ESSANTO, Venture, Sancapel; residencial (não-core) = Alfa Planejados, Bahia Closet"
        - "Cases/prova social da BRW: Iberostar (8 anos), Accor, hotel do Flamengo, Singulari, Alphaville 24 casas"
        - "DECISÕES DO RONAN (travadas): ferramentas Firecrawl+Exa nível máximo; geografia = Bahia inteira (polos turísticos); foco = hotelaria E studios/Airbnb (ambos)"
      nivel_de_risco: "amarelo"
    dor_completo: true
    perguntas_abertas: []
    matriz_de_risco:
      reversibilidade: "reversivel"
      impacto: "medio"
      faixa: "amarelo"
      autonomia: "mostra-antes"   # pesquisa web + lista de prospecção passam por gate humano antes de uso
    ordem_de_maquina: >
