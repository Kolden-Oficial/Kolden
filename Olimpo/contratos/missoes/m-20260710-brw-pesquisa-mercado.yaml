      4 artefatos em brw-movelaria/pesquisa/ (dossie-concorrentes, prospeccao-hotelaria-bahia,
      prospeccao-studios-bahia, prospeccao-bahia consolidado). Onda 1 validou a herança do gate de
      busca por subagentes (Firecrawl+Exa correram sem bloqueio). Coleta 100% soberana (zero WebSearch
      nativa). Achado adversarial que fortalece a marca: a 3M já disputa o pitch Airbnb/ROI — sinalizado
