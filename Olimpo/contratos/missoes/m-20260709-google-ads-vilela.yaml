        motivo: "Caliope canônico para copy persuasiva."
      - parte: "Landing page fixes (9 gaps) + snippet gclid + hidden fields"
        executivo_destino: "hefesto"
        motivo: "Harmonia canônica para dev de front-end + integração de tag."
