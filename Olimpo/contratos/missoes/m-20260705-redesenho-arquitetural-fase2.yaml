      - parte: "Execução das 6 ondas (diagnóstico + redesign de identidade+ritual + redesign núcleo+modelos + MCP Camada 1 + safety dashboard + predictions scorecard + costura final)"
        executivo_destino: "hefesto"
        motivo: "Hefesto delega diretamente ao caos:caos-chief como squad operacional (dogfooding); Liceu fica consultor de procedência; Dike verifica independente"
    paralelo: []
