      Consolidação final (pós-Onda 6):
      - Caos operando sob 12 princípios canônicos + 5 camadas do framework + 8 critérios como
        gate duro no Ritual.
      - MCP em Camada 1 (aplicado ou com roteiro de migração publicado se transição gradual).
      - Dashboard de safety metrics acionável (esquema + primeira população).
      - Primeiro Predictions Scorecard Kolden publicado (jan/2027 como primeiro marco de
        revisão anual).
      - Handoff explícito ao Ronan para decidir sobre Fase 3 (implementação real de MCP nos
        wrappers + dashboard interativo em Hermes, se necessário).
    arbitragem: null
    assinatura: { por: "zeus", em: "2026-07-05T00:00:00-03:00" }

  # ── CAMADA 4 — EXECUTIVOS (especificação técnica) ───────────────────────────
  executivos:
    - agente: "hefesto"
      especificacao_tecnica: |
        POLÍTICA TÉCNICA DE ARQUITETURA DE AGENTS (ratificada nesta missão):
          - O framework `Liceu/frameworks/arquitetura-de-agents-kolden/framework.md` (v1.0-fase1)
            é NORMA CANÔNICA para todo squad Kolden que produza ou consuma agents. Caos, sendo a
            fábrica, é o PRIMEIRO a ser realinhado; demais squads virão em contratos subsequentes
            se necessário.
          - Toda mudança arquitetural em Caos precisa ter PROCEDÊNCIA CITADA
            (`linhagem/mente/obra/ano` de `procedencia.md`). Sem procedência, mudança é rejeitada
            (VETO herdado do Liceu VETO_FRAMEWORK_SEM_PROCEDENCIA).
          - MCP (Princípio 12) é DESTINO ARQUITETURAL para todos os wrappers de tool no Caos.
            Migração pode ser gradual (dupla-vida durante transição) mas o alvo é claro.
          - Safety como capability (Amodei — Onda 4 Fase 1): dashboard de métricas de safety
            não é opcional; é infra de primeira classe do Caos.
          - Predictions Scorecard (Brooks — Onda 5 Fase 1): a Kolden se compromete publicamente
            com predições datadas + falsificáveis + revisão anual sobre arquiteturas de agents.
            Método científico, não marketing.

        HANDOFF AO CAOS:
          - Contrato: aplicar Ritual adaptado de 6 ondas descrito em `hermes.ordem_de_maquina`.
          - Ordem estrita: 1 → 2 → 3 → 4 → 5 → 6, sequencial (rate-limit; validado 2026-06-27).
          - Gate humano OBRIGATÓRIO entre Onda 1 e Onda 2 (não negociável — é a principal
            trava de segurança).
          - Fan-out interno OK dentro de cada onda (≤3 subagentes por vez): na Onda 1,
            paralelizar por tipo de arquivo-alvo (CLAUDE.md + constituicao.md em um sub,
            nucleo/ARQUITETURA.md em outro, modelos/*.md em outro); nas Ondas 2-5, um sub por
            arquivo-alvo mais afetado.
          - Consultor de procedência = Liceu (bibliotecario ou sintetizador): quando o
            caos-chief propuser mudança e a linhagem/mente/obra não estiver clara, ele CONSULTA
            o Liceu antes de gravar diff. Liceu responde por referência ao dossiê existente.
          - Verificação Dike = INDEPENDENTE, obrigatória por onda; checklist derivado dos 12+8
            (a criar como CAOS-CL-002 na Onda 1 como sub-entregável).
          - Consulta a docs externas: SÓ para especificação MCP (modelcontextprotocol.io),
            Anthropic RSP e exemplos Brooks Scorecard. Cada consulta web autorizada via
            gate-busca (Firecrawl padrão).

        SUB-ENTREGÁVEIS OBRIGATÓRIOS:
          - CAOS-CL-002: checklist derivado dos 12 princípios + 8 critérios, criado na Onda 1
            como parte do diagnóstico, usado por Dike nas Ondas 2-6.
