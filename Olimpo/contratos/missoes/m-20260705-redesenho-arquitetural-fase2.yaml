      autonomia: "executa-e-para-em-gate"
    ordem_de_maquina: |
      Executar 6 ondas sequenciais em sub-sessões dedicadas em `C:\Kolden\Caos\`, com gate
      humano obrigatório entre Onda 1 (diagnóstico read-only) e Onda 2 (primeiro redesign).

      ORDEM ESTRITA:

      Onda 1 — DIAGNÓSTICO (READ-ONLY, sem editar nada em Caos/):
        * Ler framework.md + procedencia.md do Liceu (fonte de verdade dos 12 princípios + 8
          critérios).
        * Ler todos os 6 arquivos-alvo do Caos + os 12 modelos/*.md.
        * Grep reverso: para cada princípio/critério, achar (a) onde o Caos já implementa,
          (b) onde diverge, (c) onde é silencioso.
        * Produzir matriz em `Caos/registros/redesenho-fase2/onda-1-diagnostico/matriz-de-conformidade.md`
          + `achados.jsonl` (append-only, padrão ledger validado 2026-06-28) + `sumario-executivo.md`.
        * Ritual de encerramento em `Caos/MEMORY.md`.
        * PARAR. Aguardar aprovação humana.

      Ondas 2-6 (SÓ APÓS APROVAÇÃO):

      Onda 2 — REDESENHO IDENTIDADE + RITUAL:
        * Reescrita cirúrgica de `Caos/CLAUDE.md` (ancoragem nos 12 princípios) e
          `Caos/constituicao.md` (constituição declarada — Princípio 6).
        * Revisão do Ritual de 9 fases para embutir 8 critérios como gates duros (constituição
          declarada, ASL, interpretabilidade, incerteza, corrigibility, bounded rationality,
          predictions scorecard aplicável, x-risk-relevante-para-domínio).
        * Cada mudança acompanhada de "procedência: <linhagem>/<mente>/<obra>/<ano>".
        * Diff proposto, NÃO aplicado. Aguarda aprovação por onda.

      Onda 3 — REDESENHO NÚCLEO + MODELOS:
        * Reescrita cirúrgica de `Caos/nucleo/ARQUITETURA.md` (5 camadas atuais → 5 camadas
          canônicas do framework Parte II).
        * Revisão dos 12 arquivos em `Caos/modelos/*.md` para embutir os campos requeridos por
          princípio (aspiration_criteria no perfil.md; constitution embedding no system-prompt-base.md;
          ASL declaration no cartao-de-identidade.md; interpretability_expectation no
          prd-de-ia.md; predictions_scorecard reference no roteiro-de-teste.md; MCP tools
          declaration no ferramentas.md).
        * Diff proposto. Aguarda aprovação.

      Onda 4 — MCP CAMADA 1 (mapeamento + planejamento):
        * Inventário completo dos wrappers proprietários existentes (grep por skills-como-tools:
          `busca-de-referencias`, `consulta-ao-registro`, `vigia-de-ecossistema`, outras que
          o diagnóstico identificar).
        * Mapa de dependências: quais skills/agents consomem cada wrapper.
        * Plano de migração escalonada para MCP (gradual, com dupla-vida durante transição se
          impacto for alto).
        * Diff proposto no `ferramentas.md` do Caos. Aguarda aprovação.

      Onda 5 — SAFETY DASHBOARD + PREDICTIONS SCORECARD:
        * Especificar schema de dashboard de safety metrics estilo Amodei RSP: ASL por agent,
          interpretability score (heurística inicial), red-team log, constitutional principles
          ativos, dashboard localização (arquivo estático + potencial UI futura em Hermes).
        * Estabelecer Predictions Scorecard Kolden: template `predicoes.yaml` +
          `revisao-anual.md` + cadência (marco anual 2027-01-01 primeiro checkpoint), com
          predições iniciais sobre adoção MCP, próxima geração de paradigmas, saturação de
          LLM base, safety incidents esperados.
        * Diffs propostos. Aguarda aprovação.

      Onda 6 — COSTURA FINAL + SMOKE TESTS + HANDOFF:
        * Aplicar diffs aprovados (sequencial, uma seção por vez).
        * Smoke tests: (a) `@caos crie agent especialista em vendas de SaaS enterprise` →
          agent gerado passa 8/8 critérios; (b) inspeção do agent gerado por Dike delta.
        * Atualizar `Caos/MEMORY.md` com padrões aprendidos ao longo das 6 ondas.
        * Se Ronan aprovar: fechamento Fase 2. Se surgir escopo residual, contrato Fase 3
          (implementação real de MCP + dashboard interativo) fica lavrado como sugestão.

      REGRA GERAL: entre ondas, working tree limpo, artefato-em-disco, ritual de encerramento
      + gate humano. Nunca duas ondas na mesma sub-sessão. Fan-out interno ≤3 subagentes.
    assinatura: { por: "hermes", em: "2026-07-05T00:00:00-03:00" }

  # ── CAMADA 3 — ZEUS (decomposição + roteamento) ─────────────────────────────
  zeus:
    diagnostico: |
      Missão de REDESENHO ARQUITETURAL, tier META (arquitetura oficial dos agents da Kolden é
      infraestrutura de segunda ordem — muda tudo abaixo). Executivo natural é HEFESTO (CTO —
      arquitetura de sistemas de agents + engenharia de tooling), não Atena (que assinou a
      Fase 1 como CAIO de política de IA — a estratégia já foi ratificada; agora é engenharia).

      Hefesto delega a execução operacional ao próprio CAOS (dogfooding — Caos redesenha
      Caos) com verificação Dike INDEPENDENTE e obrigatória (checklist derivado dos 12
      princípios + 8 critérios; padrão herdado da Fase 1 onde Dike verificou o Liceu por
      LICEU-CL-001). Alternativas rejeitadas:
        (a) Hefesto delegar a Dedalo/multi-agent-arch — inviável: Dedalo ainda é skill-centric,
            não squad completo; e Caos é o objeto, ele mesmo executa é mais direto.
        (b) Liceu executar redesign — não é o método do Liceu; Liceu produz conhecimento, não
            reescreve constituição de squad-alvo. Liceu fica como CONSULTOR DE PROCEDÊNCIA
            (validador de "essa mudança tem linhagem/mente/obra rastreável?").

      Apoio operacional: Liceu (procedência rastreável de cada mudança); Argos (pesquisa em
      docs Anthropic RSP/MCP spec se necessário); Dike (verificação independente + gate).

      Nível de risco AMARELO: Onda 1 é verde (read-only); Ondas 2-6 tocam o núcleo de
      identidade do Caos (CLAUDE.md, constituicao.md, modelos/*) — impacto alto se errado,
      reversível via git. Autonomia = executa-e-para-em-gate (não é executa-e-relata).
    decomposicao:
