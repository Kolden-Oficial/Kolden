# Contrato de Missão — Redesenho da Arquitetura Oficial dos Agents da Kolden (Fase 2 de 2)
# Schema: ../contrato-de-missao.schema.md
# Insumo: Contrato m-20260704-dossie-ia-fase1 (Fase 1 concluída em 2026-07-04, em origin/main)
# Plan-file: pendente (será gerado na abertura da Onda 1 em C:\Kolden\Caos\)
---
missao:
  id: "m-20260705-redesenho-arquitetural-fase2"

  # ── CAMADA 1 — HUMANO (lacrada, imutável) ───────────────────────────────────
  intencao_original:
    input_cru: |
      @caos-chief lavrar Contrato de Missão m-20260705-redesenho-arquitetural-fase2 sobre
      o insumo da Fase 1 (Contrato m-20260704 concluído em 2026-07-04, publicado em origin/main).

      Leitura obrigatória antes de lavrar: (1) Liceu/frameworks/arquitetura-de-agents-kolden/
      framework.md — 12 princípios canônicos + 5 camadas + 8 critérios safety+quality + 7
      métricas + 12 anti-padrões + roteamento dinâmico + handoff Fase 2 em 8 passos; (2)
      Liceu/frameworks/arquitetura-de-agents-kolden/procedencia.md — cada princípio rastreado
      a linhagem+mente+obra+ano; (3) sobre-a-empresa/_conhecimento-institucional/aiox-kolden/
      raciocínio-computacional-... — hub expandido com Seção 8 (implicações para Kolden —
      ponte Fase 2).

      Diretiva Fase 2: auditar Caos atual (CLAUDE.md + nucleo/ARQUITETURA.md + constituicao.md
      + modelos/* + 5 camadas + Ritual de 9 fases) contra os 12 princípios + 8 critérios;
      identificar divergências; redesenhar onde diverge com justificativa por linhagem;
      implementar MCP como Camada 1 (migrar wrappers proprietários); ativar dashboard de
      safety metrics (Amodei RSP-style); publicar Predictions Scorecard Kolden (Brooks-style).
      Roteirizar em ondas sequenciais (não uma sessão). Começar por Onda 1 = DIAGNÓSTICO
      (comparação matricial atual × framework, sem escrever nada) e parar em aprovação humana
      antes de qualquer redesign.
    canal: "chat"
    recebida_em: "2026-07-05T00:00:00-03:00"
    hash: "sha256:d38fce540988a6adb41f882ff74fab45e397335f12607a43252c03d39fba0998"

  # ── CAMADA 2 — HERMES (tradução de intenção) ────────────────────────────────
  hermes:
    dor:
      objetivo_real: |
        REDESENHAR a arquitetura oficial dos agents da Kolden — encarnada hoje no squad Caos
        (fábrica de agents) — para que ela deixe de ser um artefato empírico e passe a ser
        derivada explicitamente do framework canônico produzido na Fase 1
        (`Liceu/frameworks/arquitetura-de-agents-kolden/framework.md`, v1.0-fase1).

        Concretamente, a Fase 2 entrega três resultados coordenados:

        (A) DIAGNÓSTICO MATRICIAL do Caos atual — matriz [12 princípios + 8 critérios] ×
            [CLAUDE.md do Caos + nucleo/ARQUITETURA.md + constituicao.md + modelos/* (12
            arquivos) + as 5 camadas atuais + Ritual de 9 fases] com veredito por célula
            (conforme / divergente / parcial / não-aplicável), evidência textual citada e
            severidade (crítico / alto / médio / baixo). Zero edição nesta onda.

        (B) REDESENHO ancorado por procedência — cada mudança em CLAUDE.md /
            constituicao.md / nucleo/ARQUITETURA.md / modelos/* / Ritual de 9 fases é
            justificada por linhagem + mente + obra do `procedencia.md` (ex.: "adicionar
            `aspiration_criteria` obrigatório no modelo `perfil.md` — Princípio 3, Simon 1955
            Models of Man; Russell 2019 Human Compatible").

        (C) TRÊS ATIVAÇÕES DE INFRA que operacionalizam os princípios em runtime:
            (C.1) MCP como Camada 1 Universal — mapear wrappers proprietários existentes no
                  Caos (busca-de-referencias, consulta-ao-registro, vigia-de-ecossistema,
                  outras skills-like-tools) e planejar migração para interface MCP conforme
                  Princípio 12 (Onda 6 Fase 1 — MCP dossiê 25/nov/2024, adoção OpenAI+Google+
                  Microsoft 2025).
            (C.2) Dashboard de Safety Metrics estilo Amodei/RSP — ASL declarado por agent +
                  interpretability score + red-team log + constitutional principles ativos.
                  Fonte: Amodei "Machines of Loving Grace" out/2024 + Anthropic Responsible
                  Scaling Policy 2023-2024 (Onda 4).
            (C.3) Predictions Scorecard Kolden anual, estilo Brooks — predições datadas +
                  falsificáveis + revisão pública anual sobre arquiteturas de agents,
                  cadência de adoção, ganhos de safety. Fonte: Brooks rodneybrooks.com
                  2018-2026 (Onda 5, categoria excepcional de curadoria factual).

        Filosoficamente, a Fase 2 fecha o arco iniciado em m-20260704: dossiê teórico →
        framework destilado → arquitetura Kolden reencarnada com procedência. Termina o
        empirismo "arquitetura por hábito"; começa a arquitetura por linhagem.
      criterio_de_sucesso: |
        Ao final da Fase 2:
        1. Onda 1 (DIAGNÓSTICO) entregue como matriz-de-conformidade.md + achados.jsonl +
           sumario-executivo.md em `Caos/registros/redesenho-fase2/onda-1-diagnostico/`,
           com working tree do Caos intacto (nenhum arquivo Caos editado).
        2. Aprovação humana explícita do Ronan sobre a matriz de diagnóstico antes de
           qualquer Onda de redesign disparar (GATE DURO — Ondas 2-6 marcadas
           "aguardando-aprovacao-onda-anterior" até liberação).
        3. Ondas 2-6 (redesign + infra) entregues em sub-sessões sequenciais, cada uma com:
           (a) artefato-em-disco em Caos/registros/redesenho-fase2/onda-N-<escopo>/,
           (b) diff proposto para os arquivos-alvo,
           (c) procedência rastreável de cada mudança (linhagem + mente + obra + ano),
           (d) verificação Dike delta com checklist derivado dos 12+8.
        4. Ao fim da Onda 6: Caos operando sobre nova arquitetura, com MCP em Camada 1 (ou
           roteiro cirúrgico de migração publicado se transição gradual), dashboard de safety
           metrics acionável, e primeiro Predictions Scorecard Kolden publicado com data +
           critério de falsificação.
        5. Dike reconcilia TPND=0 (nenhum princípio ou critério do framework sem endereço no
           redesenho — ou justificativa formal de por que não se aplica).
        6. Smoke tests manuais passam (`@caos crie agent especialista em vendas de SaaS
           enterprise` → agent gerado tem constitution.md declarada + aspiration_criteria +
           ASL + MCP tools; NÃO tem system-prompt monolítico "faça tudo").
      restricoes:
        prazo: "múltiplas sessões — 6 ondas sequenciais; entre ondas, artefato-em-disco + gate humano"
        orcamento: "sem teto de rodadas por onda; sem commit até ordem explícita"
        proibicoes:
          - "Não editar nenhum arquivo do Caos na Onda 1 (diagnóstico é RIGOROSAMENTE read-only)"
          - "Não disparar Onda 2+ sem aprovação humana explícita da matriz de diagnóstico da Onda 1"
          - "Não redesenhar sem procedência rastreável — toda mudança precisa citar linhagem + mente + obra + ano de procedencia.md (veto herdado do Liceu VETO_FRAMEWORK_SEM_PROCEDENCIA)"
          - "Não migrar wrapper proprietário para MCP sem sinalizar impacto em skills-que-dependem (mapeamento reverso obrigatório antes de tocar)"
          - "Não alterar o CLAUDE.md do projeto raiz (C:\\Kolden\\CLAUDE.md) — apenas o CLAUDE.md do Caos e artefatos internos ao squad"
          - "Não tocar o Liceu, Hermes, Olimpo ou outros squads — o objeto do redesenho é EXCLUSIVAMENTE o Caos + os squads que herdam padrão do Caos por convenção (mudança nesses é sub-item explícito, não colateral)"
          - "Não commitar; working tree fica limpo para Ronan pedir commit por onda"
          - "Não abrir issue, PR ou push"
          - "Não paralelizar ondas entre si (rate-limit; validado 2026-06-27); dentro da onda, fan-out interno OK (≤3 subagentes por vez)"
          - "Não afirmar divergência sem citação textual exata do arquivo-alvo (linha ou parágrafo) — vedado 'me parece que'"
          - "Não sintetizar critério novo além dos 12 princípios + 8 critérios do framework Fase 1 — se algo faltar, RETORNAR ao Liceu para complementar Fase 1, não improvisar aqui"
          - "Não pesquisar na web sem autorização de sessão registrada via gate-busca.cjs"
        gate_humano:
          - "PÓS-ONDA 1: apresentar matriz de conformidade + sumário executivo ao Ronan; aguardar decisão sobre (a) autorizar Ondas 2-6 em sequência, (b) autorizar apenas próxima onda por vez, ou (c) revisar diagnóstico antes de prosseguir"
          - "PÓS-ONDA 5 (MCP): antes de qualquer migração real de wrapper proprietário, apresentar mapa de impacto (skills que dependem, agents que consomem, estimativa de rework) e aguardar go/no-go"
      contexto:
        - "Fase 1 concluída em 2026-07-04, publicada em origin/main via commits d125d965/9791e79f/15156e07 e anteriores (Ondas 1-6 Liceu)"
        - "Framework Fase 1 = `Liceu/frameworks/arquitetura-de-agents-kolden/framework.md` (12 princípios canônicos + 5 camadas + 8 critérios safety+quality + 7 métricas por agent + 3 por squad + 12 anti-padrões + roteamento dinâmico + handoff Fase 2 em 8 passos)"
        - "Procedência rastreável em `Liceu/frameworks/arquitetura-de-agents-kolden/procedencia.md` (cada princípio → linhagem + mente + obra + ano + reafirmações cross-linhagem)"
        - "8 critérios canônicos derivados dos ganchos §7 de 5 mentes: (1) constituição declarada [Amodei]; (2) ASL definido [Amodei]; (3) interpretabilidade viável [Amodei]; (4) incerteza declarada sobre objetivos [Russell]; (5) corrigibility como propriedade emergente [Russell]; (6) bounded rationality declarada [Russell]; (7) predictions scorecard datado + falsificável [Brooks]; (8) taxonomia x-risk aplicada [Bostrom]"
        - "12 princípios canônicos derivados das 6 linhagens: (1) Universalidade Turingiana [Turing]; (2) Sociedade de Mentes [Minsky]; (3) Bounded Rationality [Simon]; (4) Software 2.0 [Karpathy]; (5) Assistance Games [Russell]; (6) Constitutional AI [Anthropic/Amodei]; (7) ASL escalonado [Amodei]; (8) Interpretabilidade obrigatória [Amodei]; (9) Embodied Grounding [Brooks]; (10) Orthogonality + safety design [Bostrom]; (11) Predictions Scorecard falsificável [Brooks]; (12) MCP como Camada Universal de Tools [Anthropic 2024]"
        - "Objeto do redesenho: squad Caos em `C:\\Kolden\\Caos\\` — CLAUDE.md (identidade), nucleo/ARQUITETURA.md (arquitetura interna), constituicao.md (constituição do squad), modelos/*.md (12 modelos herdados por todos os agents Kolden: perfil, system-prompt-base, orquestrador-base, especialista-historico, cartao-de-identidade, ferramentas, checklist-de-qualidade, roteiro-de-teste, guia-infisical, instalacao, convencao-de-cli-e-tooling, prd-de-ia), 5 camadas hierárquicas atuais, Ritual de 9 fases (fábrica de agents)"
        - "Auditoria da frota (2026-06-28, memoria project_auditoria_frota_agentes.md): 246 agentes, 5 falhas de molde sistêmicas, hierarquia não-cablada — laudo em `.claude/registros/auditoria/` é insumo suplementar para o diagnóstico"
        - "Vistoria estrutural v2 (2026-06-28, memoria project_vistoria_v2): 14 achados, sub-squad oculto `Caliope/copy-master/` — laudo em `.claude/registros/auditoria/2026-06-28-vistoria-v2/` também é insumo"
        - "Método de auditoria de frota validado (memoria feedback_auditoria_de_frota_metodo): custo O(squads); paginação por bloco; Glob recursivo `**/agents/*.md`; subagentes erram aritmética; exclusões obrigatórias `_staging` e `.venv`"
        - "Ledger de absorção em `Caos/registros/absorcao/repositorios-absorvidos.yaml` — insumo para saber quais skills/vendors foram absorvidos e podem estar em desalinho com o novo framework"
        - "Ferramentas autorizadas: Read/Grep/Glob (leitura Caos), Explore agent para fan-out; Firecrawl/Exa/Tavily SÓ para consultar docs primárias das linhagens (Anthropic MCP spec, RSP, Brooks Scorecard exemplos) — pesquisa web sempre com gate-busca autorizado"
      nivel_de_risco: "amarelo"
    dor_completo: true
    perguntas_abertas: []
    matriz_de_risco:
      reversibilidade: "reversivel"
      impacto: "medio"
