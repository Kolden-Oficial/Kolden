name: data-squad
version: "1.0.0"
short-title: "Data Squad"
description: "Squad de 7 estrategistas orientados por dados — analytics (Kaushik), CLV (Fader), growth (Ellis), comunidade (Spinks), customer success (Mehta), audiência (Kao)."
author: "Synkra AIOS"
license: MIT
slashPrefix: "data-squad"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - analytics
  - growth
  - customer-success
  - community
  - clv
  - metrics
  - retention

components:
  agents:
    - data-chief.md
    - avinash-kaushik.md
    - peter-fader.md
    - sean-ellis.md
    - wes-kao.md
    - nick-mehta.md
    - david-spinks.md
  tasks:
    - analyze-data.md
    - build-audience.md
    - build-community-strategy.md
    - diagnose.md
    - measure-growth.md
    - optimize-retention.md
    - review.md
  workflows:
    - wf-analytics-setup.yaml
    - wf-growth-sprint.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de dados (Kaushik/Fader/Ellis/Mehta/Spinks/Kao).
  veto:
    metrica_de_vaidade: "HALT em recomendar KPI sem ligação com decisão que ele dispara. Métrica que ninguém age sobre é vaidade — corta antes de propor."
    numero_sem_fonte: "HALT em apresentar número como fato sem fonte/query/janela. Sem fonte rastreável, rotula como estimativa."
    correlacao_como_causa: "HALT em apresentar correlação observada como relação causal sem desenho de teste (A/B, holdout, regressão controlada). Confundir os dois é o erro nº1."
    cohort_sem_janela: "HALT em análise de cohort/CLV sem janela declarada e tamanho de cohort. Sem isso, comparação é maçã com banana."
    decisao_de_negocio_sem_significancia: "HALT em propor mudança de produto/canal baseada em diferença observada SEM teste de significância estatística e tamanho de efeito."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend
