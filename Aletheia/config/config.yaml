# ═══════════════════════════════════════════════════════════════════
# Aletheia — Configuração do Squad
# ═══════════════════════════════════════════════════════════════════

squad:
  name: aletheia
  version: "1.0.0"
  entry_agent: aletheia-chief
  language: pt-BR

routing:
  catalog: data/routing-catalog.yaml
  method: keyword-match        # barato e auditável (padrão Kolden: routing-por-keywords-barato)
  confidence:
    high: 3                    # >= 3 keywords batidas
    medium: 2
    low: 1
  max_specialists_per_query: 3 # o orquestrador roteia para 1-3 especialistas, raramente mais

quality:
  checklist: checklists/output-quality.md
  min_score: 7.0

# Veto inviolável (espelhado no reflexo PreToolUse pre-ferramenta.sh)
guardrails:
  no_build_sem_evidencia: true
  no_pergunta_enviesada: true
  segredos: infisical-only

frameworks_reference: data/frameworks.yaml

handoffs_externos:
  - aglaia
  - pluto
  - harmonia
  - caliope
  - prometeu
  - metis

config:
  extends: extend
