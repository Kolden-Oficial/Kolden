name: design-squad
version: "1.0.0"
short-title: "Design Squad"
description: "Squad de design operations — 3 experts (Brad Frost, Dan Mall, Dave Malouf) + 4 especialistas + 1 orquestrador. Design systems, UX, UI, visual."
author: "Synkra AIOS"
license: MIT
slashPrefix: "design-squad"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - design-systems
  - ux
  - ui
  - atomic-design
  - components
  - design-ops
  - visual-design

components:
  agents:
    - design-chief.md
    - brad-frost.md
    - dan-mall.md
    - dave-malouf.md
    - ux-designer.md
    - design-system-architect.md
    - visual-generator.md
    - ui-engineer.md
  tasks:
    - audit-design.md
    - create-component-spec.md
    - create-design-system.md
    - design-ux-flow.md
    - diagnose.md
    - generate-handoff.md
    - review.md
    - setup-design-ops.md
  workflows:
    - wf-design-system-creation.yaml
    - wf-feature-design.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de design (design systems, UX, UI, visual).
  veto:
    design_sem_acessibilidade: "HALT em UI/componente entregue sem checklist mínimo de acessibilidade (contraste WCAG AA, alvo de toque ≥44px, foco visível, hierarquia semântica)."
    componente_sem_token: "HALT em criar componente com cor/spacing/raio hardcoded em vez de token semântico (camada token primitivo → semântico → componente). Hardcode quebra o design system."
    slop_visual: "HALT em entrega que dispara AI-tells (gradiente default purple/blue, ícone genérico no centro, glass effect aleatório, hero estéril). Roda julgamento-estetico-anti-slop antes de entregar."
    sem_responsivo: "HALT em layout proposto sem comportamento mobile declarado. Mobile-first ou no mínimo mobile-considerado."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend
