# Assinaturas de Tipos de Projeto — Detecção e Recomendações de Configuração
# Squad: claude-code-mastery
# Última atualização: 2026-03-02

version: "1.0.0"

# Cada tipo de projeto define sinais de detecção e a configuração recomendada do Claude Code.
# Usado pelos agentes config-engineer e project-integrator para inicializar projetos.

project_types:

  # ---------------------------------------------------------------------------
  monorepo:
    display_name: "Monorepo (Turborepo / Nx / Lerna)"
    detection_files:
      - turbo.json
      - nx.json
      - lerna.json
      - pnpm-workspace.yaml
    detection_patterns:
      - file: package.json
        field: workspaces
        description: "Tem o campo 'workspaces' no package.json raiz"
      - file: package.json
        field: "scripts.build"
        contains: "turbo"
    recommended_claude_md_template: claude-md-monorepo.md
    recommended_rules:
      - name: monorepo-boundaries
        description: "Impor fronteiras de pacotes, prevenir imports diretos entre pacotes"
        path_pattern: "packages/**"
      - name: shared-deps
        description: "Validar versões de dependências compartilhadas entre pacotes"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse
        description: "Rodar eslint nos arquivos modificados após edições"
      - pattern: damage-control
        event: PreToolUse
        description: "Bloquear comandos destrutivos"

  # ---------------------------------------------------------------------------
  fullstack-nextjs:
    display_name: "Fullstack Next.js (App Router)"
    detection_files:
      - next.config.js
      - next.config.mjs
      - next.config.ts
    detection_patterns:
      - file: package.json
        field: "dependencies.next"
        description: "Tem 'next' nas dependencies"
      - file: package.json
        field: "dependencies.react"
        description: "Tem 'react' nas dependencies"
      - directory: app/
        description: "Usa App Router (diretório app/)"
      - directory: src/app/
        description: "Usa App Router com prefixo src/"
    recommended_claude_md_template: claude-md-fullstack.md
    recommended_rules:
      - name: server-client-boundary
        description: "Impor as diretivas 'use client' / 'use server'"
        path_pattern: "src/app/**"
      - name: api-route-patterns
        description: "Validar assinaturas de handlers de rotas de API"
        path_pattern: "src/app/api/**"
      - name: component-patterns
        description: "Impor a estrutura de arquivos e a nomenclatura dos componentes"
        path_pattern: "src/components/**"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
      - playwright
      - supabase
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse
        description: "Rodar eslint + prettier ao salvar"
      - pattern: damage-control
        event: PreToolUse
        description: "Bloquear rm -rf, git push --force"

  # ---------------------------------------------------------------------------
  react-library:
    display_name: "Biblioteca de Componentes React / Design System"
    detection_files:
      - rollup.config.js
      - rollup.config.mjs
      - tsup.config.ts
      - vite.config.ts
    detection_patterns:
      - file: package.json
        field: "peerDependencies.react"
        description: "React como peer dependency (padrão de biblioteca)"
      - file: package.json
        field: main
        description: "Tem ponto de entrada 'main' para distribuição"
      - file: package.json
        field: exports
        description: "Tem mapa 'exports' para ESM/CJS"
      - directory: src/components/
        description: "Diretório de código-fonte dos componentes"
    recommended_claude_md_template: claude-md-library.md
    recommended_rules:
      - name: public-api-surface
        description: "Rastrear exports públicos, prevenir breaking changes"
        path_pattern: "src/index.ts"
      - name: peer-dep-ranges
        description: "Validar os intervalos de versão das peer dependencies"
      - name: storybook-coverage
        description: "Garantir que todo componente exportado tenha uma story"
        path_pattern: "src/**/*.stories.tsx"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse
      - pattern: api-surface-check
        event: PostToolUse
        description: "Avisar se forem detectadas mudanças na API pública"

  # ---------------------------------------------------------------------------
  python-api:
    display_name: "API Python (FastAPI / Django / Flask)"
    detection_files:
      - requirements.txt
      - pyproject.toml
      - setup.py
      - Pipfile
      - poetry.lock
    detection_patterns:
      - file: pyproject.toml
        field: "tool.poetry"
        description: "Usa Poetry para gerenciamento de dependências"
      - file: requirements.txt
        contains: "fastapi"
        description: "Dependência FastAPI detectada"
      - file: requirements.txt
        contains: "django"
        description: "Dependência Django detectada"
      - file: requirements.txt
        contains: "flask"
        description: "Dependência Flask detectada"
      - directory: app/
        description: "Diretório da aplicação"
    recommended_claude_md_template: claude-md-python-api.md
    recommended_rules:
      - name: type-hints
        description: "Impor type hints em todas as assinaturas de função"
        path_pattern: "**/*.py"
      - name: docstrings
        description: "Exigir docstrings em funções/classes públicas"
        path_pattern: "**/*.py"
      - name: migration-safety
        description: "Validar migrations do Alembic/Django"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
      - postgres
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse
        description: "Rodar ruff/black nos arquivos Python modificados"
      - pattern: security-gate
        event: PreToolUse
        description: "Bloquear exposição de .env, secrets"

  # ---------------------------------------------------------------------------
  mobile-react-native:
    display_name: "Mobile (React Native / Expo)"
    detection_files:
      - app.json
      - app.config.js
      - app.config.ts
      - metro.config.js
      - react-native.config.js
    detection_patterns:
      - file: package.json
        field: "dependencies.react-native"
        description: "Tem a dependência 'react-native'"
      - file: package.json
        field: "dependencies.expo"
        description: "Tem a dependência 'expo'"
      - directory: ios/
        description: "Diretório nativo iOS"
      - directory: android/
        description: "Diretório nativo Android"
    recommended_claude_md_template: claude-md-mobile.md
    recommended_rules:
      - name: platform-imports
        description: "Validar imports específicos de plataforma (.ios.ts, .android.ts)"
        path_pattern: "src/**"
      - name: navigation-patterns
        description: "Impor os padrões do React Navigation"
        path_pattern: "src/navigation/**"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
    recommended_hooks:
      - pattern: damage-control
        event: PreToolUse
        description: "Bloquear operações destrutivas em diretórios nativos"

  # ---------------------------------------------------------------------------
  rust-project:
    display_name: "Projeto Rust (Cargo)"
    detection_files:
      - Cargo.toml
      - Cargo.lock
    detection_patterns:
      - directory: src/
        description: "Diretório de código-fonte Rust"
      - file: Cargo.toml
        field: "[workspace]"
        description: "Workspace do Cargo (monorepo)"
    recommended_claude_md_template: claude-md-rust.md
    recommended_rules:
      - name: unsafe-audit
        description: "Sinalizar todos os blocos unsafe para revisão"
        path_pattern: "src/**/*.rs"
      - name: clippy-compliance
        description: "Garantir que os avisos do clippy sejam tratados"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse
        description: "Rodar cargo fmt nos arquivos .rs modificados"
      - pattern: damage-control
        event: PreToolUse

  # ---------------------------------------------------------------------------
  go-project:
    display_name: "Projeto Go"
    detection_files:
      - go.mod
      - go.sum
    detection_patterns:
      - file: go.mod
        field: module
        description: "Declaração de módulo Go"
      - directory: cmd/
        description: "Padrão de diretório de comandos Go"
      - directory: internal/
        description: "Pacotes internos do Go"
    recommended_claude_md_template: claude-md-go.md
    recommended_rules:
      - name: go-conventions
        description: "Impor as convenções de nomenclatura e pacotes do Go"
        path_pattern: "**/*.go"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse
        description: "Rodar gofmt nos arquivos .go modificados"

  # ---------------------------------------------------------------------------
  static-site:
    display_name: "Site Estático (Astro / Hugo / Gatsby / 11ty)"
    detection_files:
      - astro.config.mjs
      - gatsby-config.js
      - hugo.toml
      - .eleventy.js
      - eleventy.config.js
    detection_patterns:
      - file: package.json
        field: "dependencies.astro"
      - directory: content/
        description: "Diretório de conteúdo para sites estáticos"
      - directory: src/pages/
        description: "Diretório de páginas"
    recommended_claude_md_template: claude-md-static-site.md
    recommended_rules:
      - name: content-frontmatter
        description: "Validar o frontmatter em arquivos de conteúdo markdown"
        path_pattern: "content/**/*.md"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
    recommended_hooks:
      - pattern: auto-lint
        event: PostToolUse

  # ---------------------------------------------------------------------------
  aios-project:
    display_name: "Projeto Gerenciado por AIOS"
    detection_files:
      - .aios-core/core-config.yaml
      - .aios-core/constitution.md
    detection_patterns:
      - directory: .aios-core/
        description: "Diretório do framework core do AIOS"
      - directory: .claude/commands/AIOS/
        description: "Comandos de agente AIOS para o Claude"
      - file: .claude/settings.json
        contains: "AIOS"
    recommended_claude_md_template: null
    note: "Projetos AIOS já têm o CLAUDE.md gerenciado pelo framework"
    recommended_rules:
      - name: framework-boundary
        description: "Impor a proteção das camadas L1-L4"
      - name: agent-authority
        description: "Impor a matriz de delegação de agentes"
      - name: story-lifecycle
        description: "Impor as transições de status de story"
    recommended_mcp_servers:
      - filesystem
      - git
      - context7
      - coderabbit
      - supabase
    recommended_hooks:
      - pattern: damage-control
        event: PreToolUse
      - pattern: auto-lint
        event: PostToolUse
      - pattern: context-preservation
        event: PreCompact
