# Catálogo de Squads — roteamento do Hermes (orquestrador máximo)
#
# Fonte de verdade do dispatch. O Hermes lê este arquivo, casa a intenção do usuário
# com `keywords`, e chama scripts/invoca-squad.ps1 -Squad <id> -Prompt "<pedido>".
#
# Campos por squad:
#   squad       id curto (usado em -Squad)
#   nome        nome de exibição
#   dir         diretório absoluto do squad
#   tipo        aios = ler+adotar a persona do chief | claude-code = subagente nativo @chief
#   chief_file  caminho do arquivo do orquestrador, relativo a `dir`
#   keywords    termos que disparam o roteamento para este squad
#   muda_algo   true = ações que mudam o mundo exigem aprovação humana antes de executar
#
# Curadoria-mãe: C:\Kolden\Caos\dados\registro-de-entidades.yaml

squads:
  - squad: peitho
    nome: "Peitho — Traffic Masters (tráfego pago)"
    dir: C:/Kolden/Peitho
    tipo: aios
    chief_file: "agents/traffic-chief.md"
    keywords:
      - tráfego
      - trafego
      - anúncio
      - anuncio
      - ads
      - campanha
      - meta ads
      - facebook ads
      - google ads
      - youtube ads
      - tiktok ads
      - roas
      - cpa
      - criativo
      - media buying
      - pixel
      - escala
    muda_algo: true   # subir/pausar campanha, mexer em orçamento → aprovação

  - squad: argos
    nome: "Argos — Inteligência de Mercado & Scraping (o deus das pesquisas)"
    dir: C:/Kolden/Argos
    tipo: aios
    chief_file: "agents/argos-chief.md"
    keywords:
      - pesquisa de mercado
      - market research
      - inteligência competitiva
      - concorrente
      - concorrência
      - benchmark
      - scraping
      - raspagem
      - extrair dados
      - extrair links
      - tam
      - sam
      - som
      - tamanho de mercado
      - tendências
      - ad library
      - biblioteca de anúncios
      - anúncios do concorrente
      - seo
      - serp
      - backlinks
      - instagram
      - tiktok
      - youtube
      - linkedin
      - twitter
      - reddit
      - dossiê
    muda_algo: true   # zona cinza (scraping autenticado), conta/proxy descartável, cron de monitoramento → aprovação

  - squad: liceu
    nome: "Liceu — Biblioteca de Mentes (a escola de Aristóteles)"
    dir: C:/Kolden/Liceu
    tipo: aios
    chief_file: "agents/liceu-chief.md"
    keywords:
      - mente
      - dissecar
      - dissecação
      - especialista
      - pensador
      - gênio
      - genio
      - linhagem
      - genealogia
      - quem influenciou
      - herdou de
      - framework
      - modelo mental
      - mental model
      - biblioteca de mentes
      - fato vs folclore
      - replicar cérebro
      - dossiê de mente
      - encarnar
    muda_algo: false  # só estrutura conhecimento (dossiês/linhagens/frameworks); encarnar mente = handoff ao Caos (gate próprio)

  # ------------------------------------------------------------------------
  # A preencher na Fase 4 (verificar dir + chief_file de cada um antes de ativar).
  # Squads candidatos conhecidos no workspace:
  #   - pheme     (C:\Kolden\Pheme)    social media / publicação   muda_algo: true
  #   - aletheia  (C:\Kolden\Aletheia) discovery & validação        muda_algo: false
  #   - caos      (C:\Kolden\Caos)     criação de agentes (interativo — notify-only)
  # Não adicionar aqui sem confirmar o caminho do arquivo do chief.
  # ------------------------------------------------------------------------
