squad:
  name: hormozi-squad
  display_name: "Hormozi Squad"
  version: "1.0.0"
  domain: "Escala de negócios usando os frameworks de Alex Hormozi — offers, leads, pricing, sales, retention e growth"
  description: |
    16 agentes especializados implementando os frameworks de escala de negócios de Alex Hormozi.
    Cada agente domina um domínio específico da metodologia do Hormozi — offers, leads,
    pricing, content, ads, sales, retention, scaling e mais. O material-fonte inclui
    $100M Offers, $100M Leads, Gym Launch Secrets e a metodologia da Acquisition.com.
  keywords: [offers, leads, pricing, sales, scaling, retention, business model, launch, content, hooks, ads, workshop, audit, grand slam offer, value equation]
  entry_agent: hormozi-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orquestração"
    agents: [hormozi-chief]
    purpose: "Triagem de desafios de negócio, roteamento para o especialista Hormozi certo, controle de qualidade"
  tier_1_core:
    name: "Motores Centrais do Negócio"
    agents: [hormozi-offers, hormozi-leads, hormozi-pricing, hormozi-closer]
    purpose: "Os agentes fundamentais — offers, leads, pricing e sales"
  tier_1_growth:
    name: "Crescimento e Aquisição"
    agents: [hormozi-ads, hormozi-content, hormozi-hooks, hormozi-launch]
    purpose: "Agentes focados em escalar, lançar e expandir"
  tier_1_optimization:
    name: "Otimização e Retenção"
    agents: [hormozi-retention, hormozi-scale, hormozi-models, hormozi-audit]
    purpose: "Agentes focados em manter e maximizar clientes"
  tier_1_support:
    name: "Especialistas de Apoio"
    agents: [hormozi-copy, hormozi-workshop, hormozi-advisor]
    purpose: "Necessidades específicas de execução — copywriting, workshops, aconselhamento estratégico"

