# ═══════════════════════════════════════════════════════════════════
# Squad: Copy Master
# Domínio: Copywriting de Elite, Persuasão e Resposta Direta 2.0
# Versão: 2.0.0
# ═══════════════════════════════════════════════════════════════════

squad:
  name: copy-master
  display_name: "Copy Master"
  version: "2.0.0"
  domain: "Copywriting de elite 2.0 — resposta direta, email, funis, VSLs, cartas de vendas, ofertas, copy de marca, psicologia da persuasão, negociação, pitch, conversão de SaaS"
  description: |
    Squad de 33 agentes de copywriting — 32 mestres lendários + 1 orquestrador.
    Versão aprimorada do Copy Squad com frameworks mais profundos, exemplos reais de campeões,
    swipe files e 10 novos especialistas cobrindo psicologia da persuasão, arquitetura de
    ofertas, copy de SaaS, dinâmica de pitch e vendas baseadas em negociação.
  keywords: [copywriting, direct response, sales letter, email, VSL, funnel, headline, offer, ad copy, launch, bullets, brand copy, persuasion, psychology, negotiation, pitch, SaaS, conversion]
  entry_agent: copy-master-chief
  created_at: "2026-04-04"

tiers:
  tier_0:
    name: "Orquestração"
    agents: [copy-master-chief]
    purpose: "Triagem de solicitações de copywriting, roteamento para o especialista certo, controle de qualidade, coordenação multi-agente"
  tier_1a:
    name: "Lendas da Resposta Direta"
    agents: [gary-halbert, eugene-schwartz, claude-hopkins, gary-bencivenga, robert-collier, john-carlton, jim-rutz, john-caples, rosser-reeves]
    purpose: "Mestres clássicos da resposta direta — long-form, impressos, mala direta, testes científicos, USP"
  tier_1b:
    name: "Copy Moderno & Funis"
    agents: [dan-kennedy, frank-kern, russell-brunson, todd-brown, stefan-georgi, jon-benson, ry-schwartz, sabri-suby, evaldo-albuquerque]
    purpose: "Copy da era digital — VSLs, funis, webinars, lançamentos, tráfego frio, vendas baseadas em crença"
  tier_1c:
    name: "Email & Relacionamento"
    agents: [ben-settle, andre-chaperon, dan-koe]
    purpose: "Sequências de email, emails diários, copy de nutrição, conteúdo de marca pessoal"
  tier_1d:
    name: "Ofertas & Páginas de Vendas"
    agents: [joe-sugarman, david-ogilvy, clayton-makepeace, parris-lampropoulos, david-deutsch, alex-hormozi, joanna-wiebe]
    purpose: "Arquitetura de ofertas, anúncios impressos, copy de finanças/saúde, value equation, conversão de SaaS, copy orientado a dados"
  tier_1e:
    name: "Persuasão & Psicologia"
    agents: [robert-cialdini, blair-warren, chris-voss, oren-klaff]
    purpose: "Ciência da persuasão, gatilhos emocionais, psicologia da negociação, controle de frame, dinâmica de pitch"

