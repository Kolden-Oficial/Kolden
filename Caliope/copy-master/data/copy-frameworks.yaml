# Banco de Dados de Frameworks de Copy: Copy Master Squad
# 25 frameworks comprovados de copywriting e persuasão
# Cada um com criador, fonte, etapas detalhadas, casos de uso e exemplos de aplicação

frameworks:

  - name: "AIDA"
    creator: "Elias St. Elmo Lewis"
    source: "Princípios de publicidade (1898), popularizado por inúmeros copywriters"
    steps:
      - step: "Attention"
        detail: "Abra com um pattern interrupt — alegação ousada, estatística chocante, pergunta provocativa ou disrupção visual que faz parar a rolagem"
      - step: "Interest"
        detail: "Faça a ponte para o mundo do leitor — conecte o gancho ao problema, desejo ou situação específica dele com empatia e especificidade"
      - step: "Desire"
        detail: "Pinte a transformação — mostre o estado-depois de forma vívida, empilhe benefícios, use prova social e faça o resultado parecer inevitável"
      - step: "Action"
        detail: "Um único CTA claro com urgência ou escassez — diga exatamente o que fazer a seguir e por que fazê-lo agora importa"
    when_to_use: "Framework universal para qualquer copy de curto a médio porte em que você precisa de uma estrutura simples e comprovada"
    best_for: [ads, landing pages, emails, social posts, product descriptions]
    example_application: "Anúncio no Facebook: Gancho com estatística surpreendente → conectar à dor do público → mostrar benefícios do produto → 'Clique para garantir seu teste grátis'"

  - name: "PAS"
    creator: "Dan Kennedy (popularizado)"
    source: "The Ultimate Sales Letter (1990)"
    steps:
      - step: "Problem"
        detail: "Agite o problema específico que o leitor enfrenta — nomeie-o, descreva como ele se sente, faça-o concordar com a cabeça em reconhecimento"
      - step: "Agitate"
        detail: "Gire a faca — mostre as consequências de NÃO resolver o problema, os custos ocultos, o dano que se acumula, o desgaste emocional"
      - step: "Solution"
        detail: "Apresente sua oferta como a resposta lógica e inevitável — faça a transição da dor para o alívio com um mecanismo claro"
    when_to_use: "Quando o público está consciente do problema, mas ainda não consciente da solução. Ideal para mercados movidos pela dor"
    best_for: [emails, ads, landing pages, social posts, cold outreach]
    example_application: "E-mail: 'Gastando 4 horas/dia em entrada manual de dados? → São 1.000 horas/ano que você nunca vai recuperar → Nossa automação resolve isso em 12 minutos'"

  - name: "PASTOR"
    creator: "Ray Edwards"
    source: "How to Write Copy That Sells (2016)"
    steps:
      - step: "Person/Problem"
        detail: "Identifique a pessoa exata e seu problema específico — use a linguagem dela, suas frustrações, sua realidade diária"
      - step: "Amplify"
        detail: "Amplifique as consequências da inação — o que acontece em 6 meses, 1 ano, 5 anos se nada mudar"
      - step: "Story/Solution"
        detail: "Conte a história de origem da solução — como ela foi descoberta, por que funciona de forma diferente, o momento do avanço (breakthrough)"
      - step: "Transformation"
        detail: "Mostre o contraste antes/depois — resultados específicos e mensuráveis que outros alcançaram. Depoimentos e estudos de caso"
      - step: "Offer"
        detail: "Apresente a oferta completa — o que recebem, como é entregue, bônus, garantias, todo o value stack"
      - step: "Response"
        detail: "Chamada para ação clara com urgência — prazo, vagas limitadas, aumento de preço, expiração de bônus"
    when_to_use: "Páginas de vendas de formato longo e VSLs em que você precisa levar alguém do problema à compra"
    best_for: [sales pages, VSLs, webinar pitches, long-form emails]
    example_application: "Página de vendas de um programa de coaching: identificar o empreendedor em dificuldade → mostrar o custo de continuar travado → história de origem do coach → resultados de clientes → detalhes do programa → prazo de inscrição"

  - name: "BAB"
    creator: "Framework tradicional de copywriting"
    source: "Tradição da resposta direta, popularizado por múltiplos copywriters"
    steps:
      - step: "Before"
        detail: "Pinte a realidade dolorosa atual — como é a vida agora com o problema. Seja específico e visceral"
      - step: "After"
        detail: "Pinte o estado futuro desejado — como é a vida depois da solução. Torne-o tangível, emocional e desejável"
      - step: "Bridge"
        detail: "Mostre como seu produto/serviço é a ponte entre os dois estados — o mecanismo que torna a transformação possível"
    when_to_use: "Quando você precisa de uma narrativa de transformação simples — funciona especialmente bem para histórias de antes/depois"
    best_for: [emails, social posts, case studies, testimonial frameworks, short landing pages]
    example_application: "E-mail: 'Ano passado eu trabalhava 80 horas por semana mal ganhando US$ 5 mil/mês → Agora trabalho 25 horas e tiro US$ 30 mil → Aqui está o sistema que mudou tudo'"

  - name: "4 P's"
    creator: "Henry Hoke Sr."
    source: "Tradição da mala direta (meados do século 20)"
    steps:
      - step: "Promise"
        detail: "Comece com o maior e mais específico benefício — o resultado primário que o leitor vai alcançar"
      - step: "Picture"
        detail: "Pinte um filme mental vívido da vida depois de alcançar a promessa — envolva todos os sentidos, torne-o real"
      - step: "Proof"
        detail: "Sustente a promessa com evidência — depoimentos, estudos de caso, estatísticas, demonstrações, credenciais, lógica"
      - step: "Push"
        detail: "Conduza à ação com urgência — prazo, escassez, reversão de risco, bônus para ação rápida"
    when_to_use: "Anúncios de resposta direta e landing pages em que você precisa de uma estrutura enxuta e movida a benefícios"
    best_for: [direct mail, landing pages, print ads, display ads]
    example_application: "Landing page: 'Perca 9 kg em 90 dias → Imagine caber nas suas calças da faculdade → 47.000 pessoas já conseguiram → Junte-se hoje, garantia de 60 dias com dinheiro de volta'"

  - name: "RMBC"
    creator: "Stefan Georgi"
    source: "The RMBC Method (curso de treinamento de VSL)"
    steps:
      - step: "Research"
        detail: "Pesquisa de mercado profunda — leia avaliações, fóruns, copy de concorrentes, converse com clientes, minere avaliações da Amazon, estude os padrões de linguagem do avatar"
      - step: "Mechanism"
        detail: "Identifique ou crie o mecanismo único — a coisa específica que torna sua solução diferente e crível. Nomeie-o. Seja dono dele"
      - step: "Brief"
        detail: "Crie um brief estruturado antes de escrever — big idea, tipo de lead (Schwartz), oferta, avatar, objeções, elementos de prova, drivers emocionais"
      - step: "Copy"
        detail: "Escreva o copy seguindo o brief — lead, corpo, fechamento. Cada seção tem um trabalho específico. O brief evita que você se perca"
    when_to_use: "VSLs e cartas de vendas de formato longo — a abordagem sistemática evita o bloqueio criativo e garante o alinhamento estratégico"
    best_for: [VSLs, sales letters, long-form landing pages, advertorials]
    example_application: "VSL de suplemento: Pesquisar avaliações da Amazon em busca da linguagem da dor → Criar o mecanismo 'Cellular Reset Enzyme' → Brief com lead Problema-Solução → Escrever uma VSL de 45 min seguindo o brief"

  - name: "Star-Story-Solution"
    creator: "Gary Halbert"
    source: "Tradição do The Gary Halbert Letter / Boron Letters"
    steps:
      - step: "Star"
        detail: "Apresente um personagem com o qual se identifica — pode ser você, um cliente ou um homem comum fictício. Faça o público se ver nele"
      - step: "Story"
        detail: "Conte a luta do personagem — a jornada, os fracassos, a frustração, o momento do avanço. Use detalhes vívidos e diálogo"
      - step: "Solution"
        detail: "Revele o produto/serviço como o ponto de virada na história — a coisa que tornou a transformação possível"
    when_to_use: "Quando você quer vender através de história em vez de pitch direto — ideal para públicos céticos ou fatigados de anúncios"
    best_for: [emails, advertorials, VSLs, native ads, social content]
    example_application: "Advertorial: 'Conheça a Sarah, uma mãe solteira que estava com US$ 40 mil de dívida → A jornada dela através de orçamentos fracassados e vergonha → Como um app mudou a vida financeira dela para sempre'"

  - name: "Hook-Story-Offer"
    creator: "Russell Brunson"
    source: "DotCom Secrets (2015), Expert Secrets (2017)"
    steps:
      - step: "Hook"
        detail: "Capture a atenção com um gancho ousado — pattern interrupt, lacuna de curiosidade, alegação ousada ou pergunta que exige resposta"
      - step: "Story"
        detail: "Conte uma história Epiphany Bridge — a jornada que levou à descoberta, fazendo o público vivenciar a mesma epifania"
      - step: "Offer"
        detail: "Apresente a oferta irresistível — o veículo, o stack, os bônus, a garantia, tudo projetado para fazer o 'não' parecer irracional"
    when_to_use: "Funis, webinars e qualquer meio em que você precisa criar uma conexão emocional antes de fazer o pitch"
    best_for: [webinars, funnels, social media, email sequences, stage presentations]
    example_application: "Webinar: 'E se tudo o que você sabe sobre perda de peso estiver errado? → Minha história de descoberta da verdade → Aqui está o programa que incorpora essa descoberta'"

  - name: "Epiphany Bridge"
    creator: "Russell Brunson"
    source: "Expert Secrets (2017)"
    steps:
      - step: "Backstory"
        detail: "Estabeleça o mundo do personagem antes da descoberta — suas crenças, lutas e o muro em que ele bateu"
      - step: "External Journey"
        detail: "Descreva os eventos externos — o que aconteceu, aonde ele foi, o que tentou, a sequência de ações"
      - step: "Internal Journey"
        detail: "Descreva a transformação emocional e de crença — o momento em que a velha crença se despedaçou e a nova crença se formou"
      - step: "Achievement"
        detail: "Mostre o resultado — o que se tornou possível depois que a nova crença se enraizou. A transformação tornada real"
      - step: "Bridge to Offer"
        detail: "Conecte a epifania ao produto — sua oferta é o veículo que dá aos outros a mesma epifania sem a mesma luta"
    when_to_use: "Ao vender produtos de informação, coaching ou qualquer coisa em que a mudança de crença impulsiona a decisão de compra"
    best_for: [webinars, VSLs, book funnels, course sales pages, coaching offers]
    example_application: "Página de vendas de curso: 'Eu acreditava que o sucesso exigia 80 horas por semana → Eu me esgotei e perdi tudo → Então descobri a alavancagem → Construí um negócio de US$ 10M em 20h/semana → Este curso te dá o mesmo framework'"

  - name: "Value Equation"
    creator: "Alex Hormozi"
    source: "$100M Offers (2021)"
    steps:
      - step: "Dream Outcome"
        detail: "Maximize o dream outcome percebido — o resultado final ideal que o cliente quer. Torne-o o mais vívido e desejável possível"
      - step: "Perceived Likelihood of Achievement"
        detail: "Aumente a probabilidade percebida — garantias, estudos de caso, demonstrações, prova social, credenciais, especificidade"
      - step: "Time Delay"
        detail: "Minimize o tempo percebido até o resultado — velocidade de entrega, vitórias rápidas, acesso imediato, bônus de início rápido"
      - step: "Effort & Sacrifice"
        detail: "Minimize o esforço percebido necessário — elementos done-for-you, templates, atalhos, suporte, sistemas passo a passo"
    when_to_use: "Design e posicionamento de oferta — use para engenhar ofertas que parecem desproporcionalmente valiosas"
    best_for: [offer creation, pricing strategy, sales pages, pitch decks, proposal writing]
    example_application: "Oferta de SaaS: 'Receba 100 leads qualificados/mês (dream) — garantido ou seu dinheiro de volta (probabilidade) — veja resultados em 14 dias (velocidade) — configuramos tudo para você (esforço)'"

  - name: "CLOSER"
    creator: "Alex Hormozi"
    source: "$100M Offers (2021), treinamento Gym Launch"
    steps:
      - step: "Clarify"
        detail: "Esclareça por que eles estão aqui — 'O que fez você entrar em contato hoje?' Faça-os declarar o problema e o desejo"
      - step: "Label"
        detail: "Rotule o problema — reflita-o de volta com mais precisão do que eles declararam. Mostre que você entende em um nível mais profundo"
      - step: "Overview"
        detail: "Reveja experiências passadas — 'O que você já tentou antes? Por que não funcionou?' Mapeie o padrão de fracasso deles"
      - step: "Sell the Vacation"
        detail: "Venda o resultado final, não o voo de avião — pinte o destino, não o processo. Foque nos resultados"
      - step: "Explain Away Concerns"
        detail: "Lide com as objeções antes que elas surjam — 'As três maiores preocupações que as pessoas têm são...' Então aborde cada uma"
      - step: "Reinforce the Decision"
        detail: "Obtenha microcompromissos e reforce — 'Isso faz sentido? Consegue ver como isso funcionaria para você?'"
    when_to_use: "Vendas por telefone, calls de vendas, vendas por DM, qualquer situação de venda 1 a 1 ou ao vivo"
    best_for: [sales scripts, phone sales, DM sequences, consultation calls, close sequences]
    example_application: "Call de vendas: 'O que te traz aqui hoje? → Então você está dizendo que X está te custando Y → O que você já tentou? → Imagine se em 90 dias... → A maioria das pessoas se preocupa com Z, aqui está o porquê...'"

  - name: "Slippery Slide"
    creator: "Joe Sugarman"
    source: "The Adweek Copywriting Handbook (2006)"
    steps:
      - step: "Compelling First Sentence"
        detail: "Faça a primeira frase tão curta e intrigante que ela compila a leitura da segunda frase. Esse é o único trabalho dela"
      - step: "Maintain Momentum"
        detail: "O propósito de cada frase é fazer a próxima frase ser lida. Use loops de curiosidade, padrões abertos, pensamentos incompletos"
      - step: "Create Buying Environment"
        detail: "Construa gatilhos psicológicos por todo o texto — dispositivos de envolvimento, linguagem de propriedade, future pacing, filmes mentais"
      - step: "Seed Objections Early"
        detail: "Plante e resolva objeções antes que o leitor as levante conscientemente. Faz o fechamento parecer natural"
      - step: "Inevitable Conclusion"
        detail: "Quando chegam ao CTA, comprar parece o único próximo passo lógico — a descida foi sem fricção"
    when_to_use: "Qualquer copy de formato longo em que manter a atenção pela peça inteira é crítico"
    best_for: [sales letters, advertorials, long emails, VSL scripts, magazine ads]
    example_application: "Advertorial: A primeira linha tem 7 palavras que criam uma lacuna de curiosidade → Cada parágrafo termina com um open loop → Objeções abordadas na narrativa → A compra parece inevitável"

  - name: "One Sentence Persuasion"
    creator: "Blair Warren"
    source: "The One Sentence Persuasion Course (2013)"
    steps:
      - step: "Encourage Their Dreams"
        detail: "Valide e amplifique as aspirações deles — não descarte o que querem, mostre que você acredita na visão deles"
      - step: "Justify Their Failures"
        detail: "Remova a culpa pelos fracassos passados — não é culpa deles, os velhos métodos/informações/sistema os falharam"
      - step: "Allay Their Fears"
        detail: "Aborde e dissolva medos específicos — nomeie o medo, depois forneça evidência ou lógica que o neutralize"
      - step: "Confirm Their Suspicions"
        detail: "Valide o que eles sempre suspeitaram — 'Você estava certo o tempo todo de que...' Cria confiança instantânea"
      - step: "Throw Rocks at Their Enemies"
        detail: "Identifique o inimigo comum e ataque-o — a indústria, o velho jeito, os gurus, o sistema que os falhou"
    when_to_use: "Quando você precisa construir rapport e confiança profundos rapidamente — especialmente com públicos céticos ou queimados"
    best_for: [email sequences, lead magnets, community building, social content, VSL openings]
    example_application: "E-mail: 'Você sempre soube que algo estava errado no marketing tradicional (suspeitas) → Não é culpa sua que os gurus te venderam táticas que não funcionam (fracassos) → Aqui está o que a indústria não quer que você saiba (inimigos)'"

  - name: "7 Principles of Influence"
    creator: "Robert Cialdini"
    source: "Influence: The Psychology of Persuasion (1984), Pre-Suasion (2016)"
    steps:
      - step: "Reciprocity"
        detail: "Dê valor primeiro — conteúdo grátis, ferramentas grátis, insights grátis. O desejo de retribuir é instintivo"
      - step: "Commitment & Consistency"
        detail: "Obtenha pequenos 'sins' antes de pedir o grande 'sim' — microcompromissos, quizzes, opt-ins, pesquisas"
      - step: "Social Proof"
        detail: "Mostre que outros como eles tomaram a ação — depoimentos, números, estudos de caso, logos, avaliações"
      - step: "Authority"
        detail: "Estabeleça credibilidade — credenciais, menções na mídia, resultados, experiência, associação com entidades conhecidas"
      - step: "Liking"
        detail: "Seja identificável e agradável — similaridade, elogios, valores compartilhados, humor, vulnerabilidade"
      - step: "Scarcity"
        detail: "Crie urgência genuína — tempo limitado, vagas limitadas, disponibilidade limitada, bônus que desaparecem"
      - step: "Unity"
        detail: "Crie identidade compartilhada — 'Nós somos o tipo de pessoa que...' Pertencimento ao grupo e conexão tribal"
    when_to_use: "Inclua em qualquer copy como amplificadores de persuasão — não é uma estrutura isolada, mas princípios para entrelaçar por todo o texto"
    best_for: [all copy types, especially sales pages, emails, landing pages, ads]
    example_application: "Página de vendas: Treinamento em vídeo grátis (reciprocidade) → Quiz para qualificar (compromisso) → 'Mais de 50.000 clientes' (prova social) → Destaque na Forbes (autoridade) → 'Apenas 100 vagas' (escassez)"

  - name: "STRONG Method"
    creator: "Oren Klaff"
    source: "Pitch Anything (2011)"
    steps:
      - step: "Set the Frame"
        detail: "Estabeleça seu frame como o dominante — você é o prêmio, não o suplicante. Controle o contexto narrativo"
      - step: "Tell the Story"
        detail: "Use uma narrativa convincente que cria tensão e intriga — inclua um momento de perigo do 'homem na selva'"
      - step: "Reveal the Intrigue"
        detail: "Introduza novidade e singularidade — o que torna isto diferente de tudo o mais que eles já viram"
      - step: "Offer the Prize"
        detail: "Posicione sua oferta como escassa e desejável — inverta a dinâmica para que eles estejam se qualificando para trabalhar com você"
      - step: "Nail the Hookpoint"
        detail: "Crie o momento em que eles se inclinam para frente — o pico emocional em que se comprometem mentalmente"
      - step: "Get the Decision"
        detail: "Pressione por uma decisão no momento — restrições de tempo, próximos passos, compromisso claro"
    when_to_use: "Pitches de alto risco em que você precisa controlar o frame — pitches para investidores, vendas high-ticket, parcerias"
    best_for: [pitch decks, investor presentations, high-ticket sales calls, partnership proposals]
    example_application: "Pitch para investidor: Enquadrar como oportunidade exclusiva → História de origem com um momento de quase-morte do negócio → Revelação de tecnologia inédita → 'Estamos selecionando 3 investidores' → Prazo para decisão"

  - name: "Soap Opera Sequence"
    creator: "Andre Chaperon"
    source: "Autoresponder Madness (2009)"
    steps:
      - step: "Email 1: Set the Stage"
        detail: "Apresente-se com vulnerabilidade e intriga — abra um grande loop de curiosidade que percorra toda a sequência"
      - step: "Email 2: High Drama / Backstory"
        detail: "Conte a história de fundo dramática — a luta, o fracasso, o momento em que tudo desmoronou. Termine com um cliffhanger"
      - step: "Email 3: Epiphany"
        detail: "Revele o momento do avanço — a percepção que mudou tudo. Conecte-se emocionalmente antes de revelar a solução"
      - step: "Email 4: Hidden Benefits"
        detail: "Mostre benefícios e resultados inesperados — coisas que eles não teriam previsto. Empilhe valor além do óbvio"
      - step: "Email 5: Urgency / CTA"
        detail: "Crie urgência genuína para a ação — prazo, bônus que desaparecem, aumento de preço, acesso limitado. Feche o loop"
    when_to_use: "Sequências de boas-vindas e de lançamento por e-mail em que você precisa construir um engajamento profundo ao longo de múltiplos pontos de contato"
    best_for: [welcome sequences, launch emails, course enrollment, membership pitches]
    example_application: "Sequência de boas-vindas: 'Preciso te contar algo que nunca compartilhei publicamente...' → 'O dia em que perdi tudo' → 'Então uma manhã às 3h...' → 'Mas aqui está o que eu não esperava' → 'As portas fecham sexta à meia-noite'"

  - name: "Message Mining"
    creator: "Joanna Wiebe"
    source: "Metodologia Copyhackers / Copy School"
    steps:
      - step: "Gather Voice of Customer"
        detail: "Colete a linguagem bruta do cliente — avaliações, depoimentos, tickets de suporte, posts de fóruns, respostas de pesquisas, transcrições de calls"
      - step: "Highlight Emotional Phrases"
        detail: "Identifique frases com carga emocional — as palavras que eles usam ao descrever sua dor, desejo e transformação"
      - step: "Categorize by Theme"
        detail: "Agrupe frases em temas — pontos de dor recorrentes, desejos, objeções, motivações, padrões de linguagem"
      - step: "Map to Page Sections"
        detail: "Atribua as melhores frases a locais específicos do copy — headlines, subtítulos, bullet points, CTAs, depoimentos"
      - step: "Write Using Their Words"
        detail: "Escreva o copy usando a linguagem exata deles como base — não o seu fraseado inteligente, mas a expressão bruta deles"
    when_to_use: "Antes de escrever qualquer copy — especialmente quando você precisa combinar com o nível de consciência e o vocabulário do público"
    best_for: [landing pages, sales pages, email copy, ad copy, SaaS copy, product pages]
    example_application: "Landing page de SaaS: Minerar avaliações do G2 em busca de frases de dor → 'Eu estava me afogando em planilhas' vira a headline → Descrições de recursos usam a linguagem dos avaliadores ao pé da letra"

  - name: "E5 Method"
    creator: "Todd Brown"
    source: "Treinamento E5 Method / Marketing Funnel Automation"
    steps:
      - step: "Engage"
        detail: "Fisgue com uma big idea que seja nova, diferente e contraintuitiva — viole as crenças existentes deles imediatamente"
      - step: "Educate"
        detail: "Ensine a eles o mecanismo único — por que a velha abordagem falha e por que esta nova abordagem funciona de forma diferente"
      - step: "Excite"
        detail: "Construa empolgação através de prova e possibilidade — estudos de caso, demonstrações, especificidade que torna real"
      - step: "Exchange"
        detail: "Apresente a oferta como uma troca justa — valor massivo por um investimento relativamente pequeno, sustentado por garantias"
      - step: "Execute"
        detail: "Conduza à ação imediata — próximo passo específico, driver de urgência, remoção da fricção remanescente"
    when_to_use: "Campanhas de marketing e funis construídos em torno de uma big idea — particularmente infoprodutos e coaching"
    best_for: [VSLs, webinars, sales pages, launch sequences, advertorials]
    example_application: "VSL: 'Cientistas acabaram de descobrir um novo composto...' (engage) → 'Aqui está por que as dietas falham no nível celular' (educate) → Estudos de caso (excite) → Detalhes do programa (exchange) → 'Inscreva-se agora' (execute)"

  - name: "16-Word Sales Letter"
    creator: "Evaldo Albuquerque"
    source: "The 16-Word Sales Letter (2019)"
    steps:
      - step: "Identify the Belief"
        detail: "Encontre a ÚNICA crença falsa que, se mudada, torna a venda inevitável. Não o problema — a crença sobre o problema"
      - step: "Write the 16-Word Framework"
        detail: "Estrutura: '[Resultado desejado] não tem a ver com [crença falsa]. Tem a ver com [nova crença/mecanismo].' Esta é a espinha de toda a carta de vendas"
      - step: "Build the Lead"
        detail: "Abra com o tipo de lead que combina com a consciência do público — direto, indireto, história, proclamação, segredo ou previsão"
      - step: "Shatter the False Belief"
        detail: "Desmonte sistematicamente a velha crença usando lógica, histórias, analogias e prova. Faça o velho jeito parecer obviamente errado"
      - step: "Install the New Belief"
        detail: "Substitua pela nova crença ligada ao seu mecanismo único — a coisa que torna sua solução a escolha inevitável"
    when_to_use: "Cartas de vendas de formato longo e VSLs — especialmente em mercados competitivos onde a diferenciação pela crença é a chave"
    best_for: [sales letters, VSLs, advertorials, health/finance/biz-opp markets]
    example_application: "VSL de saúde: 'Perder peso NÃO tem a ver com comer menos e se exercitar mais (crença falsa). Tem a ver com resetar seu termostato metabólico (nova crença/mecanismo).'"

  - name: "CopyTHINKING"
    creator: "Ry Schwartz"
    source: "CopyHackers / Treinamento de e-mail CopyTHINKING"
    steps:
      - step: "Map Awareness Levels"
        detail: "Mapeie onde seu assinante está no espectro de consciência de Schwartz — inconsciente, consciente do problema, consciente da solução, consciente do produto, totalmente consciente"
      - step: "Match Emotional Temperature"
        detail: "Combine com o estado emocional do leitor em cada nível de consciência — frustração, esperança, ceticismo, urgência"
      - step: "Choose Awareness Shift"
        detail: "Cada e-mail move o leitor UM nível à frente no espectro de consciência — nunca tente pular múltiplos níveis"
      - step: "Apply Sequence Architecture"
        detail: "Estruture a sequência para que cada e-mail flua logicamente para o próximo, construindo o argumento de forma incremental"
      - step: "Close at Product-Aware"
        detail: "Só faça o pitch quando estiverem conscientes do produto — a sequência conquista o direito de vender através da construção progressiva de consciência"
    when_to_use: "Sequências de e-mail em que você precisa mover os assinantes pelos níveis de consciência antes de vender"
    best_for: [email sequences, nurture campaigns, launch sequences, SaaS onboarding emails]
    example_application: "Sequência de e-mail de SaaS: E1 (consciente do problema → agitar a dor) → E2 (consciente da solução → mostrar a categoria) → E3 (consciente do produto → apresentar sua ferramenta) → E4 (totalmente consciente → oferta/prazo)"

  - name: "Fascination Bullet Method"
    creator: "Clayton Makepeace / Gary Bencivenga"
    source: "Total Package de Makepeace, Persuasion Seminar de Bencivenga"
    steps:
      - step: "Identify the Payoff"
        detail: "Comece com o benefício ou segredo específico — a coisa que o leitor vai aprender, ganhar ou descobrir"
      - step: "Add Specificity"
        detail: "Inclua números, nomes, detalhes — 'O ritual matinal de 3 minutos' supera 'Uma rotina matinal'"
      - step: "Create Curiosity Gap"
        detail: "Insinue a informação sem revelá-la — crie uma coceira que só pode ser coçada com a compra"
      - step: "Use Power Templates"
        detail: "Templates: 'Como [benefício] sem [dor]', 'Os [número] [coisa] que [resultado]', 'Por que [coisa comum] é [verdade surpreendente]', 'O que [especialistas] sabem sobre [tópico] que você não sabe'"
      - step: "Stack for Momentum"
        detail: "Agrupe 5-7 bullets em um bloco, misturando os movidos a benefício e os movidos a curiosidade. Cada bullet deve ser forte o bastante para vender sozinho"
    when_to_use: "Seções de bullets em cartas de vendas, teasers de e-mail, listas de benefícios de páginas de opt-in, meio de VSLs"
    best_for: [sales letters, VSLs, opt-in pages, email teasers, Amazon listings, course curriculum descriptions]
    example_application: "Bullets de carta de vendas: '• O ingrediente de cozinha de 11 centavos que dissolve a gordura abdominal teimosa (página 23) • Por que seu médico NUNCA vai te contar sobre esta alternativa aprovada pela FDA • 3 alimentos vendidos como saudáveis que estão silenciosamente destruindo sua tireoide'"

  - name: "USP Framework"
    creator: "Rosser Reeves"
    source: "Reality in Advertising (1961)"
    steps:
      - step: "Identify Unique Claim"
        detail: "Encontre a ÚNICA proposta que seu concorrente não pode ou não oferece — ela precisa ser única a você"
      - step: "Verify Customer Value"
        detail: "A proposta precisa ser algo que o cliente realmente quer — não apenas única, mas unicamente valiosa"
      - step: "Make it Specific"
        detail: "Quantifique e especifique — 'Derrete na sua boca, não na sua mão' é específico. 'Ótima qualidade' não é"
      - step: "Test Memorability"
        detail: "A USP precisa ser simples o bastante para lembrar e repetir — se não cabe em uma frase, é complexa demais"
      - step: "Build All Copy Around It"
        detail: "Todo anúncio, toda página, todo e-mail reforça a USP — a consistência cria penetração"
    when_to_use: "Posicionamento de marca, lançamentos de novos produtos, entrada em mercados competitivos, diferenciação de ofertas comoditizadas"
    best_for: [brand copy, taglines, elevator pitches, ad campaigns, landing page headlines]
    example_application: "Posicionamento de SaaS: Auditar concorrentes → Descobrir que nenhum oferece colaboração em tempo real → USP: 'A única ferramenta de projetos onde sua equipe inteira edita simultaneamente — zero lag, zero conflitos' → Construir todo o copy em torno disso"

  - name: "Tactical Empathy Framework"
    creator: "Chris Voss"
    source: "Never Split the Difference (2016)"
    steps:
      - step: "Mirror"
        detail: "Repita as últimas 1-3 palavras críticas do que o prospecto disse — isso aciona o detalhamento e mostra que você está ouvindo"
      - step: "Label the Emotion"
        detail: "Nomeie o que eles estão sentindo — 'Parece que você está frustrado com...' ou 'Soa como se você sentisse...'"
      - step: "Accusation Audit"
        detail: "Liste proativamente toda coisa negativa que eles possam pensar sobre você — 'Você provavelmente está pensando que isto é caro demais, bom demais para ser verdade, só mais um guru...' Desarma-os"
      - step: "Calibrated Questions"
        detail: "Faça perguntas de 'Como' e 'O que' que os façam resolver o seu problema — 'Como você gostaria de lidar com isso? O que faria isto funcionar para você?'"
      - step: "That's Right"
        detail: "Pressione por uma resposta 'é isso mesmo' resumindo a situação deles com tanta precisão que eles a confirmem — isto é mais profundo que 'sim'"
    when_to_use: "Calls de vendas, vendas por DM, tratamento de objeções no copy, prevenção de reembolso, negociações de parceria"
    best_for: [sales scripts, objection handling copy, FAQ sections, chatbot scripts, customer success]
    example_application: "Roteiro de call de vendas: 'Então você tentou três agências e nenhuma entregou? (espelhamento) → Soa como se você se sentisse traído (rótulo) → Você provavelmente está pensando por que isto seria diferente (auditoria) → Como seria o sucesso para você? (calibrada)'"

  - name: "Frame Control"
    creator: "Oren Klaff"
    source: "Pitch Anything (2011), Flip the Script (2019)"
    steps:
      - step: "Identify the Dominant Frame"
        detail: "Reconheça o frame existente — quem controla a narrativa no momento? É o frame do comprador, o do mercado ou o seu?"
      - step: "Set Your Frame"
        detail: "Estabeleça seu frame antes do engajamento — você é o prêmio, o especialista, a autoridade. Não o suplicante"
      - step: "Use Frame Collisions"
        detail: "Quando frames colidem, o mais forte absorve o mais fraco. Use humor, status ou autoridade moral para vencer as colisões de frame"
      - step: "Apply Time Pressure"
        detail: "Controle o relógio — 'Tenho 15 minutos' estabelece seu tempo como valioso e cria urgência"
      - step: "Prize Frame"
        detail: "Posicione-se como o prêmio — 'Somos seletivos sobre com quem trabalhamos' inverte a dinâmica comprador-vendedor"
    when_to_use: "Vendas high-ticket, negociações, situações de pitch, qualquer contexto em que a dinâmica de status afeta o resultado"
    best_for: [pitch decks, high-ticket sales pages, agency proposals, premium brand copy]
    example_application: "Pitch de agência: 'Só aceitamos 3 novos clientes por trimestre → Aqui está por que nosso último cliente disse não a nós primeiro → Recusamos US$ 2M em projetos ano passado → Se houver encaixe, aqui está o que acontece a seguir'"

  - name: "Persuasion Equation"
    creator: "Múltiplos contribuidores (framework sintetizado)"
    source: "Derivado de Cialdini, Sugarman, Schwartz e economia comportamental"
    steps:
      - step: "Urgency + Scarcity"
        detail: "Por que agora? Tempo limitado, vagas limitadas, preços subindo, portas fechando — crie pressão temporal"
      - step: "Authority + Social Proof"
        detail: "Por que confiar? Credenciais, mídia, depoimentos, estudos de caso, números — estabeleça credibilidade"
      - step: "Desire + Future Pacing"
        detail: "Por que querer? Pinte o resultado de forma vívida, faça-os sentir o estado-depois, engaje as emoções"
      - step: "Logic + Justification"
        detail: "Por que racional? Comparação de custos, cálculo de ROI, argumento lógico — dê ao cérebro permissão para comprar o que o coração já quer"
      - step: "Risk Reversal"
        detail: "Por que seguro? Garantia, teste, política de reembolso, prova social de segurança — remova a última barreira"
    when_to_use: "Seções de fechamento de qualquer copy de vendas — combine esses elementos para criar uma pressão de compra irresistível"
    best_for: [sales page closes, checkout pages, email closes, webinar closes, cart abandonment]
    example_application: "Fechamento de página de vendas: 'Restam apenas 47 vagas (escassez) → Destaque na Inc, Forbes, Entrepreneur (autoridade) → Imagine daqui a 6 meses... (desejo) → A US$ 997 isso é menos de US$ 3,30/dia (lógica) → Garantia completa de 365 dias (reversão de risco)'"
