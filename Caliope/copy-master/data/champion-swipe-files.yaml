  - title: "How to Win Friends and Influence People"
    writer: "Dale Carnegie / Victor Schwab"
    year: 1936
    key_technique: "Promessa direta de benefício"
    why_it_worked: "Dois desejos universais em uma headline. 'How to' remove o mistério. Simples, memorável, acionável"

  - title: "At 60 Miles an Hour the Loudest Noise in This New Rolls-Royce Comes From the Electric Clock"
    writer: "David Ogilvy"
    year: 1958
    key_technique: "Fato específico como headline"
