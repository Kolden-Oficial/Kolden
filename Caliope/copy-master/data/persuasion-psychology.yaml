# Referência de Psicologia da Persuasão: Copy Master Squad
# Referência aprofundada sobre a ciência da persuasão para todos os agentes
# Fontes: Cialdini, Warren, Sugarman, Voss, Klaff, economia comportamental

cialdini_7_principles:
  source: "Influence (1984) + Pre-Suasion (2016) — Robert Cialdini"

  reciprocity:
    definition: "As pessoas se sentem obrigadas a retribuir favores, presentes e concessões. O desejo de retribuir é instintivo e, com frequência, desproporcional"
    mechanism: "Quando você dá algo de valor primeiro — mesmo não solicitado — o destinatário se sente psicologicamente em dívida"
    copy_applications:
      - "Lead magnets — dê um recurso gratuito genuinamente valioso antes de pedir qualquer coisa"
      - "Marketing de conteúdo gratuito — posts de blog, vídeos, ferramentas que resolvem problemas reais"
      - "Testes e amostras grátis — deixe-os experimentar o valor antes de pagar"
      - "Bônus inesperados — adicione bônus-surpresa após a compra para gerar indicações"
      - "Técnica de concessão — comece com um pedido maior, depois 'conceda' até o seu pedido real"
    examples:
      - "Os Hare Krishnas dando flores antes de pedir doações aumentaram as doações em 300%"
      - "Guias em PDF gratuitos que geram taxas de opt-in de e-mail acima de 40%"
      - "Programas de indicação movidos por reciprocidade (Dropbox: dê armazenamento, ganhe armazenamento)"

  commitment_consistency:
    definition: "Uma vez que as pessoas se comprometem com algo (especialmente publicamente), elas sentem pressão interna para se comportar de forma consistente com aquele compromisso"
    mechanism: "Pequenos compromissos iniciais criam uma autoimagem que impulsiona ações consistentes maiores — o efeito 'pé na porta' (foot in the door)"
    copy_applications:
      - "Microcompromissos — quizzes, pesquisas, 'escadas de sins' (yes ladders) antes do grande pedido"
      - "Ofertas de frete grátis — pagar até US$ 1 cria a identidade de comprador"
      - "Declarações públicas — 'Compartilhe sua meta nos comentários' os prende"
      - "Divulgação progressiva — pequeno opt-in → série de e-mails → pequena compra → oferta central"
      - "Copy baseado em identidade — 'Você é o tipo de pessoa que...' alavanca a consistência"
    examples:
      - "Soldados prisioneiros de guerra na Coreia — pequenas declarações escritas levaram a mudanças ideológicas completas"
      - "Funis de quiz que fazem 5-7 perguntas antes de revelar o produto alcançam 3x a conversão"
      - "Botões de 'Estou dentro' vs botões de 'Enviar' — o compromisso de identidade aumenta a conversão"

  social_proof:
    definition: "As pessoas olham para os outros para determinar o comportamento correto, especialmente em situações ambíguas. O que os outros fazem serve como um atalho mental"
    mechanism: "Quando incertos, recorremos por padrão ao comportamento de outros semelhantes — quanto mais semelhantes e numerosos, mais forte o efeito"
    copy_applications:
      - "Depoimentos — especialmente de pessoas que correspondem exatamente ao avatar-alvo"
      - "Números — 'Mais de 50.000 clientes' cria a segurança do rebanho"
      - "Prova em tempo real — 'O João, de Austin, acabou de comprar há 3 minutos'"
      - "Estudos de caso — histórias detalhadas de antes/depois com métricas específicas"
      - "Conteúdo gerado pelo usuário — clientes reais compartilhando resultados reais"
      - "Listas de espera — 'Junte-se a 2.347 pessoas esperando acesso'"
    examples:
      - "Risadas gravadas aumentam as avaliações de humor em 15-20% mesmo quando as pessoas sabem que são falsas"
      - "Placas de reuso de toalhas de hotel citando '75% dos hóspedes deste quarto' superaram apelos genéricos em 33%"
      - "O 'Clientes que compraram isto também compraram' da Amazon gera 35% da receita"

  authority:
    definition: "As pessoas se submetem a especialistas e figuras de autoridade — títulos, uniformes, credenciais e os adornos da expertise acionam a obediência automática"
    mechanism: "A autoridade serve como um atalho cognitivo — se um especialista diz, deve ser verdade. Seguimos a autoridade até contra o nosso próprio julgamento"
    copy_applications:
      - "Credenciais — 'Visto na Forbes, Inc, WSJ'"
      - "Endossos de especialistas — médicos, PhDs, líderes do setor"
      - "Citações de dados e pesquisas — estudos específicos, estatísticas, achados revisados por pares"
      - "Autoria publicada — livros, artigos, patentes"
      - "Associação — logos de clientes prestigiados, universidades, veículos de mídia"
      - "Especificidade como autoridade — conhecimento técnico detalhado sinaliza expertise"
    examples:
      - "Experimento de Milgram — 65% aplicaram o 'choque' máximo quando instruídos por uma figura de autoridade"
      - "Adicionar 'Dr.' a um depoimento aumenta a credibilidade em mais de 40%"
      - "Logos de mídia 'Destaque em' aumentam a conversão da landing page em 20-30%"

  liking:
    definition: "As pessoas preferem dizer sim a pessoas de quem gostam — similaridade, elogios, familiaridade e atratividade física aumentam a obediência"
    mechanism: "A afinidade é impulsionada por: atratividade física, similaridade, elogios, contato/cooperação e associação com coisas positivas"
    copy_applications:
      - "Histórias pessoais que criam identificação — 'Eu era igualzinho a você'"
      - "Humor — torna o escritor/marca agradável e memorável"
      - "Elogios — 'Você é claramente alguém que leva X a sério'"
      - "Valores e identidade compartilhados — declarações do tipo 'Nós acreditamos...'"
      - "Tom conversacional — escreva como um amigo, não como uma corporação"
      - "Design atraente — a estética visual cria associação positiva"
    examples:
      - "Festas Tupperware — comprar de amigos gera 5x mais receita que o varejo"
      - "Espelhar padrões de linguagem aumenta o rapport e a obediência em 25%"
      - "Políticos que sorriem mais obtêm em média 10% mais votos"

  scarcity:
    definition: "As pessoas querem mais daquilo que podem ter menos — a disponibilidade limitada aumenta o valor percebido e a urgência de agir"
    mechanism: "A aversão à perda (perder algo dói 2x mais que ganhar dá prazer) combinada com a reatância (queremos o que não podemos ter) cria uma urgência poderosa"
    copy_applications:
      - "Tempo limitado — 'A oferta expira sexta à meia-noite'"
      - "Quantidade limitada — 'Apenas 47 vagas restantes'"
      - "Bônus que desaparecem — 'Peça nas próximas 24 horas para receber...'"
      - "Acesso exclusivo — 'Somente por convite' ou 'Inscrição obrigatória'"
      - "Aumentos de preço — 'O preço sobe na segunda'"
      - "Escassez de informação — 'Esta página vai sair do ar em breve'"
    examples:
      - "Experimento dos biscoitos de Worchel — biscoitos de um pote quase vazio foram avaliados como 40% mais desejáveis que biscoitos idênticos de um pote cheio"
      - "Booking.com — 'Apenas 2 quartos restantes por este preço' aumenta a conversão em mais de 20%"
      - "A escassez da Black Friday gera mais de US$ 9B em vendas online em um único dia"

  unity:
    definition: "As pessoas são mais influenciadas por aqueles que veem como 'um dos nossos' — identidade compartilhada, tribo e pertencimento criam uma influência profunda que transcende os outros seis princípios"
    mechanism: "A identidade compartilhada ('nós') cria disposição para se sacrificar pelo grupo. Vai além da afinidade — tem a ver com ser do mesmo tipo"
    copy_applications:
      - "Linguagem tribal — 'Nós somos o tipo de pessoa que...'"
      - "Inimigo compartilhado — una-se contra um adversário comum (a indústria, o velho jeito)"
      - "Linguagem interna — jargão e terminologia que sinalizam pertencimento"
      - "História de origem — 'Eu vim do mesmo lugar onde você está agora'"
      - "Construção de movimento — crie uma identidade à qual as pessoas queiram se juntar"
      - "Enquadramento Nós vs. Eles — posicione seu público contra um 'eles' claramente definido"
    examples:
      - "O 'Think Different' da Apple criou uma identidade tribal, não apenas uma base de clientes"
      - "A identidade comunitária do CrossFit gera retenção acima de 90% através do pertencimento tribal"
      - "Movimentos políticos — a identidade compartilhada é mais poderosa que as posições de política"

blair_warren_5_triggers:
  source: "The One Sentence Persuasion Course (2013) — Blair Warren"
  core_principle: "As pessoas farão qualquer coisa por aqueles que encorajam seus sonhos, justificam seus fracassos, acalmam seus medos, confirmam suas suspeitas e atiram pedras em seus inimigos"

  encourage_dreams:
    definition: "Valide e amplifique as aspirações da outra pessoa — não descarte, diminua nem redirecione os sonhos dela"
    mechanism: "A maioria das pessoas teve os sonhos descartados por família, amigos e sociedade. Quando alguém acredita no sonho delas, o vínculo é imediato e profundo"
    copy_applications:
      - "Abra com a aspiração deles — 'Você quer construir um negócio de 7 dígitos trabalhando 20 horas por semana. Isso não é loucura — é exatamente o que ajudamos as pessoas a fazer'"
      - "Faça future pacing do sonho — 'Imagine acordar daqui a 6 meses...'"
      - "Valide a ambição — 'A maioria das pessoas vai te dizer que isso é impossível. Estão erradas'"
      - "Use em aberturas de VSL para criar rapport e confiança instantâneos"
    examples:
      - "Weight Watchers mudando de 'dieta' para 'viver sua melhor vida' — encorajando o sonho, não consertando o problema"
      - "Tesla — encorajando o sonho do luxo sustentável, não vendendo carros elétricos"

  justify_failures:
    definition: "Remova a culpa pelos fracassos passados deles — não foi culpa deles, foi o método, a informação ou o sistema que os falhou"
    mechanism: "As pessoas carregam culpa e vergonha sobre fracassos passados. Remover esse fardo cria gratidão e lealdade profundas"
    copy_applications:
      - "'Não é culpa sua que você ainda luta com X — os métodos que te ensinaram eram fundamentalmente falhos'"
      - "'Você não fracassou — o sistema te falhou'"
      - "'O motivo de sua última tentativa não ter funcionado não tem nada a ver com o seu esforço...'"
      - "Use depois de se identificar com a luta deles para criar a mudança de crença"
    examples:
      - "Todo produto de dieta de todos os tempos: 'Não tem a ver com força de vontade — tem a ver com biologia'"
      - "SaaS: 'Planilhas não foram projetadas para isso. É por isso que era tão difícil'"

  allay_fears:
    definition: "Nomeie os medos específicos deles e forneça evidência ou lógica que os dissolva"
    mechanism: "Medos não nomeados são mais poderosos que medos nomeados. Quando você nomeia o medo, você o encolhe. Quando você fornece um contra-argumento, você o elimina"
    copy_applications:
      - "'Você pode estar pensando que isto parece bom demais para ser verdade. Aqui está por que não é...'"
      - "'Eu sei que você está preocupado com X. Deixa eu te mostrar por que isso não vai acontecer'"
      - "Auditorias de acusação — liste todos os medos antes que eles os levantem"
      - "Garantias e reversão de risco — 'Se você não ver resultados em 60 dias, não paga nada'"
    examples:
      - "Política de devolução de 365 dias da Zappos — acalmando o medo de comprar sapatos online"
      - "'30 minutos ou é grátis' da Domino's — acalmando o medo da entrega de pizza fria"

  confirm_suspicions:
    definition: "Valide o que eles secretamente acreditavam mas não conseguiam provar — 'Você estava certo o tempo todo'"
    mechanism: "Todo mundo tem crenças não validadas sobre por que as coisas não estão funcionando. Confirmá-las cria confiança instantânea porque você 'sacou' quando ninguém mais sacou"
    copy_applications:
      - "'Você sempre suspeitou que [prática comum] não funciona de verdade. Você estava certo'"
      - "'Aquela sensação que você tem de que algo está errado? Confie nela. Aqui está o que está realmente acontecendo'"
      - "'Os especialistas têm mentido para você sobre X. Aqui está a prova'"
      - "Use em leads em estilo de conspiração e em posicionamento contrário"
    examples:
      - "Dollar Shave Club confirmando a suspeita de que os preços das lâminas são um golpe"
      - "O marketing de alimentos orgânicos confirmando suspeitas sobre pesticidas e a grande indústria agrícola"

  throw_rocks_at_enemies:
    definition: "Identifique um inimigo comum e ataque-o publicamente — una seu público contra um adversário compartilhado"
    mechanism: "Inimigos compartilhados criam vínculos mais fortes que interesses compartilhados. Quanto mais específico e vívido o inimigo, mais forte a conexão tribal"
    copy_applications:
      - "'A indústria de dietas de US$ 60 bilhões não quer que você saiba disto'"
      - "'Enquanto Wall Street fica rica, os americanos comuns ficam para trás'"
      - "'O velho jeito de fazer marketing — o jeito que os gurus te ensinaram — está morto'"
      - "Inimigos podem ser: indústrias, ideologias, práticas, empresas específicas ou 'o velho jeito'"
    examples:
      - "O 'Mac vs. PC' da Apple — a Microsoft era o inimigo"
      - "CrossFit vs. 'academias de rede' (globo gyms) — criou lealdade feroz através da identificação do inimigo"
      - "Toda marca desafiante de todos os tempos — Pepsi vs. Coca, Avis vs. Hertz, Dollar Shave vs. Gillette"

sugarman_30_triggers:
  source: "Triggers (1999) / The Adweek Copywriting Handbook (2006) — Joe Sugarman"

  - trigger: "Consistency"
    description: "Uma vez que a pessoa assume uma posição, ela se sente compelida a permanecer consistente com ela"
    copy_use: "Obtenha um pequeno compromisso cedo (quiz, teste grátis, opt-in de e-mail) — eles permanecerão consistentes com a identidade de comprador"

  - trigger: "Product Nature"
    description: "Cada produto tem uma natureza inerente — uma personalidade e caráter únicos que devem ser compreendidos antes de escrever"
    copy_use: "Estude o produto profundamente antes de escrever. O copy deve emergir da verdadeira natureza do produto, não ser imposto de fora"

  - trigger: "Prospect Nature"
    description: "Entender quem é o comprador em um nível emocional e psicológico determina cada decisão de copy"
    copy_use: "Pesquise os medos, desejos, linguagem e crenças do comprador. Escreva para a pessoa, não para o demográfico"

  - trigger: "Fad/Trend"
    description: "As pessoas querem fazer parte do que é atual — tendências criam urgência através do momentum cultural"
    copy_use: "Posicione seu produto como parte de um movimento ou tendência maior. 'A revolução do X' ou 'Junte-se ao movimento'"

  - trigger: "Timing"
    description: "A mesma mensagem em momentos diferentes produz resultados radicalmente distintos"
    copy_use: "Lance quando o mercado estiver faminto. Amarre ofertas a momentos culturais, estações, eventos de notícia ou timing pessoal (volta às aulas, ano novo)"

  - trigger: "Linking"
    description: "Conecte seu produto a algo que o prospecto já conhece, gosta ou valoriza"
    copy_use: "Analogias e metáforas — 'É como a Netflix do aprendizado' ou 'O iPhone dos rastreadores de fitness'"

  - trigger: "Storytelling"
    description: "Histórias driblam a faculdade crítica e engajam a emoção — a ferramenta de vendas mais poderosa já descoberta"
    copy_use: "Todo produto tem uma história. A história de origem, a história do cliente, a história da descoberta — encontre-a e conte-a"

  - trigger: "Authority"
    description: "As pessoas respeitam e seguem especialistas e instituições reconhecidos"
    copy_use: "Cite credenciais, publique pesquisas, associe-se a nomes reconhecidos, demonstre expertise profunda no próprio copy"

  - trigger: "Desire to Belong"
    description: "Os humanos têm uma necessidade primal de pertencer a um grupo — de serem aceitos e incluídos"
    copy_use: "Crie comunidade em torno do seu produto. 'Junte-se a 50.000 profissionais de marketing inteligentes' ou 'Bem-vindo à tribo'"

  - trigger: "Desire to Collect"
    description: "As pessoas adoram colecionar — conjuntos, séries, edições e níveis criam engajamento contínuo"
    copy_use: "Crie ecossistemas de produtos, séries, níveis ou edições. 'Volume 1 de 12' ou 'Certificação Nível 2'"

  - trigger: "Curiosity"
    description: "Um loop aberto na mente exige fechamento — a curiosidade é um dos impulsos humanos mais poderosos"
    copy_use: "Fascination bullets, open loops, cliffhangers, transições do tipo 'mas isso não é tudo', linhas de assunto que criam lacunas"

  - trigger: "Sense of Urgency"
    description: "Sem um motivo para agir agora, as pessoas recorrem ao 'depois', que significa 'nunca'"
    copy_use: "Prazos, quantidades limitadas, aumentos de preço, bônus que desaparecem — dê a eles um motivo para o porquê de agora importar"

  - trigger: "Fear"
    description: "O medo da perda é mais motivador que a esperança de ganho — por um fator de 2x, segundo Kahneman"
    copy_use: "Pinte o custo da inação. 'Como será sua vida em 5 anos se nada mudar?' ou 'Não fique de fora'"

  - trigger: "Instant Gratification"
    description: "As pessoas querem resultados agora, não depois — o desejo por recompensa imediata é instintivo"
    copy_use: "Enfatize a velocidade de entrega e de resultados. 'Acesso instantâneo' — 'Veja resultados em 48 horas' — 'Baixe agora'"

  - trigger: "Exclusivity"
    description: "As pessoas querem o que os outros não podem ter — a exclusividade cria valor percebido e status"
    copy_use: "'Somente por convite' — 'Limitado a 100 membros' — 'Inscrição obrigatória' — 'Não é para todos'"

  - trigger: "Simplicity"
    description: "As pessoas gravitam em direção a soluções simples — a complexidade cria dúvida e paralisia"
    copy_use: "Faça o mecanismo soar simples. '3 passos' — 'Um truque simples' — 'É só apertar play' — Remova a complexidade percebida"

  - trigger: "Relationships"
    description: "Relacionamentos fortes entre comprador e vendedor criam uma lealdade que transcende a lógica"
    copy_use: "E-mails pessoais, conteúdo de bastidores, vulnerabilidade, responsividade — aja como uma pessoa, não como uma empresa"

  - trigger: "Guilt"
    description: "As pessoas agem para aliviar a culpa — dar aciona a culpa da reciprocidade, não agir aciona a autoculpa"
    copy_use: "Valor gratuito cria culpa de reciprocidade. 'Eu te dei tudo de graça — o mínimo que você pode fazer é conferir minha oferta'"

  - trigger: "Specificity"
    description: "Alegações específicas são mais críveis que alegações genéricas — '97,3%' supera 'quase todos'"
    copy_use: "Use números, nomes, datas e detalhes exatos. 'Aumentou a receita em US$ 47.233 em 63 dias' e não 'aumentou dramaticamente a receita'"

  - trigger: "Familiarity"
    description: "As pessoas confiam no que reconhecem — o efeito de mera exposição significa que o contato repetido aumenta a afinidade"
    copy_use: "Exposição consistente da marca, retargeting, frequência de e-mail, presença nas redes sociais — esteja no mundo deles repetidamente"

  - trigger: "Hope"
    description: "A esperança é o motivador humano supremo — as pessoas comprarão qualquer coisa que lhes dê esperança de um futuro melhor"
    copy_use: "Pinte a possibilidade. 'Imagine se...' — 'Como seria sua vida se...' — 'Pela primeira vez, é realmente possível'"

  - trigger: "Greed"
    description: "O desejo de obter mais do que o esperado — ofertas, pechinchas e valor desproporcional acionam a ganância"
    copy_use: "Empilhamento de valor, ofertas de bônus, 'valor total: US$ 4.997 — seu hoje por US$ 297', descontos por volume, leve 2 pague 1 (BOGO)"

  - trigger: "Credibility"
    description: "Tudo no copy deve ser crível — uma única alegação incrível destrói a confiança em todo o resto"
    copy_use: "Admissões prejudiciais, limitações específicas, comparações honestas, seções de 'Para quem isto NÃO é'"

  - trigger: "Satisfaction Conviction"
    description: "O comprador deve acreditar que ficará satisfeito — isto vai além das características, até a certeza emocional"
    copy_use: "Garantias, períodos de teste, políticas de dinheiro de volta, 'fique com tudo mesmo se cancelar' — elimine a ansiedade da compra"

  - trigger: "Mental Engagement"
    description: "A mente que está engajada é a mente que compra — leitores passivos não convertem"
    copy_use: "Perguntas, preencher-a-lacuna, quizzes, calculadoras, 'imagine-se...' — force a participação mental"

  - trigger: "Honesty"
    description: "Transparência e honestidade são persuasivas porque são raras — admitir falhas constrói confiança"
    copy_use: "Admissões prejudiciais, limitações, 'Para quem isto NÃO é', comparações honestas, a abordagem 'We Try Harder' da Avis"

  - trigger: "Proof of Value"
    description: "Valor demonstrado é mais persuasivo que valor alegado — mostre, não conte"
    copy_use: "Amostras grátis, vídeos de demonstração, estudos de caso com screenshots, demonstrações ao vivo, métricas públicas"

  - trigger: "Emotion"
    description: "As pessoas compram na emoção e justificam com lógica — o argumento emocional deve ser feito antes do lógico"
    copy_use: "Comece com emoção (história, dor, desejo). Siga com lógica (dados, comparação, ROI). Feche com emoção (future pacing)"

  - trigger: "Involvement"
    description: "O envolvimento físico e mental no processo de compra aumenta o compromisso com a compra"
    copy_use: "Quizzes, configuradores, 'escolha seu plano', elementos interativos, 'escolha sua cor', opções de customização"

  - trigger: "Rhyme"
    description: "Frases que rimam são percebidas como mais verdadeiras — a 'heurística de Keats' (beleza = verdade)"
    copy_use: "'If it doesn't fit, you must acquit' — slogans que rimam, frases memoráveis, frases aliterativas"

voss_negotiation_tools:
  source: "Never Split the Difference (2016) — Chris Voss"

  tactical_empathy:
    definition: "Entender os sentimentos e a mentalidade do outro no momento, e ouvir o que está por trás desses sentimentos — depois usar esse entendimento para influenciar"
    copy_application: "Abra o copy demonstrando que você entende o estado emocional exato deles — 'Eu sei como é encarar sua conta bancária às 3h e sentir aquele nó no estômago'"
    technique: "Nomeie a realidade deles antes de oferecer sua solução. Quanto mais precisamente você descreve os sentimentos deles, mais eles confiam em você"

  labeling:
    definition: "Identificar e verbalizar a emoção da outra pessoa — 'Parece que...', 'Soa como...', 'Dá a impressão de que...'"
    copy_application: "Use a rotulação em linhas de assunto de e-mail e em leads de copy — 'Soa como se você já tivesse tentado de tudo para crescer seu negócio e nada estivesse funcionando.' Força o leitor a pensar 'é isso mesmo'"
    technique: "Comece os rótulos com 'Parece que' ou 'Soa como' — nunca 'Eu acho' (torna a coisa sobre você). O objetivo é uma resposta 'é isso mesmo'"

  mirroring:
    definition: "Repetir as últimas 1-3 palavras críticas que a outra pessoa disse — aciona o detalhamento e cria rapport"
    copy_application: "Em roteiros de vendas e sequências de chatbot, espelhe a linguagem exata do prospecto. No copy, use dados de voz do cliente para espelhar as palavras deles de volta"
    technique: "No copy escrito: use as frases exatas deles de avaliações, pesquisas e tickets de suporte. Em calls: repita as últimas 3 palavras deles como pergunta"

  accusation_audit:
    definition: "Listar proativamente toda coisa negativa que a outra parte possa pensar sobre você ou sua oferta — antes que eles a digam"
    copy_application: "Em páginas de vendas: 'Você provavelmente está pensando que isto é só mais um curso que não vai funcionar. Você está pensando que vou cobrar milhares. Você está pensando que isto parece bom demais para ser verdade. Eu entendo. Aqui está por que isto é diferente...'"
    technique: "Liste 3-5 objeções/medos específicos. Seja MAIS negativo do que eles seriam. Isso desarma a resistência e cria confiança através da transparência"

  calibrated_questions:
    definition: "Perguntas de 'Como' e 'O que' que dão a ilusão de controle enquanto, na verdade, guiam a conversa"
    copy_application: "Em CTAs e transições: 'O que valeria para você resolver este problema para sempre?' — 'Como sua vida mudaria se você nunca mais se preocupasse com X?'"
    technique: "Nunca pergunte 'Por quê' (aciona a defensividade). Use 'Como' e 'O que' para criar senso de propriedade e engajamento"

  thats_right:
    definition: "O momento em que a outra pessoa diz 'É isso mesmo' — indicando que você resumiu com precisão a situação dela e ela se sente verdadeiramente compreendida"
    copy_application: "No copy, o momento 'é isso mesmo' acontece quando o leitor concorda com a cabeça em reconhecimento. Consiga isso descrevendo a situação dele com tanta precisão que ele se sinta conhecido"
    technique: "Resuma o problema, os sentimentos, as tentativas fracassadas e o desejo deles — quando pensarem 'é exatamente isso', eles são seus"

  loss_aversion_framing:
    definition: "Enquadrar a conversa em torno do que eles têm a perder, não apenas do que podem ganhar"
    copy_application: "'A cada dia que você espera, você está perdendo US$ X em receita potencial' é mais poderoso que 'Você poderia ganhar US$ X a mais'"
    technique: "Quantifique o custo da inação. Faça o status quo parecer mais caro que a compra"

klaff_frame_types:
  source: "Pitch Anything (2011) / Flip the Script (2019) — Oren Klaff"

  power_frame:
    definition: "O frame da autoridade e do status — a pessoa com o status mais alto controla a interação"
    how_to_set: "Estabeleça sua autoridade cedo sem se gabar. Demonstre competência através da especificidade. Use sinais de status (credenciais, clientes anteriores, aceitação seletiva)"
    copy_application: "Copy de agência: 'Recusamos US$ 2M em projetos ano passado porque não eram o encaixe certo' — inverte a dinâmica de poder. O vendedor se torna o selecionador"
    collision_strategy: "Quando um prospecto tenta afirmar poder (te fazendo esperar, citando nomes importantes), use uma pequena rebeldia ou humor para quebrar o frame dele — depois redefina o seu"

  time_frame:
    definition: "Quem controla o relógio controla o negócio — a urgência cria foco e evita a paralisia por análise"
    how_to_set: "Estabeleça limites de tempo claros. 'Tenho 15 minutos para esta call.' 'Esta oferta fecha sexta.' 'Só fazemos onboarding de 3 clientes por mês'"
    copy_application: "Landing pages com contadores regressivos, prazos de 'As portas fecham', 'Aceitamos inscrições até a data X' — a pressão de tempo força decisões"
    collision_strategy: "Se alguém tenta te desacelerar ('Deixa eu pensar'), reconheça e comprima — 'Entendo perfeitamente. A maioria das pessoas que pensam por mais de 48 horas descobre que o momento passou'"

  analyst_frame:
    definition: "O frame da lógica fria e dos dados — usado por tipos analíticos para adiar decisões e manter o controle através de perguntas"
    how_to_set: "Quando alguém tenta te puxar para um analyst frame (pedindo planilhas de ROI, análise competitiva), quebre o frame com intriga — 'Posso te mostrar todos os dados, mas primeiro deixa eu te mostrar algo que você nunca viu antes'"
    copy_application: "Em copy direcionado a compradores analíticos: forneça dados suficientes para satisfazer o cérebro lógico, mas sempre retorne à emoção. Os dados abrem a porta; a emoção fecha o negócio"
    collision_strategy: "Use uma 'cognição quente' (hot cognition) — uma história ou demonstração emocionalmente convincente — para romper o frame analítico frio"

  prize_frame:
    definition: "Posicione-se como o prêmio a ser conquistado, não como o vendedor perseguindo o comprador — inverta a dinâmica por completo"
    how_to_set: "'Somos seletivos sobre com quem trabalhamos.' 'Nem todos se qualificam.' 'Entrevistamos clientes em potencial para garantir o encaixe mútuo.' Vendas baseadas em inscrição"
    copy_application: "Ofertas high-ticket: 'Inscreva-se para uma vaga' vs 'Compre agora'. 'Estamos procurando 5 [tipo de pessoa] sérios' vs 'Qualquer um pode entrar'. Faz o comprador correr atrás"
    collision_strategy: "Se alguém age como se estivesse te fazendo um favor ao considerar sua oferta, a retirada cria desejo — 'Soa como se este talvez não seja o momento certo para você' aciona a aversão à perda"

  moral_authority_frame:
    definition: "O frame de estar certo — ter a superioridade moral em uma discussão ou pitch"
    how_to_set: "Posicione sua oferta como alinhada a um princípio superior — justiça, transparência, acesso, verdade. 'Acreditamos que todos merecem acesso a X'"
    copy_application: "Copy movido por missão: 'Construímos isto porque estávamos cansados de ver a indústria X se aproveitar das pessoas.' Cria uma obrigação ética de apoiar você"
    collision_strategy: "Quando alguém questiona seus motivos ou preço, responda com sua missão — 'Nossa missão é X. Este preço garante que possamos continuar a servir'"

cognitive_biases:
  source: "Kahneman, Tversky, Ariely e pesquisa em economia comportamental"

  anchoring:
    definition: "O primeiro número ou pedaço de informação encontrado influencia desproporcionalmente todos os julgamentos subsequentes"
    copy_application: "Mostre o preço alto primeiro. 'O valor total é US$ 12.497. Seu investimento hoje: US$ 997.' A âncora faz o preço real parecer uma pechincha"
    strength: "Afeta até especialistas que sabem da existência dele — um dos vieses cognitivos mais robustos"

  loss_aversion:
    definition: "Perder algo dói aproximadamente 2x mais do que ganhar a coisa equivalente dá prazer"
    copy_application: "Enquadre como prevenção de perda: 'Você está perdendo US$ X a cada dia que espera' é 2x mais motivador que 'Você poderia ganhar US$ X'. Além disso: 'Não fique de fora' > 'Entre agora'"
    strength: "Universal e profundamente enraizada — impulsiona compras de seguro, aversão ao risco e FOMO"

  social_proof_bias:
    definition: "Em situações ambíguas, as pessoas presumem que as ações dos outros refletem o comportamento correto"
    copy_application: "Depoimentos, contagem de usuários, notificações de compra em tempo real, listas de espera, etiquetas de 'Mais popular', endossos de celebridades"
    strength: "Aumenta com a similaridade da fonte da prova em relação ao leitor, e com a incerteza"

  scarcity_bias:
    definition: "As pessoas atribuem mais valor a oportunidades menos disponíveis — queremos mais do que podemos ter menos"
    copy_application: "Tempo limitado, quantidade limitada, acesso exclusivo, bônus que desaparecem, 'Apenas X restantes', listas de espera"
    strength: "Mais poderoso quando a escassez é nova (tornou-se escassa recentemente) e quando há competição pelo recurso escasso"

  bandwagon_effect:
    definition: "A tendência de adotar crenças e comportamentos na proporção do número de outros que o fizeram"
    copy_application: "'Junte-se a mais de 100.000 profissionais de marketing que já...' — números criam momentum. Mostre a onda e convide-os a surfá-la"
    strength: "Aumenta com o tamanho do grupo e a similaridade percebida com os adotantes"

  framing_effect:
    definition: "A mesma informação apresentada de forma diferente produz decisões diferentes — 90% sem gordura vs. 10% de gordura"
    copy_application: "Enquadre tudo da luz mais favorável. 'US$ 3,27/dia' vs 'US$ 1.197/ano'. 'Taxa de sucesso de 90%' vs 'Taxa de fracasso de 10%'. 'Investimento' vs 'custo'"
    strength: "Afeta as decisões mesmo quando as pessoas veem ambos os enquadramentos — a ordem e a ênfase importam"

  endowment_effect:
    definition: "As pessoas supervalorizam coisas que já possuem — uma vez que são donas delas (mesmo mentalmente), não querem abrir mão"
    copy_application: "Testes grátis, propriedade virtual ('Sua conta está pronta'), future pacing ('Imagine que você já tem isto'), garantias de 'fique com tudo'"
    strength: "Aumenta com a duração da posse e o apego emocional ao item"

  decoy_effect:
    definition: "Ao escolher entre duas opções, uma terceira (inferior) pode fazer uma das opções originais parecer dramaticamente melhor"
    copy_application: "Precificação de três níveis: Básico US$ 29, Pro US$ 99, Enterprise US$ 97 (o chamariz faz o Pro parecer a escolha óbvia). O famoso pacote impresso+digital da The Economist"
    strength: "Funciona mesmo quando as pessoas estão cientes da manipulação — a comparação é automática"

  zero_risk_bias:
    definition: "As pessoas preferem fortemente eliminar completamente o risco a reduzi-lo — mesmo quando a redução tem maior valor esperado"
    copy_application: "Garantias incondicionais superam as condicionais. 'Reembolso total, sem perguntas' > 'Reembolso de 80% se você completar os módulos'. Risco zero vence risco baixo"
    strength: "Impulsiona o design de garantias — quanto mais simples e absoluta a garantia, mais poderosa"

  hyperbolic_discounting:
    definition: "As pessoas preferem fortemente recompensas imediatas a recompensas futuras, mesmo quando a recompensa futura é objetivamente maior"
    copy_application: "Enfatize os benefícios imediatos: 'Acesso instantâneo' — 'Veja resultados hoje' — 'Baixe agora'. Antecipe a entrega de valor"
    strength: "Universal — explica por que os parcelamentos funcionam (pequena dor agora vs. grande dor depois)"

  status_quo_bias:
    definition: "As pessoas preferem o estado atual das coisas — a opção padrão vence a menos que haja um motivo convincente para mudar"
    copy_application: "Torne o custo de NÃO mudar vívido e doloroso. Mostre que o status quo é ativamente prejudicial, não neutro. 'A cada dia que você fica com seu sistema atual, você está perdendo...'"
    strength: "Muito forte — a maioria do marketing falha porque não supera o viés do status quo"

  confirmation_bias:
    definition: "As pessoas buscam e interpretam informações que confirmam suas crenças existentes — e ignoram evidências contraditórias"
    copy_application: "Comece confirmando o que eles já acreditam (o 'confirmar suas suspeitas' de Blair Warren). Depois redirecione. Nunca comece com informações que contradizem a visão de mundo deles"
    strength: "Mais forte com crenças profundamente arraigadas — decisões políticas, de saúde, financeiras"

  halo_effect:
    definition: "Uma impressão positiva em uma área cria impressões positivas em todas as outras áreas — e vice-versa"
    copy_application: "Comece com seu ponto de prova mais forte. Se seu design é bonito, ele cria um halo para a qualidade do produto. Se você tem um cliente famoso, mencione-o primeiro"
    strength: "Primeiras impressões criam halos que são extremamente difíceis de reverter"

  ikea_effect:
    definition: "As pessoas atribuem um valor desproporcionalmente alto a coisas que ajudaram a criar — mesmo que a criação tenha sido mínima"
    copy_application: "Customização, personalização, quizzes que 'montam seu plano', configuradores, experiências de 'escolha sua própria aventura'"
    strength: "Funciona até com contribuição trivial — resultados de quiz parecem mais valiosos porque o usuário 'participou'"

  recency_bias:
    definition: "Eventos recentes são ponderados com mais peso que eventos antigos no julgamento e na tomada de decisão"
    copy_application: "Use depoimentos atuais, resultados recentes, dados mais novos. 'Só este mês, 47 clientes...' supera 'Ao longo dos últimos 10 anos...'"
    strength: "Especialmente forte em mercados voláteis (financeiro, saúde) onde as coisas mudam rapidamente"

  peak_end_rule:
    definition: "As pessoas julgam experiências com base no momento de pico e no momento final — não na média geral"
    copy_application: "Projete a experiência de compra com um pico claro (a revelação, o momento do avanço) e um final forte (onboarding, boas-vindas, primeira vitória). A experiência pós-compra importa enormemente"
    strength: "Explica por que um fechamento e um onboarding perfeitos podem superar um meio mediano"

  dunning_kruger_effect:
    definition: "Pessoas com baixa competência superestimam sua habilidade, enquanto pessoas com alta competência subestimam a delas"
    copy_application: "Para iniciantes: não diga que estão errados — valide o esforço deles enquanto redireciona para seu método. Para especialistas: desafie-os — 'Você provavelmente acha que sabe X, mas...'"
    strength: "Determina como você posiciona conteúdo educacional — iniciantes precisam de encorajamento, especialistas precisam de desafio"

  sunk_cost_fallacy:
    definition: "As pessoas continuam investindo em algo por causa do investimento passado, mesmo quando isso não faz mais sentido racional"
    copy_application: "Em copy de retenção: 'Você já investiu 6 meses e US$ X — não perca esse progresso desistindo agora.' Em vendas: 'Você já gastou US$ X em Y que não funcionou — isto protege esse investimento'"
    strength: "Aumenta com o tamanho do investimento anterior (tempo, dinheiro, emoção)"

  availability_heuristic:
    definition: "As pessoas julgam a probabilidade com base na facilidade com que exemplos vêm à mente — exemplos vívidos, recentes ou emocionais parecem mais prováveis"
    copy_application: "Use histórias vívidas e específicas em vez de estatísticas. 'A Sarah perdeu 21 kg' é mais persuasivo que '94% dos usuários perdem peso' porque histórias estão disponíveis na memória"
    strength: "Histórias vencem estatísticas quase toda vez porque histórias são mais facilmente recordadas"

  paradox_of_choice:
    definition: "Opções demais criam paralisia de decisão — menos opções levam a mais compras e maior satisfação"
    copy_application: "Limite a no máximo 3 opções (bom/melhor/ótimo). Remova escolhas desnecessárias. Um CTA por página. Simplifique a decisão"
    strength: "Especialmente forte em ambientes digitais onde infinitas opções estão a um clique de distância"
