      - "Daily Email Discipline"
      - "Audience Filtration"
      - "Villains and Enemies"
    essential_for: [ben-settle, dan-koe, andre-chaperon]

  - title: "The RMBC Method"
    author: "Stefan Georgi"
    year: 2018
    core_teaching: "Um processo sistemático de 4 etapas para escrever VSLs e cartas de vendas de formato longo — Research, Mechanism, Brief, Copy. Elimina o bloqueio criativo através de uma preparação exaustiva"
    key_frameworks:
      - "RMBC 4-Step Process"
      - "Avatar Deep Dive"
      - "Unique Mechanism Naming"
      - "VSL Brief Template"
      - "Fascination Research Method"
    essential_for: [stefan-georgi, jon-benson, parris-lampropoulos]

  - title: "The E5 Method"
    author: "Todd Brown"
    year: 2018
    core_teaching: "Arquitetura de funil de marketing construída em torno de uma Big Idea e de um Unique Mechanism — cinco fases (Engage, Educate, Excite, Exchange, Execute) que movem os prospectos da atenção à ação"
    key_frameworks:
      - "E5 Method"
      - "Big Idea Extraction"
      - "Unique Mechanism Positioning"
      - "Marketing Funnel Architecture"
      - "Campaign Theme Development"
    essential_for: [todd-brown, eugene-schwartz, stefan-georgi]

  - title: "Triggers"
    author: "Joe Sugarman"
    year: 1999
    core_teaching: "30 gatilhos psicológicos que compelem as pessoas a comprar — do storytelling e da curiosidade à autoridade e exclusividade. Cada gatilho é uma ferramenta a ser empregada estrategicamente"
    key_frameworks:
      - "30 Sales Triggers"
      - "Storytelling Trigger"
      - "Curiosity Trigger"
      - "Consistency Trigger"
      - "Linking Trigger"
    essential_for: [joe-sugarman, robert-cialdini, gary-bencivenga]

  - title: "Confessions of an Advertising Man"
    author: "David Ogilvy"
    year: 1963
    core_teaching: "O negócio e o ofício da publicidade por dentro — como tocar uma agência, conquistar clientes, escrever copy eficaz e construir marcas que duram"
    key_frameworks:
      - "Brand Personality Building"
      - "Research-Led Creativity"
      - "Direct Response Principles for Brand"
      - "Client Relationship Management"
    essential_for: [david-ogilvy, david-deutsch, copy-chief]

  - title: "My Life in Advertising"
    author: "Claude Hopkins"
    year: 1927
    core_teaching: "A autobiografia de Hopkins detalhando as campanhas que construíram a resposta direta moderna — da cerveja Schlitz ao creme dental Pepsodent. Cada capítulo é um estudo de caso em métodos testados"
    key_frameworks:
      - "Preemptive Claim (Schlitz)"
