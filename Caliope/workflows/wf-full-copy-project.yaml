workflow:
  id: wf-full-copy-project
  name: "Projeto Completo de Copy Master"
  version: "2.0.0"
  description: |
    Workflow completo de projeto de copywriting de ponta a ponta com 32 agentes
    especialistas e camada de psicologia da persuasão. Conduz um creative brief
    pela atribuição de especialista, escrita, checkpoint de psicologia (Cialdini/Warren),
    revisão do Copy Master Chief e entrega final.
  trigger: "*full-copy-project"
  entry_agent: copy-master-chief
  estimated_duration: "30-60 minutes"
  type: sequential
  sequence:
    - agent: copy-master-chief
      action: diagnose
      creates: diagnosis
    - agent: copy-master-chief
      action: assign-specialist
      creates: assignment_brief
    - agent: "{assigned_specialist}"
      action: write-copy
      creates: draft_copy
    - agent: copy-master-chief
      action: psychology-checkpoint
      creates: psychology_audit
    - agent: copy-master-chief
      action: critique
      creates: critique_report
    - agent: copy-master-chief
      action: review
      creates: final_copy

phases:
  - id: phase_0
    name: "Brief e Diagnóstico"
    agent: copy-master-chief
    task: diagnose.md
    description: "O Copy Master Chief recebe o brief do projeto, diagnostica a solicitação, identifica o tipo de copy, o nível de consciência e seleciona o melhor especialista entre 32 agentes em 27 domínios."
    outputs:
      - diagnosis: "markdown"
      - assigned_specialist: "agent-id"
      - copy_type: "string"
    checkpoint:
      gate: "Especialista identificado com ALTA confiança"
      veto: "Brief ambíguo — solicitar esclarecimento antes de prosseguir"

  - id: phase_1
    name: "Atribuição do Especialista"
    agent: copy-master-chief
    task: diagnose.md
    depends_on: [phase_0]
    description: "O Copy Master Chief atribui formalmente o projeto ao especialista selecionado com o brief, os dados de audiência, o nível de consciência e qualquer material de referência."
    outputs:
      - assignment_brief: "markdown"
    checkpoint:
      gate: "Especialista reconhecido com entregáveis claros"
      veto: "Especialista incompatível com o tipo de copy"

  - id: phase_2
    name: "Produção do Copy"
    agent: "{assigned_specialist}"
    task: "{matched_task}"
    depends_on: [phase_1]
    description: "O especialista atribuído escreve o copy usando sua metodologia característica. A task é selecionada dinamicamente com base no tipo de copy: write-headline.md, write-sales-letter.md, write-vsl-script.md, write-email-sequence.md, write-ad-copy.md, write-landing-page.md, create-funnel-copy.md, write-bullets.md, create-offer.md, write-webinar-script.md ou write-pitch-deck.md. Cada task inclui a fase da Camada Psicológica com os princípios de Cialdini e Warren."
    outputs:
      - draft_copy: "markdown"
    checkpoint:
      gate: "Rascunho completo com todas as seções obrigatórias conforme o formato da task, incluindo a Camada Psicológica"
      veto: "Rascunho faltando seções críticas, fora do brief ou sem o mapeamento de psicologia da persuasão"

  - id: phase_3
    name: "Checkpoint de Psicologia"
    agent: copy-master-chief
    task: review.md
    depends_on: [phase_2]
    description: "O Copy Master Chief verifica se a camada de psicologia da persuasão está corretamente aplicada. Confere se no mínimo 3 princípios de Cialdini estão ativos, 2 alavancas de Warren estão engajadas e se os princípios estão tecidos naturalmente (não apenas anexados). Para ofertas, valida a Value Equation de Hormozi."
    outputs:
      - psychology_audit: "markdown"
      - psychology_pass: "boolean"
    checkpoint:
      gate: "Mínimo de 3 princípios de Cialdini ativos E 2 alavancas de Warren engajadas"
      veto: "Menos de 3 princípios de Cialdini OU princípios aplicados de forma enganosa"

  - id: phase_4
    name: "Crítica do Chief"
    agent: copy-master-chief
    task: critique-copy.md
    depends_on: [phase_3]
    description: "O Copy Master Chief revisa o rascunho usando o framework de crítica aprimorada de 8 pontos mais a auditoria de psicologia da persuasão. Pontua, identifica problemas e determina se o copy está pronto para entrega ou precisa de revisão."
    outputs:
      - critique_report: "markdown"
      - verdict: "string"
    checkpoint:
      gate: "Nota composta >= 60% (veredito Strong ou Elite) E checkpoint de psicologia aprovado"
      veto: "Nota composta < 40% — o especialista deve reescrever"

  - id: phase_5
    name: "Entrega Final"
    agent: copy-master-chief
    task: review.md
    depends_on: [phase_4]
    description: "O Copy Master Chief compila o pacote de entregável final com o copy aprovado, as notas da crítica, a documentação da arquitetura de persuasão e as recomendações de uso."
    outputs:
      - final_copy: "markdown"
      - usage_notes: "markdown"
      - persuasion_architecture: "markdown"
    checkpoint:
      gate: "Pacote pronto para o cliente com todos os entregáveis, incluindo o mapeamento de persuasão"
      veto: "Problemas de crítica não resolvidos ainda em aberto"

completion_criteria:
  - "Brief diagnosticado e especialista atribuído a partir do quadro de 32 agentes"
  - "Copy produzido pelo especialista certo usando a metodologia certa"
  - "Checkpoint de psicologia aprovado (Cialdini + Warren + Hormozi quando aplicável)"
  - "Crítica do Chief aprovada com veredito Strong ou Elite"
  - "Pacote final entregue com notas de uso e arquitetura de persuasão"
