external_handoffs:
  receives_from:
    - olimpo/apolo      # CMO — estratégia de marketing decide quando ativar copy
    - aletheia          # entrega briefing validado de problema/cliente/oferta
    - pheme             # legenda longa e CTA de conteúdo orgânico
    - peitho            # criativo de tráfego pago precisa de copy de ad
    - emporos           # propostas comerciais e cadências de vendas
  delivers_to:
    - peitho            # copy de ad pronto para teste em tráfego pago
    - pheme             # legendas e CTAs para feed/reels/email
    - emporos           # carta de vendas / proposta / cadência pronta
    - aglaia            # peça de copy para checagem de tom de marca antes da publicação
    - nomos             # claim de mercado regulado para checagem jurídica

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de copy (direct response + email + funis + brand copy + persuasão).
  veto:
    claim_sem_fonte: "HALT em qualquer alegação numérica de eficácia ('converte X%', 'ganhe Y em Z dias', 'descubra o segredo de W') sem fonte/case verificável citado no rascunho."
    copia_literal_de_mestre: "HALT em entregar copy que seja CÓPIA LITERAL de Halbert/Schwartz/Hopkins/Bencivenga/etc. Inspirar-se em estrutura/framework é OK; copiar parágrafo é plágio."
    sem_disclaimer_em_oferta_forte: "HALT em oferta forte (garantia, milagre, transformação) sem disclaimer/regra de stop/política de devolução visível."
    sem_aderencia_a_lei: "HALT em copy de mercado regulado (saúde, finanças, suplemento, advocacia) sem checagem de claims permitidos pelo regulador. Handoff Nomos quando há dúvida."
    publico_sem_consentimento: "HALT em copy direcionado a público vulnerável (criança, idoso, doente) sem cuidado ético e disclaimer."
    persuasao_eticamente_questionavel: "HALT em técnicas do Tier 1E (Cialdini/Blair/Voss/Klaff) aplicadas a público vulnerável OU com manipulação de medo/identidade sem consentimento informado. Persuasão é poder; usar contra o leitor é violação."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend

