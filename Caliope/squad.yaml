name: copy-squad
version: "1.0.0"
short-title: "Copy Squad"
description: "Squad de elite com 23 agentes de copywriting — 22 copywriters lendários + 1 orquestrador. Cobre direct response, email, funis, VSLs, cartas de vendas, ofertas e copywriting de marca."
author: "Synkra AIOS"
license: MIT
slashPrefix: "copy-squad"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - copywriting
  - direct-response
  - sales-letter
  - email
  - vsl
  - funnel
  - headline
  - offer
  - ad-copy
  - launch
  - brand-copy

components:
  agents:
    # Tier 0 — Orquestrador
    - copy-chief.md
    # Tier 1A — Lendas da Resposta Direta
    - gary-halbert.md
    - eugene-schwartz.md
    - claude-hopkins.md
    - gary-bencivenga.md
    - robert-collier.md
    - john-carlton.md
    - jim-rutz.md
    # Tier 1B — Copy Moderna & Funis
    - dan-kennedy.md
    - frank-kern.md
    - russell-brunson.md
    - todd-brown.md
    - stefan-georgi.md
    - jon-benson.md
    - ry-schwartz.md
    # Tier 1C — Copy de E-mail & Relacionamento
    - ben-settle.md
    - andre-chaperon.md
    - dan-koe.md
    # Tier 1D — Ofertas & Páginas de Vendas
    - joe-sugarman.md
    - david-ogilvy.md
    - clayton-makepeace.md
    - parris-lampropoulos.md
    - david-deutsch.md
  tasks:
    # Tarefas de Escrita
    - write-headline.md
    - write-sales-letter.md
    - write-vsl-script.md
    - write-email-sequence.md
    - write-ad-copy.md
    - write-landing-page.md
    - write-bullets.md
    - create-funnel-copy.md
    - create-offer.md
    # Tarefas de Análise & Revisão
    - analyze-copy.md
    - critique-copy.md
    - diagnose.md
    - review.md
  workflows:
    - wf-full-copy-project.yaml
    - wf-copy-review-cycle.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de copy (direct response + email + funis + brand copy).
  veto:
    claim_sem_fonte: "HALT em qualquer alegação numérica de eficácia ('converte X%', 'ganhe Y em Z dias', 'descubra o segredo de W') sem fonte/case verificável citado no rascunho."
    copia_literal_de_mestre: "HALT em entregar copy que seja CÓPIA LITERAL de Halbert/Schwartz/Hopkins/Bencivenga/etc. Inspirar-se em estrutura/framework é OK; copiar parágrafo é plágio."
    sem_disclaimer_em_oferta_forte: "HALT em oferta forte (garantia, milagre, transformação) sem disclaimer/regra de stop/política de devolução visível."
    sem_aderencia_a_lei: "HALT em copy de mercado regulado (saúde, finanças, suplemento, advocacia) sem checagem de claims permitidos pelo regulador. Handoff Nomos quando há dúvida."
    publico_sem_consentimento: "HALT em copy direcionado a público vulnerável (criança, idoso, doente) sem cuidado ético e disclaimer."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend

# Arquitetura de Tiers (metadados — não exigidos pelo schema, enriquecem o roteamento)
