# ═══════════════════════════════════════════════════════════════════
# Squad: Copy Squad
# Domínio: Copywriting & Resposta Direta
# Versão: 1.0.0
# ═══════════════════════════════════════════════════════════════════

squad:
  name: copy-squad
  display_name: "Copy Squad"
  version: "1.0.0"
  domain: "Copywriting de elite — resposta direta, e-mail, funis, VSLs, cartas de vendas, ofertas e copy de marca"
  description: |
    Squad de 23 agentes de copywriting — 22 copywriters lendários + 1 orquestrador.
    Cada agente é um clone de alta fidelidade de um mestre real do copywriting, cobrindo
    resposta direta, e-mail, funis, VSLs, cartas de vendas, ofertas e copywriting de marca.
  keywords: [copywriting, direct response, sales letter, email, VSL, funnel, headline, offer, ad copy, launch, bullets, brand copy]
  entry_agent: copy-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orquestração"
    agents: [copy-chief]
    purpose: "Triar demandas de copywriting, rotear ao especialista certo, controle de qualidade"
  tier_1a:
    name: "Lendas da Resposta Direta"
    agents: [gary-halbert, eugene-schwartz, claude-hopkins, gary-bencivenga, robert-collier, john-carlton, jim-rutz]
    purpose: "Mestres clássicos da resposta direta — formato longo, impresso, mala direta"
  tier_1b:
    name: "Copy Moderna & Funis"
    agents: [dan-kennedy, frank-kern, russell-brunson, todd-brown, stefan-georgi, jon-benson, ry-schwartz]
    purpose: "Copy da era digital — VSLs, funis, webinars, lançamentos"
  tier_1c:
    name: "E-mail & Relacionamento"
    agents: [ben-settle, andre-chaperon, dan-koe]
    purpose: "Sequências de e-mail, e-mails diários, copy de nutrição"
  tier_1d:
    name: "Ofertas & Páginas de Vendas"
    agents: [joe-sugarman, david-ogilvy, clayton-makepeace, parris-lampropoulos, david-deutsch]
    purpose: "Arquitetura de ofertas, anúncios impressos, copy financeira/de saúde"

