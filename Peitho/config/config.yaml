# ═══════════════════════════════════════════════════════════════════
# Squad: Traffic Masters
# Domínio: Aquisição de Tráfego Pago e Compra de Mídia
# Version: 1.0.0
# ═══════════════════════════════════════════════════════════════════

squad:
  name: traffic-masters
  display_name: "Traffic Masters"
  version: "1.0.0"
  domain: "Aquisição de tráfego pago em todas as principais plataformas — compra de mídia, criativos, análise e escala"
  description: |
    16 agentes especializados que dominam a aquisição de tráfego pago em todas as principais plataformas.
    Combina agentes especialistas baseados em pessoas reais (compradores de mídia e estrategistas de anúncios de classe mundial) com
    agentes especialistas funcionais para análise de criativos, otimização de performance, escala
    e gestão fiscal. Cobre Facebook/Meta, YouTube, Google, TikTok e LinkedIn.
  keywords: [tráfego pago, Facebook ads, Google ads, YouTube ads, TikTok ads, compra de mídia, criativos, escala, ROAS, CPA, rastreamento, pixels, atribuição, orçamento de anúncios]
  entry_agent: traffic-chief
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orquestração"
    agents: [traffic-chief]
    purpose: "Diagnosticar desafios de tráfego, rotear para o especialista certo por plataforma ou função"
  tier_1_experts:
    name: "Agentes Especialistas por Plataforma"
    agents: [molly-pittman, ralph-burns, depesh-mandalia, nicholas-kusmich, tom-breeze, kasim-aslam, pedro-sobral]
    purpose: "Especialistas de tráfego de classe mundial clonados de profissionais reais com histórico comprovado"
  tier_1_functional:
    name: "Especialistas Funcionais"
    agents: [ad-midas, media-buyer, performance-analyst, creative-analyst, scale-optimizer, pixel-specialist, ads-analyst, fiscal]
    purpose: "Agentes especializados para funções específicas de gestão de tráfego"

