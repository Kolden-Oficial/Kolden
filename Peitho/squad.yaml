name: traffic-masters
version: "1.0.0"
short-title: "Traffic Masters"
description: "Squad de 16 agentes especialistas em tráfego pago. Facebook, YouTube, Google Ads, media buying, análise de criativos, escala, rastreamento."
author: "Synkra AIOS"
license: MIT
slashPrefix: "traffic-masters"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - traffic
  - ads
  - facebook
  - google
  - youtube
  - media-buying
  - creative
  - scaling
  - tracking

components:
  agents:
    - traffic-chief.md
    - molly-pittman.md
    - ralph-burns.md
    - depesh-mandalia.md
    - nicholas-kusmich.md
    - tom-breeze.md
    - kasim-aslam.md
    - pedro-sobral.md
    - ad-midas.md
    - media-buyer.md
    - performance-analyst.md
    - creative-analyst.md
    - scale-optimizer.md
    - pixel-specialist.md
    - ads-analyst.md
    - fiscal.md
  tasks:
    - analyze-performance.md
    - audit-ad-account.md
    - create-ad-creative.md
    - create-ad-strategy.md
    - diagnose.md
    - manage-budget.md
    - review.md
    - scale-campaign.md
    - setup-tracking.md
  workflows:
    - wf-account-audit.yaml
    - wf-campaign-launch.yaml
  checklists:
    - output-quality.md

cross_cutting:
  quality_standards:
    min_score: 7.0
  # Vetos invioláveis do squad de tráfego pago (Meta/Google/YouTube/TikTok).
  veto:
    sem_teto_de_gasto: "HALT em qualquer campanha/escala recomendada sem teto de gasto declarado e regra de corte por performance. Mídia paga sem teto vira sangramento."
    sem_pixel_e_rastreio: "HALT em ativação de tráfego pago sem rastreio instrumentado (pixel, eventos de conversão, atribuição) — gastar sem medir é cego."
    claim_que_viola_politica: "HALT em copy de anúncio com claim/promessa que viole política da plataforma (Meta Ads, Google Ads Policies, TikTok Ads) — categorias proibidas, antes/depois, milagre."
    sem_aprovacao_de_budget: "HALT em executar mudança de budget acima do teto sem aprovação explícita do CFO (Plutos) — exceção é escalonamento, nunca decisão local."
    credencial_texto_puro: "HALT em qualquer credencial fora do Infisical (Art. VII)."

config:
  extends: extend
