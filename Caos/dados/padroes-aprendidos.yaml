# Padrões Aprendidos do Kolden
#
# O que funcionou (e o que não funcionou) ao criar agentes. Capturado na Fase 8 de cada
# Ritual. Alimenta as próximas criações: o `pesquisador` e o `arquiteto` consultam aqui
# para não reinventar decisões já validadas, e o `diagnosticador` evita perguntas que já
# se mostraram inúteis.
#
# Só o subagent `curador` escreve aqui (ver .claude/regras/autoridade-de-subagent.md).
#
# Esquema de cada padrão:
#   <id>:
#     dominio: a que domínio se aplica (ou "geral")
#     tipo: aceleracao_diagnostico | decisao_arquitetura | antipadrao
#     padrao: o que se observou
#     evidencia: [ids de agentes onde isso apareceu]
#     recomendacao: o que fazer da próxima vez
#     registradoEm: ISO-8601

versao: "1.1.0"
atualizado_em: "2026-06-20"

padroes:
  # Sementes iniciais derivadas das referências (aiox-core, xquads-squads).
  # Serão refinadas e ampliadas a cada criação real.

  squad-quando-3-ou-mais-especializacoes:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Domínios que exigem 3+ especializações distintas com perspectivas que se beneficiam
      de confronto/síntese tendem a funcionar melhor como squad (tier 0 + tier 1) do que
      como um único agente sobrecarregado.
    evidencia: ["referência: xquads-squads/advisory-board, copy-squad"]
    recomendacao: "Na Fase 3, considere squad quando o diagnóstico listar 3+ papéis distintos."
    registradoEm: "2026-06-11T00:00:00Z"

  routing-por-keywords-barato:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Roteamento por keyword-match (catálogo domínio→agente) resolve a maioria dos casos
      de triagem sem custo de modelo e é fácil de auditar.
    evidencia: ["referência: xquads-squads/*/data/routing-catalog.yaml"]
    recomendacao: "Prefira routing por keywords antes de roteamento por LLM."
    registradoEm: "2026-06-11T00:00:00Z"

  guardrail-deve-ser-hook-nao-prompt:
    dominio: geral
    tipo: antipadrao
    padrao: >
      Confiar só no system prompt para impedir uma ação proibida falha sob pressão do
      modelo. Proibição absoluta precisa virar hook determinístico (exit 2).
    evidencia: ["referência: aiox-core constitution + Kolden criacao-de-hooks"]
    recomendacao: "Toda proibição NÃO-NEGOCIÁVEL do PRD vira hook PreToolUse, não só texto."
    registradoEm: "2026-06-11T00:00:00Z"

  veto-semantico-multicamada:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Quando o "veto" é um gate de RACIOCÍNIO (ex.: "não recomende build sem evidência"), um
      hook determinístico não consegue julgá-lo sozinho. A mitigação robusta é multicamada:
      regra no orquestrador (veto_rules) + item CRITICAL no checklist (gate) + checkpoint com
      `veto` no workflow + reflexo PreToolUse para a parte mecânica (segredos, comandos destrutivos).
    evidencia: ["aletheia"]
    recomendacao: "Separe o veto mecânico (reflexo) do veto semântico (prompt+checklist+workflow); não finja que um hook resolve um gate de julgamento."
    registradoEm: "2026-06-20T00:00:00Z"

  squad-de-validacao-precede-execucao:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Squads de "entrada de funil" (descoberta/validação) entregam mais valor quando NÃO executam
      e fazem handoff explícito (por arquivo/contexto) para os squads de execução já existentes,
      em vez de duplicar capacidade. O ADAPT vira um handoff, não uma cópia.
    evidencia: ["aletheia -> aglaia/pluto/harmonia/caliope/prometeu/metis"]
    recomendacao: "Para squads novos que tocam domínios já cobertos, defina handoffs nomeados no squad.yaml (external_handoffs) em vez de reimplementar."
    registradoEm: "2026-06-20T00:00:00Z"
