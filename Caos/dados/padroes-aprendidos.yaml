# Padrões Aprendidos do Kolden
#
# O que funcionou (e o que não funcionou) ao criar agentes. Capturado na Fase 8 de cada
# Ritual. Alimenta as próximas criações: o `pesquisador` e o `arquiteto` consultam aqui
# para não reinventar decisões já validadas, e o `diagnosticador` evita perguntas que já
# se mostraram inúteis.
#
# Só o subagent `curador` escreve aqui (ver .claude/regras/autoridade-de-subagent.md).
#
# Esquema de cada padrão:
#   <id>:
#     dominio: a que domínio se aplica (ou "geral")
#     tipo: aceleracao_diagnostico | decisao_arquitetura | antipadrao
#     padrao: o que se observou
#     evidencia: [ids de agentes onde isso apareceu]
#     recomendacao: o que fazer da próxima vez
#     registradoEm: ISO-8601

versao: "1.5.0"   # +helpdesk-da-ferramenta-antes-de-decidir-reuse-vs-create (retificação da Fase 0 do Ritual Íris 2026-07-01 — MCP oficial da Solomon existia e não foi encontrado no crawl inicial)
atualizado_em: "2026-07-01"

padroes:
  # Sementes iniciais derivadas das referências (aiox-core, xquads-squads).
  # Serão refinadas e ampliadas a cada criação real.

  squad-quando-3-ou-mais-especializacoes:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Domínios que exigem 3+ especializações distintas com perspectivas que se beneficiam
      de confronto/síntese tendem a funcionar melhor como squad (tier 0 + tier 1) do que
      como um único agente sobrecarregado.
    evidencia: ["referência: xquads-squads/advisory-board, copy-squad"]
    recomendacao: "Na Fase 3, considere squad quando o diagnóstico listar 3+ papéis distintos."
    registradoEm: "2026-06-11T00:00:00Z"

  routing-por-keywords-barato:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Roteamento por keyword-match (catálogo domínio→agente) resolve a maioria dos casos
      de triagem sem custo de modelo e é fácil de auditar.
    evidencia: ["referência: xquads-squads/*/data/routing-catalog.yaml"]
    recomendacao: "Prefira routing por keywords antes de roteamento por LLM."
    registradoEm: "2026-06-11T00:00:00Z"

  guardrail-deve-ser-hook-nao-prompt:
    dominio: geral
    tipo: antipadrao
    padrao: >
      Confiar só no system prompt para impedir uma ação proibida falha sob pressão do
      modelo. Proibição absoluta precisa virar hook determinístico (exit 2).
    evidencia: ["referência: aiox-core constitution + Kolden criacao-de-hooks"]
    recomendacao: "Toda proibição NÃO-NEGOCIÁVEL do PRD vira hook PreToolUse, não só texto."
    registradoEm: "2026-06-11T00:00:00Z"

  veto-semantico-multicamada:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Quando o "veto" é um gate de RACIOCÍNIO (ex.: "não recomende build sem evidência"), um
      hook determinístico não consegue julgá-lo sozinho. A mitigação robusta é multicamada:
      regra no orquestrador (veto_rules) + item CRITICAL no checklist (gate) + checkpoint com
      `veto` no workflow + reflexo PreToolUse para a parte mecânica (segredos, comandos destrutivos).
    evidencia: ["aletheia"]
    recomendacao: "Separe o veto mecânico (reflexo) do veto semântico (prompt+checklist+workflow); não finja que um hook resolve um gate de julgamento."
    registradoEm: "2026-06-20T00:00:00Z"

  squad-de-validacao-precede-execucao:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Squads de "entrada de funil" (descoberta/validação) entregam mais valor quando NÃO executam
      e fazem handoff explícito (por arquivo/contexto) para os squads de execução já existentes,
      em vez de duplicar capacidade. O ADAPT vira um handoff, não uma cópia.
    evidencia: ["aletheia -> aglaia/pluto/harmonia/caliope/prometeu/metis"]
    recomendacao: "Para squads novos que tocam domínios já cobertos, defina handoffs nomeados no squad.yaml (external_handoffs) em vez de reimplementar."
    registradoEm: "2026-06-20T00:00:00Z"

  rh-dos-agentes-e-adapt-do-curador:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Uma função "meta" pedida como "um agente dono de X de todos os outros agentes" (ex.: "RH
      dos agentes" — dono das identidades: hard/soft skills, mentalidade, ferramentas, gatilhos)
      quase nunca é um AGENTE NOVO. Quando já existe um dono institucional do domínio-meta (aqui:
      o Caos como fábrica + o subagente `curador` como memória institucional + os dados
      `registro-de-entidades.yaml`/`padroes-aprendidos.yaml`), criar um agente separado DUPLICA a
      posse e fragmenta a fonte de verdade (dois escritores do mesmo registro = conflito) — o
      anti-padrão que o próprio curador existe para impedir (Art. VI). A resposta é ADAPT:
      ESTENDER o dono existente. A lacuna real raramente é "falta um dono"; é "falta o ARTEFATO
      normalizado" — um cartão de identidade ÚNICO por agente (5 eixos) e um roster agente-granular
      consultável (o registro de entidades era squad-granular: ~17 entidades para ~194 agentes; e o
      `perfil.md` previsto na spec nunca foi produzido em nenhum agente). Distinção que orienta o
      diagnóstico: função meta sobre os PRÓPRIOS agentes pertence ao Caos, não a um squad de negócio
      (corrigida a má-atribuição "RH dos agentes" em olimpo.pontosDeExtensao).
    evidencia: ["curador", "modelos/cartao-de-identidade.md", "dados/elenco-de-agentes.yaml"]
    recomendacao: >
      Quando o pedido for "um agente que governa/centraliza algo de TODOS os agentes", primeiro
      cheque se o Caos/curador já é o dono institucional desse meta-domínio. Se for, faça ADAPT
      (estenda o mandato do curador + crie o artefato normalizado + ligue ao Ritual Fase 5/8), não
      CREATE. Verifique também se a spec promete um artefato que não existe na prática (ex.: perfil.md)
      e realize-o no ADAPT. Atribua função meta-sobre-agentes ao Caos, nunca a um squad de operação.
    registradoEm: "2026-06-26T00:00:00Z"

  verificador-de-runtime:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Verificação não é tarefa única — há dois verificadores distintos que não devem ser
      confundidos. O "verificador-de-fábrica" (revisor/testador do Caos) audita um ARTEFATO
      de agente contra o PRD em tempo de BUILD, antes da entrega. O "verificador-de-runtime"
      (ex.: Dike) reconcilia uma MISSÃO VIVA em execução contra a intenção LACRADA num
      contrato, em tempo de OPERAÇÃO, e localiza o degrau exato onde a entrega divergiu da
      promessa. Eixos diferentes (build×runtime, artefato×missão, PRD×lacre): exigem agentes
      separados, não um genérico sobrecarregado. O verificador-de-runtime opera fail-closed
      (TPND=0: toda promessa não-demonstrada conta como falha).
    evidencia: ["dike", "referência: revisor/testador do Caos (Fases 6-7)"]
    recomendacao: "Quando o pedido for 'verificar', distinga build vs runtime: se é missão viva contra intenção lacrada, crie/reuse um verificador-de-runtime fail-closed (degrau-da-quebra + TPND=0); não tente que o revisor/testador de fábrica cubra runtime, nem vice-versa."

  openapi-filtra-escopo-antes-do-prd:
    dominio: geral
    tipo: aceleracao_diagnostico
    padrao: >
      Ao construir MCP para API externa, puxar o `openapi.json` VIA da doc oficial (ou o próprio
      endpoint OpenAPI) na Fase 2 é o filtro que trava o escopo do PRD. Documentação em Markdown
      da ferramenta pode omitir a granularidade real (endpoints públicos vs internos, campos
      obrigatórios vs opcionais); a spec OpenAPI é a fonte de verdade contratual. Sem esse filtro
      na Fase 2, o PRD lista tools que a API não sustenta e o eval descobre isso caro (na Fase 7).
    evidencia: ["iris (MCP Solomon 2026-07-01) — pré-Ritual listou 6-12 tools; OpenAPI mostrou 2 endpoints (POST /order + POST /product); v1 cortado para 4 tools; leitura/atribuição/webhooks foram para v2 explícito com justificativa"]
    recomendacao: "Na Fase 2 (pesquisa) de todo MCP, o PRIMEIRO passo é firecrawl_scrape do openapi.json (ou equivalente) e mapa de rotas por método + read/write. Sem OpenAPI, escopo do PRD é chute — abrir Gate humano ou escalar suporte antes de gerar PRD."
    registradoEm: "2026-07-01T18:38:00Z"

  mcp-cliente-scoped-com-promocao-condicional:
    dominio: geral
    tipo: decisao_arquitetura
    padrao: >
      Quando o primeiro cliente que precisa de um MCP é único e o path canônico Kolden é
      `Dedalo/mcp/<nome>/` (código compartilhado, vendor comum), pode ser prematuro nascer lá.
      Padrão viável: nascer isolado em `sobre-a-empresa/Projetos/<Cliente>/mcp-<x>/` (ownership
      claro no dossiê do cliente, isolamento total, decisão reversível) + ADR obrigatório com
      cláusula de promoção condicional (gatilho = 2º cliente adota → mover para Dedalo/mcp/<x>/
      via ADR-N + atualização de `claude mcp add` + atualização de registro; passa por Caos +
      aprovação Ronan). Evita generalização prematura enquanto preserva rota clara de canonização.
    evidencia: ["iris (MCP Solomon 2026-07-01) — cliente Rosie como primeiro; path em sobre-a-empresa/projetos/rosie/mcp-solomon/ com ADR 0001 formalizando decisão + cláusula de promoção"]
    recomendacao: "Ao criar MCP para 1 cliente único, considere path cliente-scoped + ADR de promoção condicional. Registrar em registro-de-entidades.yaml com `cliente_origem` + `promocao_para_dedalo` claros. Só canonize em Dedalo/mcp/ quando o 2º cliente concreto pedir."
    registradoEm: "2026-07-01T18:38:00Z"

  helpdesk-da-ferramenta-antes-de-decidir-reuse-vs-create:
    dominio: geral
    tipo: antipadrao
    padrao: >
      Na Fase 0 do Ritual (`consulta-ao-registro`) + Fase 2 (`busca-de-referencias`) para MCP de
      ferramenta comercial, buscar SOMENTE no registro Kolden + `openapi.json` público + GitHub
      é insuficiente. O MCP oficial de uma ferramenta pode ser servido por endpoint HTTP autenticado
      por OAuth (Cloud Run, Fly, Vercel), com tutorial só no helpdesk/Intercom da própria empresa —
      ficando fora do OpenAPI da API-cliente e fora do npm/pypi. Sem checar essas fontes, a Fase 0
      pode dar CREATE quando o correto era REUSE, e a categórica "não existe MCP oficial nem de
      comunidade" vira overreach.
    evidencia: ["iris 2026-07-01 — Ritual entregou MCP custom após declarar 'sem MCP oficial nem de comunidade'; Ronan corrigiu apontando https://intercom.help/solomon-d7e33f0728c8/pt-BR/articles/13860266 (tutorial oficial, MCP em Cloud Run com OAuth). Íris reposicionado como complementar (write server-to-server); MCP oficial cobre leitura via OAuth"]
    recomendacao: "Na Fase 2, adicionar ao radar de busca: (a) `firecrawl_search` por 'MCP <ferramenta>' e 'model context protocol <ferramenta>'; (b) `firecrawl_scrape` no helpdesk/Intercom/Notion da empresa; (c) grep no repositório GitHub oficial da ferramenta por 'mcp'; (d) checar npm registry por `mcp-<slug>` / `@<vendor>/mcp`. Reportar veredito como 'não encontrado em X, Y, Z fontes' — nunca 'não existe' categórico. Se dúvida, PARAR e perguntar ao Ronan antes de gerar PRD."
    registradoEm: "2026-07-01T19:00:00Z"

  colisao-de-nome-mitologico-e-real:
    dominio: geral
    tipo: antipadrao
    padrao: >
      Rodada 0 do diagnóstico (Alma + nomeação) deve verificar ATIVAMENTE se o nome mitológico
      proposto já está em uso — grep no registro-de-entidades.yaml + ls no root Kolden. A memória
      do Caos pode omitir squads recentes; o pré-Ritual pode propor um nome que colidiu no meio da
      construção da frota. Sem check, colisão só aparece depois do PRD escrito (custo alto).
    evidencia: ["iris 2026-07-01 — pré-Ritual propôs Argos; colisão pega no momento da nomeação (Argos = squad ativo de inteligência de mercado desde 2026-06-21); trocado por Íris após confirmar disponibilidade"]
    recomendacao: "Na Rodada 0, faça grep + ls antes de propor 3 nomes. Se algum pré-selecionado bater, remova da lista antes de mostrar ao Ronan."
    registradoEm: "2026-07-01T18:38:00Z"
    registradoEm: "2026-06-26T00:00:00Z"
