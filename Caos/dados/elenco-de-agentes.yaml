# Elenco de Agentes do Kolden — roster por-AGENTE (RH dos agentes)
#
# Fonte de verdade MACHINE-READABLE do elenco de agentes individuais da Kolden.
# Cada entrada é uma instância do Cartão de Identidade (modelos/cartao-de-identidade.md):
# básicos + os 5 eixos (hard_skills, soft_skills, mentalidade, ferramentas, gatilhos).
#
# Onde cada coisa vive (não confundir):
#   - AGENTS.md (raiz)                  -> VITRINE HUMANA (uma linha por agente).
#   - dados/registro-de-entidades.yaml  -> entidades (squads/skills/agentes-solo), granularidade de SQUAD.
#   - dados/elenco-de-agentes.yaml       -> ESTE arquivo: granularidade de AGENTE individual (o roster).
#
# Dono: subagente `curador` (Caos) — único que escreve aqui. Ver .claude/agents/curador.md.
# Preenchido na Fase 5 (todo agente novo nasce com cartão) e no backfill dos legados; entra na Fase 8.
#
# ┌─ BACKFILL PENDENTE ───────────────────────────────────────────────────────────────────┐
# │ Semeado com os 9 agentes do sistema hierárquico de 5 camadas (Olimpo + Dike).           │
# │ Os ~185 agentes restantes (Caliope, Peitho, Egide, Aglaia, Argos, Aletheia, ...) ainda  │
# │ NÃO foram cartografados — é um job de FAN-OUT (subagentes lendo cada agents/*.md e       │
# │ emitindo o cartão), AINDA NÃO EXECUTADO. Até lá, este roster cobre 9 de ~194 agentes.   │
# └─────────────────────────────────────────────────────────────────────────────────────────┘
#
# Esquema de cada entrada: ver modelos/cartao-de-identidade.md (bloco YAML canônico).

versao: "0.1.0"
atualizado_em: "2026-06-26"
cobertura: "9 de ~194 agentes (backfill dos demais PENDENTE — fan-out não executado)"

agentes:

