# Registro de Entidades do Kolden
#
# Catálogo de tudo que o Caos já criou (agentes, squads, skills, hooks, subagents).
# É o coração do loop de aprendizado: a Fase 0 consulta este arquivo antes de cada
# criação para aplicar REUSE > ADAPT > CREATE (Constituição, Artigo VI).
#
# Só o subagent `curador` escreve aqui (ver .claude/regras/autoridade-de-subagent.md).
#
# Esquema de cada entidade:
#   <id>:
#     path: caminho relativo a partir da raiz do Kolden
#     tipo: agente | squad | skill | hook | subagent
#     dominio: conversacional | dados | trafego | copy | automacao | rag | outro
#     proposito: uma frase
#     keywords: [lista de termos para o keyword-match da Fase 0]
#     usadoPor: [ids de quem depende desta entidade]
#     dependencias: [ids dos quais esta entidade depende]
#     adaptabilidade:
#       score: 0.0-1.0   # quão fácil é adaptar sem quebrar
#       restricoes: [o que NÃO pode mudar]
#       pontosDeExtensao: [o que pode ser estendido]
#     versao: x.y.z
#     criadoEm: ISO-8601
#
# Regras de decisão da Fase 0 (relevância = sobreposição de keywords + domínio):
#   relevancia >= 0.90  -> REUSE  (use a entidade direto)
#   0.60 <= relevancia < 0.90 e adaptabilidade.score >= 0.6 -> ADAPT (mude <= 30%)
#   sem correspondência  -> CREATE (registre na Fase 8 com justificativa)

versao_do_registro: "1.1.0"
atualizado_em: "2026-06-19"

