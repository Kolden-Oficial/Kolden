# Registro de Ferramentas do Kolden — fonte machine-readable consultável sob demanda
#
# Propósito duplo:
#  (a) o agente PROATIVO descobre e ativa a ferramenta certa por GATILHO (casa uma necessidade
#      à ferramenta — o "SEO de ferramentas"), sem o humano dizer qual usar;
#  (b) o Ronan vê o arsenal completo num só lugar.
#
# A vitrine humana é `ferramentas.md` (índice mestre) + os manuais por ferramenta em `<Nome>/ferramentas.md`.
# Este YAML é a fonte estruturada. Mantê-los cruzados.
#
# Art. VII (Constituição): nenhuma credencial em texto puro — só o CAMINHO no Infisical.
#   Resolver em runtime: infisical run --projectId=43d90b85-ca09-437c-b8f2-364b5cbe6093 --env=<prod|dev> -- <cmd>
#   (secrets no path raiz de cada env; usar --projectId+--env, não --path).
#
# Legenda `mcp`: oficial | comunidade | conector-claude-ai | host-cliente | nenhum
# Legenda `status`: ativo | pendente (credencial/token a cadastrar) | sem-api
# `gate_busca: true` => a ferramenta dispara a Política de Busca (declarar ferramenta+nível e
#   aguardar confirmação do Ronan antes de usar; ver ~/.claude/CLAUDE.md e gate-busca.cjs).

versao: "1.0.0"
