<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kolden · Organograma Corporativo — Cenário de Ápice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb;
    --bg-2: #ffffff;
    --fg: #1a1c24;
    --fg-soft: #555867;
    --fg-dim: #8a8d99;
    --border: #e3e5ec;
    --border-strong: #c9ccd6;
    --accent: #7F77DD;
    --shadow: 0 2px 8px rgba(20,22,40,.06), 0 1px 2px rgba(20,22,40,.04);
    --shadow-lg: 0 8px 28px rgba(20,22,40,.12);
    --radius: 10px;
    --radius-sm: 8px;
    --node-stroke: #ffffff;
    --link-color: #c9ccd6;
    --link-active: #7F77DD;
  }
  [data-theme="dark"] {
    --bg: #0e1018;
    --bg-2: #161823;
    --fg: #ecedf2;
    --fg-soft: #b6b9c5;
    --fg-dim: #7c8094;
    --border: #262936;
    --border-strong: #3a3e4f;
    --shadow: 0 2px 10px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
    --shadow-lg: 0 10px 32px rgba(0,0,0,.55);
    --node-stroke: #161823;
    --link-color: #353a4d;
    --link-active: #a59dff;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }

  header.app {
    flex:0 0 auto;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex; flex-direction: column; gap: 12px;
    z-index: 10;
  }
  .row { display:flex; align-items:center; gap:14px; flex-wrap: wrap; }
  .brand { display:flex; align-items:baseline; gap:14px; }
  .logo {
    font-weight: 800; letter-spacing: .12em;
    font-size: 18px; color:var(--fg);
    background: linear-gradient(135deg,#7F77DD,#534AB7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { font-size: 12.5px; color:var(--fg-soft); font-weight:500; letter-spacing:.02em; }
  .spacer { flex:1; }
  .counter {
    font-size: 12px; color: var(--fg-soft);
    background: var(--bg);
    border:1px solid var(--border);
    padding: 6px 10px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .counter b { color:var(--fg); font-weight:600; }

  .controls { gap: 10px; }
  .search {
    position:relative;
    flex: 0 1 320px;
  }
  .search input {
    width:100%;
    background: var(--bg); color: var(--fg);
    border:1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(127,119,221,.2); }
  .search::before {
    content:""; position:absolute; left:10px; top:50%;
    width:14px; height:14px; transform:translateY(-50%);
    background: no-repeat center / contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8d99' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  }

  .btn {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.icon-only { padding: 7px 9px; }

  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill {
    border:1px solid var(--border-strong);
    background: var(--bg);
    color: var(--fg-soft);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11.5px; font-weight: 500;
    cursor: pointer;
    transition: all .12s;
    display: inline-flex; align-items:center; gap: 6px;
    user-select: none;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pill:hover { color:var(--fg); border-color: var(--fg-soft); }
  .pill.active { color:#fff; border-color: transparent; }
  .pill[data-area="ceo"].active { background:#7F77DD; }
  .pill[data-area="operations"].active { background:#1D9E75; }
  .pill[data-area="finance"].active { background:#639922; }
  .pill[data-area="technology"].active { background:#378ADD; }
  .pill[data-area="revenue"].active { background:#D85A30; }
  .pill[data-area="people"].active { background:#D4537E; }
  .pill[data-area="governance"].active { background:#888780; }
  .pill[data-area="innovation"].active { background:#534AB7; }
  .pill[data-area="marketing"].active { background:#E85D24; }

  main {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 10%, rgba(127,119,221,.05), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(83,74,183,.04), transparent 55%),
      var(--bg);
  }
  [data-theme="dark"] main {
    background:
      radial-gradient(circle at 20% 10%, rgba(127,119,221,.08), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(83,74,183,.06), transparent 55%),
      var(--bg);
  }

  svg#org-canvas { width: 100%; height: 100%; display:block; cursor: grab; }
  svg#org-canvas:active { cursor: grabbing; }

  .link {
    fill: none;
    stroke: var(--link-color);
    stroke-width: 1.4;
    stroke-opacity: .75;
    transition: stroke .25s, stroke-opacity .25s;
  }
  .link.path-active { stroke: var(--link-active); stroke-opacity: 1; stroke-width: 2; }

  .node { cursor: pointer; }
  .node rect.bg {
    fill: var(--bg-2);
    stroke-width: 1.2;
    transition: filter .15s, transform .15s;
  }
  .node text { font-family: "Inter", system-ui; pointer-events:none; }
  .node text.title { font-weight: 700; font-size: 13px; fill: #fff; }
  .node text.subtitle { font-weight: 500; font-size: 10.5px; fill: rgba(255,255,255,.85); }
  .node .indicator {
    font-size: 10px; font-weight: 700; fill: rgba(255,255,255,.9);
  }
  .node:hover rect.bg { filter: brightness(1.08); }
  .node.dim { opacity: .15; }
  .node.match rect.bg { stroke: #fff; stroke-width: 3; filter: drop-shadow(0 0 8px rgba(255,255,255,.5)); }
  [data-theme="light"] .node.match rect.bg { stroke: #1a1c24; filter: drop-shadow(0 0 6px rgba(127,119,221,.7)); }

  .legend {
    position: absolute; bottom: 16px; left: 16px;
    background: var(--bg-2);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow);
    font-size: 11px;
    max-width: 260px;
  }
  .legend h4 { margin: 0 0 6px; font-size: 11px; color:var(--fg-soft); font-weight:600; letter-spacing:.04em; text-transform: uppercase; }
  .legend .row { gap: 6px; align-items: center; }
  .legend .item { display:inline-flex; align-items:center; gap:6px; padding:2px 0; font-size:11px; color:var(--fg-soft); }
  .legend .item .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink:0; }
  .legend-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }

  .help {
    position: absolute; bottom: 16px; right: 16px;
    background: var(--bg-2);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    box-shadow: var(--shadow);
    font-size: 11px;
    color: var(--fg-soft);
    line-height: 1.7;
  }
  .help kbd {
    display:inline-block; padding: 1px 5px; border:1px solid var(--border-strong);
    border-radius: 4px; font-size: 10px; background: var(--bg); color:var(--fg);
    font-family: ui-monospace, "SF Mono", monospace;
  }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow-lg);
    max-width: 320px;
    font-size: 12.5px;
    color: var(--fg);
    z-index: 50;
    opacity: 0; transform: translateY(4px);
    transition: opacity .12s, transform .12s;
  }
  #tooltip.show { opacity: 1; transform: translateY(0); }
  #tooltip .tt-title { font-weight: 700; font-size: 13px; color: var(--fg); margin-bottom: 2px; }
  #tooltip .tt-name { font-size: 11px; color: var(--fg-soft); margin-bottom: 8px; }
  #tooltip .tt-area { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight:600; color:#fff; margin-bottom:8px; }
  #tooltip ul { margin: 0; padding-left: 16px; }
  #tooltip li { margin: 2px 0; color: var(--fg-soft); font-size: 12px; line-height:1.45; }

  .toast {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%) translateY(-30px);
    background: var(--fg); color: var(--bg-2);
    padding: 8px 16px; border-radius: 999px; font-size: 12px;
    box-shadow: var(--shadow-lg);
    opacity: 0; transition: opacity .2s, transform .2s;
    z-index: 100; pointer-events:none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .legend, .help { display: none; }
    .controls { width: 100%; }
    .search { flex: 1 1 auto; }
  }
</style>
</head>
<body>

<header class="app">
  <div class="row">
    <div class="brand">
      <div class="logo">KOLDEN</div>
      <div class="subtitle">Organograma Corporativo · Cenário de Ápice</div>
    </div>
    <div class="spacer"></div>
    <div class="counter">Total: <b id="total-count">0</b> · Visíveis: <b id="visible-count">0</b></div>
  </div>
  <div class="row controls">
    <div class="search">
      <input id="search" type="search" placeholder="Buscar cargo (ex.: DevOps, CFO, Partners)…" autocomplete="off">
    </div>
    <div class="pills" id="filter-pills">
      <button class="pill" data-area="all"><span class="dot" style="background:#888"></span>Todos</button>
      <button class="pill" data-area="ceo"><span class="dot" style="background:#7F77DD"></span>CEO</button>
      <button class="pill" data-area="operations"><span class="dot" style="background:#1D9E75"></span>Operações</button>
      <button class="pill" data-area="finance"><span class="dot" style="background:#639922"></span>Finanças</button>
      <button class="pill" data-area="technology"><span class="dot" style="background:#378ADD"></span>Tecnologia</button>
      <button class="pill" data-area="revenue"><span class="dot" style="background:#D85A30"></span>Receita</button>
      <button class="pill" data-area="people"><span class="dot" style="background:#D4537E"></span>Pessoas</button>
      <button class="pill" data-area="marketing"><span class="dot" style="background:#E85D24"></span>Marketing</button>
      <button class="pill" data-area="governance"><span class="dot" style="background:#888780"></span>Governança</button>
      <button class="pill" data-area="innovation"><span class="dot" style="background:#534AB7"></span>Inovação</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btn-expand">Expandir nível</button>
    <button class="btn" id="btn-reset" title="Reset visual">↺ Reset</button>
    <button class="btn" id="btn-export" title="Exportar como PNG">⇩ PNG</button>
    <button class="btn icon-only" id="btn-theme" title="Alternar tema">◐</button>
  </div>
</header>

<main>
  <svg id="org-canvas"></svg>
  <div id="tooltip" hidden></div>
  <div class="legend">
    <h4>Áreas</h4>
    <div class="legend-grid">
      <div class="item"><span class="dot" style="background:#7F77DD"></span>CEO / Topo</div>
      <div class="item"><span class="dot" style="background:#1D9E75"></span>Operações</div>
      <div class="item"><span class="dot" style="background:#639922"></span>Finanças</div>
      <div class="item"><span class="dot" style="background:#378ADD"></span>Tecnologia</div>
      <div class="item"><span class="dot" style="background:#D85A30"></span>Receita</div>
      <div class="item"><span class="dot" style="background:#D4537E"></span>Pessoas / RH</div>
      <div class="item"><span class="dot" style="background:#E85D24"></span>Marketing</div>
      <div class="item"><span class="dot" style="background:#888780"></span>Governança</div>
      <div class="item"><span class="dot" style="background:#534AB7"></span>Inovação</div>
    </div>
  </div>
  <div class="help">
    <div><kbd>scroll</kbd> zoom · <kbd>drag</kbd> pan</div>
    <div><kbd>click</kbd> expandir/colapsar · <kbd>hover</kbd> detalhes</div>
  </div>
  <div class="toast" id="toast"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

/* ---- Construção da árvore ---- */
function buildTree(flat) {
  const map = new Map();
  flat.forEach(([id,parent,title,name,area,desc]) => {
    map.set(id, { id, parent, title, name, area, desc, children: [] });
  });
  let root = null;
  map.forEach(node => {
    if (node.parent === null) { root = node; }
    else {
      const p = map.get(node.parent);
      if (p) p.children.push(node);
      else console.warn("Parent não encontrado:", node.id, node.parent);
    }
  });
  return root;
}

const ORG_DATA = buildTree(FLAT);
const TOTAL_NODES = FLAT.length;

/* =========================================================================
   D3 — LAYOUT, ZOOM, RENDER
   ========================================================================= */

const NODE_W = 168, NODE_H = 50;
const LEVEL_GAP_Y = 130;
const SIBLING_GAP_X = 28;

const svg = d3.select("#org-canvas");
const tooltipEl = document.getElementById("tooltip");
const toastEl = document.getElementById("toast");

const gRoot = svg.append("g").attr("class", "viewport");
const gLinks = gRoot.append("g").attr("class", "links-layer");
const gNodes = gRoot.append("g").attr("class", "nodes-layer");

// zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 3])
  .on("zoom", (ev) => gRoot.attr("transform", ev.transform));
svg.call(zoom);

// hierarquia
let rootHier;
function rebuildHierarchy() {
  rootHier = d3.hierarchy(ORG_DATA, d => d.children);
  rootHier.x0 = 0; rootHier.y0 = 0;
  // colapsa nível >= 3 (depth 3+)
  rootHier.descendants().forEach(d => {
    if (d.depth >= 2 && d.children) {
      d._children = d.children;
      d.children = null;
    }
  });
}
rebuildHierarchy();

// estado de filtro
let activeFilter = "all";
let searchQuery = "";

function update(source) {
  const treeLayout = d3.tree().nodeSize([NODE_W + SIBLING_GAP_X, LEVEL_GAP_Y]);
  treeLayout(rootHier);

  const nodes = rootHier.descendants();
  const links = rootHier.links();

  // ----- Links -----
  const link = gLinks.selectAll("path.link").data(links, d => d.target.data.id);

  const linkEnter = link.enter().append("path")
    .attr("class","link")
    .attr("d", () => {
      const o = { x: source.x0 ?? 0, y: source.y0 ?? 0 };
      return diagonal(o, o);
    });

  link.merge(linkEnter)
    .transition().duration(300)
    .attr("d", d => diagonal(d.source, d.target));

  link.exit().transition().duration(300)
    .attr("d", () => {
      const o = { x: source.x ?? 0, y: source.y ?? 0 };
      return diagonal(o, o);
    })
    .remove();

  // ----- Nodes -----
  const node = gNodes.selectAll("g.node").data(nodes, d => d.data.id);

  const nodeEnter = node.enter().append("g")
    .attr("class","node")
    .attr("transform", () => `translate(${source.x0 ?? 0},${source.y0 ?? 0})`)
    .style("opacity", 0)
    .on("click", (ev, d) => {
      ev.stopPropagation();
      toggleNode(d);
      update(d);
    })
    .on("mouseenter", (ev, d) => showTooltip(ev, d))
    .on("mousemove", (ev) => moveTooltip(ev))
    .on("mouseleave", () => hideTooltip());

  // bg rect (sombra leve via filter)
  nodeEnter.append("rect")
    .attr("class","bg")
    .attr("width", NODE_W).attr("height", NODE_H)
    .attr("x", -NODE_W/2).attr("y", -NODE_H/2)
    .attr("rx", 9).attr("ry", 9)
    .attr("fill", d => AREA_COLORS[d.data.area] || "#888")
    .attr("stroke", "var(--node-stroke)");

  nodeEnter.append("text")
    .attr("class","title")
    .attr("text-anchor","middle")
    .attr("x", 0).attr("y", -3)
    .text(d => d.data.title);

  nodeEnter.append("text")
    .attr("class","subtitle")
    .attr("text-anchor","middle")
    .attr("x", 0).attr("y", 13)
    .text(d => truncate(d.data.name, 30));

  nodeEnter.append("text")
    .attr("class","indicator")
    .attr("text-anchor","middle")
    .attr("x", 0).attr("y", NODE_H/2 - 4)
    .text(d => (d._children) ? "▾" : (d.children ? "▴" : ""));

  const nodeUpdate = node.merge(nodeEnter);

  nodeUpdate.transition().duration(300)
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .style("opacity", 1);

  nodeUpdate.select(".indicator")
    .text(d => (d._children) ? "▾" : (d.children ? "▴" : ""));

  node.exit().transition().duration(300)
    .attr("transform", () => `translate(${source.x ?? 0},${source.y ?? 0})`)
    .style("opacity", 0)
    .remove();

  // memoriza posição
  rootHier.descendants().forEach(d => { d.x0 = d.x; d.y0 = d.y; });

  applyFilter();
  applySearch();
  updateCounters();
}

function diagonal(s, t) {
  // curva vertical suave
  const mid = (s.y + t.y) / 2;
  return `M${s.x},${s.y}
          C${s.x},${mid} ${t.x},${mid} ${t.x},${t.y}`;
}

function toggleNode(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else if (d._children) { d.children = d._children; d._children = null; }
}

function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n-1) + "…" : s;
}

/* ---- Tooltip ---- */
function showTooltip(ev, d) {
  const data = d.data;
  const color = AREA_COLORS[data.area] || "#888";
  const areaLabel = areaLabelOf(data.area);
  const bullets = (data.desc || []).map(b => `<li>${escapeHtml(b)}</li>`).join("");
  tooltipEl.innerHTML = `
    <div class="tt-area" style="background:${color}">${areaLabel}</div>
    <div class="tt-title">${escapeHtml(data.title)}</div>
    <div class="tt-name">${escapeHtml(data.name)}</div>
    <ul>${bullets}</ul>
  `;
  tooltipEl.hidden = false;
  tooltipEl.classList.add("show");
  moveTooltip(ev);
}
function moveTooltip(ev) {
  const pad = 14;
  const rect = tooltipEl.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = ev.clientX + pad;
  let y = ev.clientY + pad;
  if (x + rect.width > vw - 8) x = ev.clientX - rect.width - pad;
  if (y + rect.height > vh - 8) y = ev.clientY - rect.height - pad;
  tooltipEl.style.left = x + "px";
  tooltipEl.style.top  = y + "px";
}
function hideTooltip() {
  tooltipEl.classList.remove("show");
  setTimeout(() => { tooltipEl.hidden = true; }, 120);
}
function areaLabelOf(area) {
  return ({
    ceo:"CEO", operations:"Operações", finance:"Finanças",
    technology:"Tecnologia", revenue:"Receita", people:"Pessoas",
    governance:"Governança", innovation:"Inovação", marketing:"Marketing"
  })[area] || area;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

/* =========================================================================
   FILTRO POR ÁREA + BUSCA
   ========================================================================= */

function applyFilter() {
  gNodes.selectAll("g.node")
    .classed("dim", d => activeFilter !== "all" && d.data.area !== activeFilter);
  gLinks.selectAll("path.link")
    .style("opacity", d => {
      if (activeFilter === "all") return null;
      const inArea = d.target.data.area === activeFilter || d.source.data.area === activeFilter;
      return inArea ? 1 : 0.1;
    });
}

function applySearch() {
  const q = searchQuery.trim().toLowerCase();
  gNodes.selectAll("g.node").classed("match", false);
  gLinks.selectAll("path.link").classed("path-active", false);
  if (!q) return;
  // path active: marca caminhos até nós que matcham
  gNodes.selectAll("g.node").each(function(d) {
    const hit = matches(d.data, q);
    if (hit) d3.select(this).classed("match", true);
  });
}
function matches(data, q) {
  return (data.title && data.title.toLowerCase().includes(q))
      || (data.name && data.name.toLowerCase().includes(q))
      || (data.id && data.id.toLowerCase().includes(q));
}

function expandPathTo(predicate) {
  // expande pais necessários para revelar nós que passam o predicate
  function walk(node) {
    let any = false;
    if (predicate(node.data)) any = true;
    const kids = node.children || node._children || [];
    let childMatch = false;
    kids.forEach(c => { if (walk(c)) childMatch = true; });
    if (childMatch) {
      if (node._children && !node.children) {
        node.children = node._children; node._children = null;
      }
      return true;
    }
    return any || childMatch;
  }
  walk(rootHier);
}

function focusFirstMatch() {
  const matches = rootHier.descendants().filter(d => matchesNodeQuery(d, searchQuery));
  if (!matches.length) return;
  const target = matches[0];
  // centraliza
  const svgEl = svg.node();
  const w = svgEl.clientWidth, h = svgEl.clientHeight;
  const tx = w/2 - target.x;
  const ty = h/3 - target.y;
  svg.transition().duration(450).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(1)
  );
}
function matchesNodeQuery(d, q) {
  if (!q) return false;
  q = q.trim().toLowerCase();
  return matches(d.data, q);
}

function updateCounters() {
  const total = TOTAL_NODES;
  const visible = rootHier.descendants().length;
  document.getElementById("total-count").textContent = total;
  document.getElementById("visible-count").textContent = visible;
}

// Pills
document.getElementById("filter-pills").addEventListener("click", (e) => {
  const btn = e.target.closest(".pill"); if (!btn) return;
  const area = btn.dataset.area;
  document.querySelectorAll("#filter-pills .pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = area;
  applyFilter();
});
// inicial: "Todos" ativo
document.querySelector('#filter-pills .pill[data-area="all"]').classList.add("active");

// Busca
const searchInput = document.getElementById("search");
searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  if (searchQuery.trim()) {
    expandPathTo(d => matches(d, searchQuery.trim().toLowerCase()));
    update(rootHier);
    focusFirstMatch();
  } else {
    applySearch();
  }
});
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.target.value=""; searchQuery=""; applySearch(); }
});

// Reset
document.getElementById("btn-reset").addEventListener("click", () => {
  rebuildHierarchy();
  searchInput.value = ""; searchQuery="";
  activeFilter = "all";
  document.querySelectorAll("#filter-pills .pill").forEach(p => p.classList.remove("active"));
  document.querySelector('#filter-pills .pill[data-area="all"]').classList.add("active");
  update(rootHier);
  fitToView(450);
  toast("Visão restaurada");
});

// Expandir nível: alterna entre revelar mais um nível
document.getElementById("btn-expand").addEventListener("click", () => {
  let maxOpen = 1;
  rootHier.descendants().forEach(d => {
    if (d.children && d.depth > maxOpen) maxOpen = d.depth;
  });
  // expande TODOS os nós no próximo nível
  rootHier.descendants().forEach(d => {
    if (d.depth === maxOpen && d._children) {
      d.children = d._children; d._children = null;
    }
  });
  update(rootHier);
  toast(`Nível ${maxOpen+1} expandido`);
});

// Tema
const themeBtn = document.getElementById("btn-theme");
const STORAGE_KEY = "kolden-org-theme";
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(STORAGE_KEY, t); } catch(e) {}
  themeBtn.textContent = (t === "dark") ? "☀" : "◐";
  themeBtn.title = (t === "dark") ? "Mudar para claro" : "Mudar para escuro";
}
const stored = (() => { try { return localStorage.getItem(STORAGE_KEY); } catch(e) { return null; } })();
setTheme(stored === "dark" ? "dark" : "light");
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  setTheme(cur === "dark" ? "light" : "dark");
});

/* =========================================================================
   EXPORT PNG
   ========================================================================= */
document.getElementById("btn-export").addEventListener("click", async () => {
  toast("Gerando PNG…");
  try {
    const svgEl = svg.node();
    const bbox = gRoot.node().getBBox();
    const pad = 60;
    const width  = Math.ceil(bbox.width + pad*2);
    const height = Math.ceil(bbox.height + pad*2);

    // clone SVG e ajusta
    const clone = svgEl.cloneNode(true);
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    clone.setAttribute("width", width);
    clone.setAttribute("height", height);
    clone.setAttribute("viewBox", `${bbox.x - pad} ${bbox.y - pad} ${width} ${height}`);

    // injeta CSS computed para que cores das rects e textos sigam
    const css = `
      .link { fill:none; stroke:#c9ccd6; stroke-width:1.4; }
      .node text.title { font: 700 13px Inter, system-ui, sans-serif; fill:#fff; }
      .node text.subtitle { font: 500 10.5px Inter, system-ui, sans-serif; fill: rgba(255,255,255,.85); }
      .node .indicator { font: 700 10px Inter, system-ui, sans-serif; fill: rgba(255,255,255,.9); }
      rect.bg { stroke: #fff; stroke-width: 1.2; }
    `;
    const style = document.createElementNS("http://www.w3.org/2000/svg","style");
    style.textContent = css;
    clone.insertBefore(style, clone.firstChild);

    // remove transform raiz para usar viewBox
    const vp = clone.querySelector("g.viewport");
    if (vp) vp.removeAttribute("transform");

    const xml = new XMLSerializer().serializeToString(clone);
    const svg64 = btoa(unescape(encodeURIComponent(xml)));
    const url = "data:image/svg+xml;base64," + svg64;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const scale = 2; // alta resolução
      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      // background conforme tema
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      ctx.fillStyle = dark ? "#0e1018" : "#f6f7fb";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "organograma-kolden.png";
        a.click();
        URL.revokeObjectURL(a.href);
        toast("PNG exportado");
      }, "image/png");
    };
    img.onerror = () => toast("Erro ao gerar PNG");
    img.src = url;
  } catch (err) {
    console.error(err);
    toast("Erro ao gerar PNG");
  }
});

/* =========================================================================
   FIT-TO-VIEW INICIAL
   ========================================================================= */
function fitToView(duration = 0) {
  const svgEl = svg.node();
  const w = Math.max(svgEl.clientWidth || 0, 800);
  const h = Math.max(svgEl.clientHeight || 0, 500);
  const bbox = gRoot.node().getBBox();
  if (!bbox || bbox.width < 20) {
    const t = d3.zoomIdentity.translate(w / 2, 80).scale(0.85);
    svg.call(zoom.transform, t);
    return;
  }
  const rawScale = Math.min((w - 80) / bbox.width, (h - 100) / bbox.height, 0.95);
  const scale = Math.max(0.32, rawScale);
  const tx = (w - bbox.width * scale) / 2 - bbox.x * scale;
  const ty = 60 - bbox.y * scale;
  const t = d3.zoomIdentity.translate(tx, ty).scale(scale);
  if (duration) {
    svg.transition().duration(duration).call(zoom.transform, t);
  } else {
    svg.call(zoom.transform, t);
  }
}

/* =========================================================================
   TOAST
   ========================================================================= */
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* =========================================================================
   BOOT
   ========================================================================= */
update(rootHier);
// aguarda transições D3 (300ms) antes de calcular bbox real
setTimeout(() => fitToView(0), 380);

// reposiciona ao redimensionar
window.addEventListener("resize", () => fitToView(250));
</script>
