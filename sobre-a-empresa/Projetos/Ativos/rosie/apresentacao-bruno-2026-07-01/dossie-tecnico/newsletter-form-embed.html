<!--
================================================================
FORMULÁRIO NEWSLETTER ROSIE — embed pra tema Nuvemshop
================================================================
Fonte de verdade da identidade: /brandbook/03-identidade-visual/*
- Cores: Rose #E6D2DC (primária), preto quente #14100C, branco #FFFFFF
- Fontes: Marcellus (títulos) + DM Sans (corpo), via Google Fonts
- Integração: RD Station Conversions API v1.3 (Public Token, seguro em front)

INSTRUÇÕES DE USO
1. Pegar Public Token do RD Station:
   RD Station → Configurações (engrenagem) → Integrações → API → Public Token
   (é diferente de OAuth; é chave pública específica pra conversões, não expõe conta)
2. Substituir COLE_AQUI_PUBLIC_TOKEN abaixo pela token real.
3. Copiar tudo abaixo (do <link> ao </script>) e colar no arquivo do tema Nuvemshop
   onde estava o formulário nativo de newsletter (geralmente footer.tpl).
4. Salvar tema e publicar.
5. Testar em janela anônima do navegador — preencher, confirmar que lead cai no RD
   com tag origem-newsletter e dispara Fluxo 01 Boas-vindas.
================================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  .rosie-nl {
    background: #E6D2DC;
    padding: 64px 24px;
    font-family: 'DM Sans', 'Arial', sans-serif;
    color: #14100C;
    box-sizing: border-box;
  }
  .rosie-nl *,
  .rosie-nl *::before,
  .rosie-nl *::after {
    box-sizing: border-box;
  }
  .rosie-nl__card {
    max-width: 520px;
    margin: 0 auto;
    background: #FFFFFF;
    padding: 48px 40px;
    text-align: center;
  }
  .rosie-nl__title {
    font-family: 'Marcellus', 'Georgia', serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1.15;
    color: #14100C;
    margin: 0 0 16px;
    letter-spacing: 0.5px;
  }
  .rosie-nl__subtitle {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.5;
    color: #14100C;
    opacity: 0.75;
    margin: 0 0 32px;
  }
  .rosie-nl__form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .rosie-nl__input {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: #14100C;
    background: #FFFFFF;
    border: 1px solid #14100C;
    border-radius: 0;
    padding: 14px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .rosie-nl__input::placeholder {
    color: #BDBAB5;
    font-family: 'DM Sans', sans-serif;
  }
  .rosie-nl__input:focus {
    border-color: #E6D2DC;
    border-width: 2px;
    padding: 13px 15px;
  }
  .rosie-nl__button {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #FFFFFF;
    background: #14100C;
    border: 1px solid #14100C;
    border-radius: 0;
    padding: 16px 24px;
    width: 100%;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .rosie-nl__button:hover,
  .rosie-nl__button:focus {
    background: #E6D2DC;
    color: #14100C;
  }
  .rosie-nl__button:disabled {
    background: #BDBAB5;
    border-color: #BDBAB5;
    cursor: not-allowed;
  }
  .rosie-nl__lgpd {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1.5;
    color: #14100C;
    opacity: 0.6;
    margin: 20px 0 0;
  }
  .rosie-nl__lgpd a {
    color: #14100C;
    text-decoration: underline;
  }
  .rosie-nl__lgpd a:hover {
    color: #E6D2DC;
  }
  .rosie-nl__success,
  .rosie-nl__error {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #14100C;
    padding: 24px 0;
    margin: 0;
  }
  .rosie-nl__error {
    color: #14100C;
    background: #F8E3E8;
    padding: 16px;
    margin-top: 12px;
    font-size: 13px;
  }
  @media (max-width: 640px) {
    .rosie-nl {
      padding: 48px 16px;
    }
    .rosie-nl__card {
      padding: 36px 24px;
    }
    .rosie-nl__title {
      font-size: 28px;
    }
  }
</style>

<section class="rosie-nl" aria-labelledby="rosie-nl-title">
  <div class="rosie-nl__card">
    <h2 class="rosie-nl__title" id="rosie-nl-title">Assine minha newsletter</h2>
    <p class="rosie-nl__subtitle">receba primeiro os drops e uma carta minha por semana</p>

    <form class="rosie-nl__form" id="rosieNewsletterForm" novalidate>
      <input
        class="rosie-nl__input"
        type="text"
        name="nome"
        placeholder="seu primeiro nome"
        autocomplete="given-name"
        required
      >
      <input
        class="rosie-nl__input"
        type="email"
        name="email"
        placeholder="seu melhor e-mail"
        autocomplete="email"
        required
      >
      <button class="rosie-nl__button" type="submit">quero entrar</button>
      <div class="rosie-nl__error" hidden></div>
      <p class="rosie-nl__lgpd">
        ao assinar, você aceita nossa
        <a href="/politica-de-privacidade" target="_blank" rel="noopener">política de privacidade</a>
      </p>
    </form>

    <p class="rosie-nl__success" hidden>boa. em instantes você recebe um e-mail meu.</p>
  </div>
</section>

<script>
  (function () {
    var RD_PUBLIC_TOKEN = 'be9b6fcefac735a0cded3c753439eecd';
    var IDENTIFICADOR = 'newsletter-rosie';
    var TAG = 'origem-newsletter';

    var form = document.getElementById('rosieNewsletterForm');
    if (!form) return;

    var successEl = form.parentNode.querySelector('.rosie-nl__success');
    var errorEl = form.querySelector('.rosie-nl__error');
    var btn = form.querySelector('.rosie-nl__button');
    var originalBtnText = btn.textContent;

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = originalBtnText;
    }

    function showSuccess() {
      form.hidden = true;
      successEl.hidden = false;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'enviando…';

      var nome = form.nome.value.trim();
      var email = form.email.value.trim();

      if (!nome || !email) {
        showError('preenche nome e e-mail, por favor.');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('esse e-mail parece incompleto. confere?');
        return;
      }

      var payload = {
        token_rdstation: RD_PUBLIC_TOKEN,
        identificador: IDENTIFICADOR,
        email: email,
        nome: nome,
        tags: TAG
      };

      fetch('https://www.rdstation.com.br/api/1.3/conversions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (res) {
          if (!res.ok) throw new Error('resposta ' + res.status);
          return res.json().catch(function () { return {}; });
        })
        .then(function () {
          showSuccess();
        })
        .catch(function (err) {
          showError('ops, algo travou. tenta de novo em instantes?');
          if (window.console) console.error('[Rosie newsletter] RD conversion error:', err);
        });
    });
  })();
</script>
