# Arquitetura de Conta — Google Ads Vilela Construction
# Phase 0 do workflow *campaign-launch (Peitho)
# Autor: traffic-chief + kasim-aslam (encarnados em subagente Claude)
# Data: 2026-07-09
# Contrato: Olimpo/contratos/missoes/m-20260709-google-ads-vilela.yaml
# ROADMAP-pai: sobre-a-empresa/Projetos/Ativos/vilela-construction/google-ads/ROADMAP.md §3
#
# NOTA DE GEOGRAFIA (CRÍTICA):
#   O ROADMAP e o Contrato ainda referenciam Kennesaw/GA + Greater Atlanta. Esta arquitetura
#   segue a fonte-de-verdade atualizada (dossie.md, rodada 3 de 09/07 com Ronan): operação
#   real = Massachusetts + New Hampshire. A landing pública (vilela-bright-space) menciona
#   Georgia como resíduo do template Lovable e está sendo corrigida pelo Ronan (ver
#   dossie-site-vilela-construction.md). O ROADMAP §3.3 precisa ser retificado em rodada
#   seguinte para MA + NH.
#
# NAMING SCHEMA (skill arquitetura-enterprise-ppc, adaptado para $300/mês):
#   {Mercado}_{Tier}_{Linha}_{Publico}_{Versao}
#   Mercado = US (país); Tier = Brand/Nonbrand/Remkt; Linha = temática; Publico = TOFU/BOFU;
#   Versao = v1..vN
#   Ex.: US_Nonbrand_Kitchen_TOFU_v1

---

account:
  id: "TBD_[B4]"   # Bloqueio B4 do ROADMAP §6 — Bernardo documenta em D+1
  currency: "USD"
  timezone: "America/New_York"
  mcc_parent: "kolden-mcc"   # [VALIDADO — modelo de agência Kolden]
  auto_tagging: true          # [OBRIGATÓRIO — sem auto-tagging, gclid não chega no form]
  enhanced_conversions:
    status: "ativar_em_D+7"   # Onda 1 item 1.6
    metodo: "google_tag"      # via GTM-NG8LP66S
    campos: ["email", "phone_number"]

# Total budget diário-alvo: USD 10/dia (=$300/mês) [VALIDADO — Contrato §D1]
budget:
  mensal_total_usd: 300
  diario_total_usd: 10
  split_por_campanha:
    US_Brand_All_v1:            { pct: 10, diario: 1.0, mensal: 30 }
    US_Nonbrand_Kitchen_TOFU_v1: { pct: 50, diario: 5.0, mensal: 150 }
    US_Nonbrand_Bathroom_TOFU_v1: { pct: 30, diario: 3.0, mensal: 90 }
    US_Remkt_All_LP-view_v1:     { pct: 10, diario: 1.0, mensal: 30 }
  observacao: |
    Split calibrado para USD 300/mês seguindo ROADMAP §3.2. Kitchen tem 50%
    porque é o maior ticket ($30k–$65k, ver dossie.md §B2.5). Bathroom 30%
    porque segundo maior ($12k–$40k). Brand 10% para proteger nome próprio
    a CPC baixo. Remarketing 10% mínimo viável para Display — se em D+7
    audience < 100 pessoas, pausar e realocar 100% para Kitchen.

# Geolocalização — MA + NH conforme dossie.md §A1 (não Georgia como o ROADMAP diz)
geo_targeting:
  include_primario:
    - name: "Greater Boston core"
      unidade: "cidade+raio"
      raio_mi: 25
      locais:
        - "Boston, MA"
        - "Cambridge, MA"
        - "Somerville, MA"
      bid_adjustment_pct: +20   # concentração de idosos + high-ticket homeowners
    - name: "Eastern Massachusetts"
      unidade: "cidade+raio"
      raio_mi: 20
      locais:
        - "Newton, MA"
        - "Brookline, MA"        # incluir (é core MA, não Quincy-área)
        - "Framingham, MA"
        - "Waltham, MA"
        - "Lexington, MA"        # renda alta, homeowners 55+
        - "Wellesley, MA"        # ticket premium
      bid_adjustment_pct: +10
  include_secundario:
    - name: "Southern New Hampshire"
      unidade: "cidade+raio"
      raio_mi: 15
      locais:
        - "Nashua, NH"
        - "Manchester, NH"
        - "Salem, NH"
        - "Portsmouth, NH"
      bid_adjustment_pct: -20   # ticket menor, ciclo de decisão mais longo
  exclude_explicito:
    - "Quincy, MA"     # confirmado exclusão no ROADMAP §3.3 (permanece)
    - "Everett, MA"    # ROADMAP §3.3 dizia "include secundário MA" mas era erro herdado do briefing Atlanta — remover
    - "Chelsea, MA"    # densidade de renters, não homeowners
  device_adjustments:
    mobile: +15         # público sênior busca no celular durante o dia
    desktop: 0
    tablet: 0
  daypart_adjustments:
    seg_a_sex_08h_18h: +10    # horário comercial (idosos aposentados navegam)
    seg_a_sex_18h_22h: +5     # decisor pós-jantar
    sab_09h_16h: +15          # planejamento de reforma no fim de semana
    dom_09h_16h: +10
    madrugada_00h_06h: -50    # exclui cliques cegos
  sazonalidade:
    janela_ativa: "maio-novembro"
    politica_dezembro_abril: "pausar campanhas Non-brand; manter só Brand com budget reduzido a $15/mês"

# Conversion Actions — spec do valor por lead
conversion_actions:
  primary:
    name: "Vilela_Lead_Form"
    categoria: "Submit lead form"
    contagem: "One"                # 1 conversão por click (evita inflar leads duplicados)
    janela_post_click_dias: 90     # high-consideration; 30d default corta demais
    janela_post_view_dias: 1
    valor_default_usd: 4800        # [BENCHMARK — ver ROADMAP §3.9 e diagnóstico §CP4]
    valor_dinamico_via_hidden_field: "service_selected"
    valores_por_servico:
      kitchen_premium: 5200        # ticket bruto $45k×40%×20% + prêmio Luxury
      kitchen_standard: 4800
      bathroom_master: 3200        # $40k×40%×20%
      bathroom_full: 2400
      basement_full: 4800          # basement finishing turnkey (ver dossie §C2)
      flooring: 960                # $12k×40%×20%
      painting: 400
      unknown: 4800                # default se hidden field vazio
    enhanced_conversions: true
    include_in_conversions_column: true
    inclusao_em_bidding: "primaria_ate_D+30_apenas"   # até OCI Camada 2 estabilizar
  secondary_planejada:
    name: "Vilela_Phone_Call"
    categoria: "Phone call lead"
    status_atual: "aguardando_telefone_real (bloqueio B2)"
    ativar_em: "D+3 se B2 resolvido"
    duracao_minima_seg: 60         # filtra ligações que só ouvem menu
  observacao_valor: |
    Fórmula: valor = ticket_medio × margem_bruta × taxa_fechamento
    Assumindo $60k × 40% × 20% = $4.800. Recalibrar em D+30 quando Thiago
    responder B1 (taxa histórica de fechamento + margem bruta). Kasim
    Aslam adverte: valor de conversão errado é o erro mais comum em
    Smart Bidding — melhor entrar CONSERVADOR ($4.800) do que agressivo
    ($10k+) e queimar orçamento em cliques inflados pelo algoritmo.

# ══════════════════════════════════════════════════════════════════════════════
# CAMPANHAS
# ══════════════════════════════════════════════════════════════════════════════

campanhas:

  # ─────────────────────────────────────────────────────────────────────────
  - id: "US_Brand_All_v1"
    type: "Search"
    status_inicial: "paused"     # ativar só após tag AW- disparando em test-lead (Gate D+7)
    budget_daily_usd: 1.0
    bidding:
      fase_1_semanas_1_2: "Manual CPC"
      fase_1_max_cpc_usd: 2.5     # brand tem QS alto, CPC natural baixo
      fase_2_semanas_3_4: "Maximize Conversions"
      fase_3_mes_2_plus: "tCPA"
      fase_3_target_cpa_usd: 35   # brand converte muito melhor que non-brand
    locations_ref: "geo_targeting"
    languages: ["English"]
    networks:
      search_partners: false      # Brand: só Google.com, evita canibalizar
      display_expansion: false
    ad_rotation: "optimize"       # Google escolhe melhor RSA
    ad_groups:
      - id: "AG_Brand_Vilela"
        max_cpc_usd: 2.5
        keywords:
          - { text: "vilela construction", match: "exact", initial_bid_usd: 1.5 }
          - { text: "vilela construction inc", match: "exact", initial_bid_usd: 1.5 }
          - { text: "vilela construction ma", match: "exact", initial_bid_usd: 1.5 }
          - { text: "vilela construction massachusetts", match: "exact", initial_bid_usd: 1.5 }
          - { text: "vilela construction boston", match: "exact", initial_bid_usd: 1.5 }
          - { text: "vilela remodeling", match: "exact", initial_bid_usd: 1.5 }
          - { text: "vilela contractor", match: "exact", initial_bid_usd: 1.5 }
          - { text: "thiago araujo construction", match: "exact", initial_bid_usd: 1.5 }
          - { text: "thiago vilela", match: "phrase", initial_bid_usd: 1.2 }
          - { text: "vilela construction reviews", match: "phrase", initial_bid_usd: 2.0 }
          - { text: "vilela construction near me", match: "phrase", initial_bid_usd: 2.0 }
          - { text: "vilela construction quote", match: "phrase", initial_bid_usd: 2.5 }
        rsa_ref: "copy/rsa-brand.md"    # Caliope escreve na Onda 3 Phase 1
        pin_strategy:
          h1_pinned_position_1: "Vilela Construction | Official"
          h2_pinned_position_2: "Free Estimate — Kitchen, Bathroom, Basement"
          h3_pinned_position_3: null   # rotativa
    extensions:
      sitelinks:
        - { text: "Free Estimate", url_suffix: "/estimate" }
        - { text: "Kitchen Remodel", url_suffix: "#kitchen" }
        - { text: "Bathroom Renovation", url_suffix: "#bathroom" }
        - { text: "Portfolio", url_suffix: "#portfolio" }
      callouts:
        - "Licensed & Insured"
        - "Free In-Home Consultation"
        - "Serving MA & Southern NH"
        - "25+ Years Experience"
        - "Unmatched Cleanliness"
        - "Transparent Communication"
      structured_snippets:
        header: "Services"
        values: ["Kitchen", "Bathroom", "Basement", "Flooring", "Painting"]
      call_extension: "TBD_[B2]"       # bloqueia até Thiago fornecer
    negativas_de_campanha:
      - "-jobs"
      - "-hiring"
      - "-career"
      - "-complaint"
      - "-scam"
      - "-lawsuit"
      - "-reviews reddit"

