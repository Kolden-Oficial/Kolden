# PLANO DE CORTE E ESCALA
# ══════════════════════════════════════════════════════════════════════════════
regras_de_otimizacao:
  corte_semanal:
    - condicao: "keyword com >=20 clicks e 0 conversoes em 14d"
      acao: "pausar keyword"
    - condicao: "ad_group com CPA > 2x target_cpa em 14d"
      acao: "reduzir budget 50%; revisar copy + keywords"
    - condicao: "SQR: query com CTR <0.5% ou CVR <1%"
      acao: "adicionar como negativa (skill search-query-analise)"
  escala_condicional:
    D+30:
      - condicao: "CPA < $75 E leads >= 10/mes"
        acao: "escalar budget +50% (150 -> 225 na Kitchen)"
        requer_aprovacao: true
      - condicao: "CPA < $50 E leads >= 15/mes"
        acao: "escalar budget +100% (150 -> 300 na Kitchen)"
        requer_aprovacao: true
      - condicao: "CPA > $150 em qualquer campanha"
        acao: "cortar budget 30% + refazer keyword research + auditar RSA"
        requer_aprovacao: false
    D+45:
      - condicao: "CPA < $75 sustentado + audience Remkt >= 300"
        acao: "considerar PMax como campanha 5"
        requer_aprovacao: true
  gates_hard:
    - "Se gasto real dia_1 > 2x budget_daily -> PAUSAR TUDO + alerta Ronan (Google Ads pode overspend em ate 200% do budget diario)"
    - "Se CTR agregado < 1% em D+7 -> revisao RSA + pin strategy antes de continuar"
    - "Se Quality Score agregado < 5 em D+14 -> revisao LP + keyword-copy alignment"

