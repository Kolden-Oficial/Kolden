<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 940" font-family="Lato, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .eyebrow { font-family: 'Saira Semi Condensed', 'Rajdhani', 'Eurostile', sans-serif; font-weight: 600; letter-spacing: 0.08em; }
      .h1 { font-family: Lato, sans-serif; font-weight: 800; }
      .h2 { font-family: Lato, sans-serif; font-weight: 700; }
      .body { font-family: Lato, sans-serif; font-weight: 400; }
      .tag { font-family: 'Saira Semi Condensed', 'Rajdhani', sans-serif; font-weight: 500; }
    </style>
    <marker id="arr-scarlet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3D22"/>
    </marker>
    <marker id="arr-off" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8E6F1"/>
    </marker>
  </defs>

  <rect width="1360" height="940" fill="#110E0F"/>

  <!-- Header -->
  <text x="100" y="45" class="eyebrow" fill="#6E6668" font-size="14">AS 5 CAMADAS DA KOLDEN</text>
  <text x="100" y="82" class="h1" fill="#E8E6F1" font-size="28">Como um input do Ronan vira entrega</text>

  <!-- Caos lateral -->
  <rect x="40" y="220" width="140" height="460" rx="12" fill="#241F20" stroke="#FF3D22" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="248" class="eyebrow" fill="#FF3D22" font-size="12">FÁBRICA</text>
  <text x="60" y="286" class="h1" fill="#E8E6F1" font-size="22">Caos</text>
  <text x="60" y="322" class="body" fill="#E8E6F1" font-size="12">Cria, audita e</text>
  <text x="60" y="340" class="body" fill="#E8E6F1" font-size="12">governa todos</text>
  <text x="60" y="358" class="body" fill="#E8E6F1" font-size="12">os agentes</text>
  <text x="60" y="380" class="body" fill="#6E6668" font-size="11">(9 especialistas)</text>
  <text x="60" y="628" class="tag" fill="#6E6668" font-size="10">↓ alimenta todas</text>
  <text x="60" y="644" class="tag" fill="#6E6668" font-size="10">as camadas</text>

  <!-- Camada 1: Ronan (scarlet fill) -->
  <rect x="220" y="140" width="900" height="80" rx="10" fill="#FF3D22" stroke="#FF3D22" stroke-width="2"/>
  <text x="240" y="167" class="eyebrow" fill="#110E0F" font-size="12">1 · HUMANO</text>
  <text x="240" y="198" class="h1" fill="#110E0F" font-size="24">Ronan</text>
  <text x="420" y="195" class="body" fill="#110E0F" font-size="15">Dá o input cru · aprova nos portões (verde/amarelo/vermelho)</text>

  <!-- Camada 2: Hermes -->
  <rect x="220" y="260" width="900" height="100" rx="10" fill="#1A1617" stroke="#FF3D22" stroke-width="2"/>
  <text x="240" y="287" class="eyebrow" fill="#FF3D22" font-size="12">2 · TRADUÇÃO DE INTENÇÃO</text>
  <text x="240" y="318" class="h1" fill="#E8E6F1" font-size="24">Hermes</text>
  <text x="420" y="304" class="body" fill="#E8E6F1" font-size="14">DoR (5 campos) + matriz de risco (verde/amarelo/vermelho)</text>
  <text x="420" y="326" class="body" fill="#E8E6F1" font-size="14">+ lacre sha256 → Contrato de Missão (Olimpo/contratos/)</text>
  <text x="420" y="348" class="tag" fill="#6E6668" font-size="11">scripts/abre-missao.sh · Hermes/camada-2-contrato.md</text>

  <!-- Camada 3: Zeus -->
  <rect x="220" y="400" width="900" height="80" rx="10" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
  <text x="240" y="427" class="eyebrow" fill="#6E6668" font-size="12">3 · ORQUESTRAÇÃO</text>
  <text x="240" y="458" class="h1" fill="#E8E6F1" font-size="24">Zeus  /  Olimpo</text>
  <text x="540" y="455" class="body" fill="#E8E6F1" font-size="15">Decompõe a missão · roteia pelos routing_triggers</text>

  <!-- Camada 4: Executivos -->
  <rect x="220" y="520" width="900" height="120" rx="10" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
  <text x="240" y="547" class="eyebrow" fill="#6E6668" font-size="12">4 · ESPECIFICAÇÃO EXECUTIVA</text>
  <text x="240" y="578" class="h2" fill="#E8E6F1" font-size="22">Olimpo — 8 executivos</text>
  <text x="240" y="606" class="body" fill="#E8E6F1" font-size="14">Zeus (CEO) · Poseidon (COO) · Apolo (CMO) · Hefesto (CTO)</text>
  <text x="240" y="628" class="body" fill="#E8E6F1" font-size="14">Hades (CIO) · Atena (CAIO) · Plutos (CFO) · Afrodite (CRO)</text>

  <!-- Camada 5: Squads -->
  <rect x="220" y="680" width="900" height="160" rx="10" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
  <text x="240" y="707" class="eyebrow" fill="#6E6668" font-size="12">5 · EXECUÇÃO OPERACIONAL</text>
  <text x="240" y="738" class="h2" fill="#E8E6F1" font-size="22">Squads — 22 squads · ~240 agentes</text>
  <text x="240" y="766" class="body" fill="#E8E6F1" font-size="13">Marketing &amp; Criação: Pheme · Peitho · Caliope · Aglaia · Harmonia · Orfeu · Ariadne</text>
  <text x="240" y="788" class="body" fill="#E8E6F1" font-size="13">Estratégia &amp; Negócios: Aletheia · Argos · Liceu · Themis · Metis · Pluto · Dionisio</text>
  <text x="240" y="810" class="body" fill="#E8E6F1" font-size="13">Engenharia &amp; Segurança: Prometeu · Dedalo · Egide</text>
  <text x="240" y="832" class="body" fill="#FF3D22" font-size="13">Negócio (sementes, borda tracejada): Nomos · Pactolo · Emporos · Hestia · Ananke · Cairos</text>

  <!-- Dike (lateral direita) -->
  <rect x="1160" y="420" width="140" height="140" rx="10" fill="#241F20" stroke="#E8E6F1" stroke-width="2"/>
  <text x="1175" y="447" class="eyebrow" fill="#6E6668" font-size="11">VERIFICAÇÃO</text>
  <text x="1175" y="478" class="h1" fill="#E8E6F1" font-size="22">Dike</text>
  <text x="1175" y="510" class="body" fill="#E8E6F1" font-size="11">Reconcilia entrega</text>
  <text x="1175" y="524" class="body" fill="#E8E6F1" font-size="11">vs. lacre sha256</text>
  <text x="1175" y="546" class="tag" fill="#FF3D22" font-size="11">TPND = 0</text>

  <!-- Setas descida (scarlet) -->
  <line x1="400" y1="220" x2="400" y2="256" stroke="#FF3D22" stroke-width="3" marker-end="url(#arr-scarlet)"/>
  <line x1="400" y1="360" x2="400" y2="396" stroke="#FF3D22" stroke-width="3" marker-end="url(#arr-scarlet)"/>
  <line x1="400" y1="480" x2="400" y2="516" stroke="#FF3D22" stroke-width="3" marker-end="url(#arr-scarlet)"/>
  <line x1="400" y1="640" x2="400" y2="676" stroke="#FF3D22" stroke-width="3" marker-end="url(#arr-scarlet)"/>
  <text x="330" y="240" class="tag" fill="#FF3D22" font-size="11">intent ↓</text>

  <!-- Setas subida (off-white, dashed) via Dike -->
  <path d="M 950 680 Q 1050 620 1160 560" fill="none" stroke="#E8E6F1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-off)"/>
  <path d="M 1160 420 Q 1050 380 950 296" fill="none" stroke="#E8E6F1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-off)"/>
  <line x1="950" y1="260" x2="950" y2="224" stroke="#E8E6F1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-off)"/>
  <text x="990" y="612" class="tag" fill="#E8E6F1" font-size="11">↑ entrega verificada</text>

  <!-- Rodapé -->
  <text x="40" y="915" class="tag" fill="#6E6668" font-size="11">Fonte: AGENTS.md + Hermes/camada-2-contrato.md   ·   Diagrama 1/5 — Kolden Arquitetura Visual   ·   2026-06-30</text>
</svg>
