    <text x="250" y="716" text-anchor="middle" class="tag" fill="#6E6668" font-size="11">OFF por padrão</text>
    <text x="250" y="734" text-anchor="middle" class="body" fill="#6E6668" font-size="10">API_SERVER_KEY + HOST para ligar</text>
  </g>

