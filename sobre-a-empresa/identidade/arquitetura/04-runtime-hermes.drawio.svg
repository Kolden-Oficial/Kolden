  <rect width="1400" height="980" fill="#110E0F"/>

  <text x="60" y="42" class="eyebrow" fill="#6E6668" font-size="14">RUNTIME · AGENTES DA KOLDEN</text>
  <text x="60" y="82" class="h1" fill="#E8E6F1" font-size="26">Como os agentes chegam ao Ronan / clientes</text>
  <text x="60" y="106" class="body" fill="#6E6668" font-size="12">Hermes (Nous Research, vendorizado) — camada 2 do sistema hierárquico + gateway multi-canal</text>

  <rect x="60" y="140" width="1280" height="620" rx="10" fill="none" stroke="#6E6668" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="168" class="eyebrow" fill="#6E6668" font-size="12">HOST · WINDOWS (RONAN) · Hermes_Gateway.cmd → infisical run</text>

  <g id="hermes-core">
    <rect x="540" y="260" width="280" height="200" rx="10" fill="#241F20" stroke="#FF3D22" stroke-width="3"/>
    <text x="680" y="292" text-anchor="middle" class="h1" fill="#E8E6F1" font-size="18">Hermes Gateway</text>
    <text x="680" y="313" text-anchor="middle" class="mono" fill="#6E6668" font-size="11">hermes-agent (Nous Research)</text>
    <text x="680" y="331" text-anchor="middle" class="mono" fill="#6E6668" font-size="10">image hermes-agent · s6-overlay</text>
    <line x1="560" y1="348" x2="800" y2="348" stroke="#332D2E" stroke-width="1"/>
    <text x="680" y="370" text-anchor="middle" class="tag" fill="#FF3D22" font-size="12">Camada 2 · Tradução de Intenção</text>
    <text x="680" y="392" text-anchor="middle" class="body" fill="#E8E6F1" font-size="12">DoR · matriz de risco · lacre sha256</text>
    <text x="680" y="412" text-anchor="middle" class="body" fill="#E8E6F1" font-size="12">+ ordem-de-máquina + assinatura</text>
    <text x="680" y="440" text-anchor="middle" class="mono" fill="#6E6668" font-size="10">scripts/abre-missao.sh</text>
  </g>

  <g id="user-md">
    <rect x="560" y="500" width="240" height="100" rx="6" fill="#1A1617" stroke="#E8E6F1" stroke-width="2"/>
    <path d="M 780 500 L 800 520 L 800 600 L 560 600 L 560 500 Z" fill="none" stroke="#E8E6F1" stroke-width="2"/>
    <path d="M 780 500 L 780 520 L 800 520" fill="none" stroke="#E8E6F1" stroke-width="2"/>
    <text x="680" y="528" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="15">USER.md</text>
    <text x="680" y="548" text-anchor="middle" class="mono" fill="#6E6668" font-size="10">%LOCALAPPDATA%\hermes\memories\</text>
    <text x="680" y="570" text-anchor="middle" class="body" fill="#E8E6F1" font-size="11">Preferências, decisões,</text>
    <text x="680" y="587" text-anchor="middle" class="body" fill="#E8E6F1" font-size="11">rebaixamentos de cor</text>
  </g>

  <g id="openrouter">
    <rect x="140" y="260" width="220" height="100" rx="8" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
    <text x="250" y="288" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="16">OpenRouter</text>
    <text x="250" y="308" text-anchor="middle" class="body" fill="#6E6668" font-size="11">LLM provider</text>
    <text x="250" y="328" text-anchor="middle" class="tag" fill="#FF3D22" font-size="12">gemini-2.5-flash</text>
    <text x="250" y="348" text-anchor="middle" class="mono" fill="#6E6668" font-size="10">api.openrouter.ai</text>
  </g>

  <g id="infisical">
    <rect x="140" y="390" width="220" height="120" rx="8" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
    <text x="250" y="418" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="16">Infisical</text>
    <text x="250" y="438" text-anchor="middle" class="body" fill="#6E6668" font-size="11">secrets manager · env prod</text>
    <text x="250" y="456" text-anchor="middle" class="mono" fill="#6E6668" font-size="10">projeto 43d90b85-…</text>
    <text x="250" y="478" text-anchor="middle" class="tag" fill="#FF3D22" font-size="11">shim: ~/.claude/infisical-shim.cjs</text>
    <text x="250" y="496" text-anchor="middle" class="body" fill="#6E6668" font-size="10">(SAC bloqueia infisical.exe)</text>
  </g>

  <g id="dashboard">
