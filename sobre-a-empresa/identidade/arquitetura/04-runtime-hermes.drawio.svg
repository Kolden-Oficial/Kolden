       <text x="1055" y="322" text-anchor="middle" class="body" fill="#6E6668" font-size="10">via Baileys (não-oficial)</text></g>
    <g><rect x="1150" y="280" width="150" height="60" rx="6" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
