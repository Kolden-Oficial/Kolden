    <g><rect x="980" y="360" width="150" height="60" rx="6" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
       <text x="1055" y="384" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="14">Discord</text>
       <text x="1055" y="402" text-anchor="middle" class="body" fill="#6E6668" font-size="10">bot</text></g>
    <g><rect x="1150" y="360" width="150" height="60" rx="6" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
       <text x="1225" y="384" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="14">Slack</text>
       <text x="1225" y="402" text-anchor="middle" class="body" fill="#6E6668" font-size="10">bot + socket mode</text></g>
    <g><rect x="980" y="440" width="150" height="60" rx="6" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
       <text x="1055" y="464" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="14">Signal</text>
       <text x="1055" y="482" text-anchor="middle" class="body" fill="#6E6668" font-size="10">signal-cli</text></g>
    <g><rect x="1150" y="440" width="150" height="60" rx="6" fill="#1A1617" stroke="#332D2E" stroke-width="2"/>
       <text x="1225" y="464" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="14">Matrix</text>
       <text x="1225" y="482" text-anchor="middle" class="body" fill="#6E6668" font-size="10">homeserver / bridge</text></g>
    <g><rect x="980" y="520" width="150" height="60" rx="6" fill="#241F20" stroke="#6E6668" stroke-width="1" stroke-dasharray="6 4"/>
       <text x="1055" y="544" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="13">MS Teams</text>
       <text x="1055" y="562" text-anchor="middle" class="body" fill="#6E6668" font-size="10">opcional · comentado</text></g>
    <g><rect x="1150" y="520" width="150" height="60" rx="6" fill="#241F20" stroke="#6E6668" stroke-width="1" stroke-dasharray="6 4"/>
       <text x="1225" y="544" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="13">Google Chat</text>
       <text x="1225" y="562" text-anchor="middle" class="body" fill="#6E6668" font-size="10">Pub/Sub + SA JSON</text></g>

    <g id="olimpo-ref">
      <rect x="980" y="620" width="320" height="60" rx="6" fill="#1A1617" stroke="#E8E6F1" stroke-width="2"/>
      <text x="1140" y="644" text-anchor="middle" class="h2" fill="#E8E6F1" font-size="14">→ Olimpo / Zeus</text>
      <text x="1140" y="662" text-anchor="middle" class="mono" fill="#6E6668" font-size="10">invoca-squad.ps1 → routing_triggers</text>
    </g>
  </g>

  <g id="postiz">
