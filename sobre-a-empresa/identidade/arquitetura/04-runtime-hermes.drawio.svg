  <g id="legend">
    <rect x="60" y="780" width="800" height="150" rx="8" fill="#1A1617" stroke="#332D2E" stroke-width="1"/>
    <text x="76" y="804" class="h2" fill="#E8E6F1" font-size="13">LEGENDA</text>
    <line x1="76" y1="820" x2="120" y2="820" stroke="#FF3D22" stroke-width="2"/>
    <text x="130" y="824" class="body" fill="#E8E6F1" font-size="11">caminho crítico (secrets, LLM, WhatsApp/Ronan, Olimpo)</text>
    <line x1="76" y1="840" x2="120" y2="840" stroke="#E8E6F1" stroke-width="1"/>
    <text x="130" y="844" class="body" fill="#E8E6F1" font-size="11">canal secundário / controle / memória</text>
    <line x1="76" y1="860" x2="120" y2="860" stroke="#6E6668" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="130" y="864" class="body" fill="#E8E6F1" font-size="11">opcional (comentado no compose) ou pendente</text>
    <text x="76" y="898" class="body" fill="#E8E6F1" font-size="11" font-weight="700">Contrato de Missão sobe/desce</text>
    <text x="240" y="898" class="body" fill="#E8E6F1" font-size="11">entre Hermes (aqui) e Olimpo (diagrama 05).</text>
    <text x="76" y="916" class="body" fill="#E8E6F1" font-size="11">A Dike verifica a subida antes do Hermes devolver ao Ronan.</text>
  </g>

  <g id="tec">
    <rect x="880" y="780" width="460" height="150" rx="8" fill="#1A1617" stroke="#332D2E" stroke-width="1"/>
    <text x="896" y="804" class="h2" fill="#E8E6F1" font-size="13">DETALHES TÉCNICOS</text>
    <text x="896" y="826" class="body" fill="#E8E6F1" font-size="11">•  network_mode: host (compose)</text>
    <text x="896" y="846" class="body" fill="#E8E6F1" font-size="11">•  volume ~/.hermes:/opt/data (perfis, sessão, USER.md)</text>
    <text x="896" y="866" class="body" fill="#E8E6F1" font-size="11">•  s6-overlay como PID 1 (/init) — não pular o entrypoint</text>
    <text x="896" y="886" class="body" fill="#E8E6F1" font-size="11">•  HERMES_UID/GID remapeados para usuário host</text>
    <text x="896" y="906" class="body" fill="#E8E6F1" font-size="11">•  Auto-start via Hermes_Gateway.cmd (Task Scheduler + infisical run)</text>
  </g>

  <text x="60" y="965" class="tag" fill="#6E6668" font-size="11">Fonte: Hermes/docker-compose.yml + Hermes/camada-2-contrato.md · Diagrama 4/5 — Kolden Arquitetura Visual · 2026-06-30</text>
