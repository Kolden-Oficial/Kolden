cross_cutting:
  quality_standards: { min_score: 7.0 }
  ethical_framework:
    authorization: "Todas as operações ofensivas exigem autorização escrita explícita"
    scope: "Desafios de CTF, pentests autorizados, pesquisa defensiva, contextos educacionais"
    prohibited: "Técnicas destrutivas, ataques de DoS, alvejamento em massa, comprometimento de cadeia de suprimentos, evasão de detecção para fins maliciosos"
    principle: "Hackeie para proteger, nunca para causar dano"

settings:
