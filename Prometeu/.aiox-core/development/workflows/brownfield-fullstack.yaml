workflow:
  id: brownfield-fullstack
  name: Aprimoramento Brownfield Full-Stack
  description: >-
    Workflow de agentes para aprimorar aplicações full-stack existentes com novas funcionalidades,
    modernização ou mudanças significativas. Lida com a análise do sistema existente e a integração segura.
  type: brownfield
  version: "1.0"
  project_types:
    - feature-addition
    - refactoring
    - modernization
    - integration-enhancement

  metadata:
    elicit: true
    confirmation_required: true

  phases:
    - phase_1: Classificação e Roteamento do Aprimoramento
    - phase_2: Planejamento e Documentação
    - phase_3: Fragmentação de Documentos
    - phase_4: Ciclo de Desenvolvimento

  sequence:
    - phase: 1
      name: Classificação e Roteamento do Aprimoramento

    - id: analyst-classify-enhancement
      step: enhancement_classification
      agent: analyst
      action: classify enhancement scope
      duration_estimate: "10-15 min"
      elicit: true
      notes: |
        Determine a complexidade do aprimoramento para rotear ao caminho apropriado:
        - Story única (< 4 horas) → Use a task brownfield-create-story
        - Funcionalidade pequena (1-3 stories) → Use a task brownfield-create-epic
        - Aprimoramento maior (múltiplos epics) → Continue com o workflow completo

        Pergunte ao usuário: "Você pode descrever o escopo do aprimoramento? É uma pequena correção, uma adição de funcionalidade ou um aprimoramento maior que exige mudanças arquiteturais?"

    - id: routing-decision
      step: routing_decision
      meta: routing
      duration_estimate: "5 min"
      condition: based_on_classification
      routes:
        single_story:
          agent: pm
          uses: brownfield-create-story
          notes: "Criar story única para implementação imediata. Sair do workflow após a criação da story."
        small_feature:
          agent: pm
          uses: brownfield-create-epic
          notes: "Criar epic focado com 1-3 stories. Sair do workflow após a criação do epic."
        major_enhancement:
          continue: to_next_step
          notes: "Continuar com o workflow de planejamento abrangente abaixo."

    - phase: 2
      name: Planejamento e Documentação

    - id: analyst-check-documentation
      step: documentation_check
      agent: analyst
      action: check existing documentation
      duration_estimate: "10-20 min"
      condition: major_enhancement_path
      notes: |
        Verifique se existe documentação adequada do projeto:
        - Procure por docs de arquitetura existentes, specs de API, padrões de código
        - Avalie se a documentação está atual e abrangente
        - Se adequada: Pule document-project, prossiga para o PRD
        - Se inadequada: Rode document-project primeiro

    - id: architect-analyze-project
      step: project_analysis
      agent: architect
      action: analyze existing project and use task document-project
      creates: [brownfield-architecture.md]
      duration_estimate: "30-60 min"
      condition: documentation_inadequate
      notes: "Rode document-project para capturar o estado atual do sistema, a dívida técnica e as restrições. Passe os achados para a criação do PRD."

    - id: pm-create-prd
      agent: pm
      creates: prd.md
      uses: brownfield-prd-tmpl
      duration_estimate: "30-60 min"
      requires: existing_documentation_or_analysis
      notes: |
        Cria o PRD para o aprimoramento maior. Se document-project foi rodado, referencie sua saída para evitar reanálise.
        Se pulado, use a documentação existente do projeto.
        SALVAR SAÍDA: Copie o prd.md final para a pasta docs/ do seu projeto.

    - id: pm-architecture-decision
      step: architecture_decision
      agent: pm
      alternative_agent: architect
      action: determine if architecture document needed
      duration_estimate: "10-15 min"
      condition: after_prd_creation
      notes: |
        Revise o PRD para determinar se o planejamento arquitetural é necessário:
        - Novos padrões arquiteturais → Criar doc de arquitetura
        - Novas bibliotecas/frameworks → Criar doc de arquitetura
        - Mudanças de plataforma/infraestrutura → Criar doc de arquitetura
        - Seguindo padrões existentes → Pular para a criação da story

    - id: architect-create-architecture
      agent: architect
      creates: architecture.md
      uses: brownfield-architecture-tmpl
      duration_estimate: "30-60 min"
      requires: prd.md
      condition: architecture_changes_needed
      notes: "Cria a arquitetura SOMENTE para mudanças arquiteturais significativas. SALVAR SAÍDA: Copie o architecture.md final para a pasta docs/ do seu projeto."

    - id: po-validate-artifacts
      agent: po
      validates: all_artifacts
      uses: po-master-checklist
      duration_estimate: "15-30 min"
      notes: "Valida todos os documentos quanto à segurança da integração e à completude. Pode exigir atualizações em qualquer documento."

    - id: po-delegate-fixes
      agent: po
      action: delegate_fixes
      delegates_to: [analyst, pm, architect]
      updates: any_flagged_documents
      duration_estimate: "15-30 min"
      condition: po_checklist_issues
      notes: "Se o PO encontrar problemas, o PO delega as correções ao agente relevante e revalida os documentos atualizados na pasta docs/."

    - phase: 3
      name: Fragmentação de Documentos

    - id: po-shard-documents
      agent: po
      action: shard_documents
      creates: sharded_docs
      duration_estimate: "15-30 min"
      requires:  # todos os artefatos validados devem estar salvos na pasta docs/ do projeto
        - prd.md
        - architecture.md
      notes: |
        Fragmente os documentos para o desenvolvimento na IDE:
        - Opção A: Use o agente PO para fragmentar: @po e então peça para fragmentar docs/prd.md
        - Opção B: Manual: Arraste a task shard-doc + docs/prd.md para o chat
        - Cria as pastas docs/prd/ e docs/architecture/ com o conteúdo fragmentado

    - phase: 4
      name: Ciclo de Desenvolvimento

    - id: sm-create-story
      agent: sm
      action: create_story
      creates: story.md
      duration_estimate: "15-30 min"
      requires: sharded_docs_or_brownfield_docs
      repeats: for_each_epic_or_enhancement
      notes: |
        Ciclo de criação de story:
        - Para PRD fragmentado: @sm → *create (usa create-next-story)
        - Para docs brownfield: @sm → use a task create-brownfield-story
        - Cria a story a partir da documentação disponível
        - A story começa no status "Draft"
        - Pode exigir a coleta de contexto adicional para brownfield

    - id: pm-review-draft-story
      agent: pm
      alternative_agent: analyst
      action: review_draft_story
      updates: story.md
      duration_estimate: "10-20 min"
      requires: story.md
      optional: true
      condition: user_wants_story_review
      notes: |
        OPCIONAL: Revisar e aprovar a story em rascunho
        - NOTA: task story-review em breve
        - Revisar a completude e o alinhamento da story
        - Atualizar o status da story: Draft → Approved

    - id: dev-implement-story
      agent: dev
      action: implement_story
      creates: implementation_files
      duration_estimate: "1-4 hours"
      requires: story.md
      notes: |
        Agente Dev (Novo Chat): @dev
        - Implementa a story aprovada
        - Atualiza a File List com todas as mudanças
        - Marca a story como "Review" ao concluir

    - id: qa-review-implementation
      agent: qa
      action: review_implementation
      updates: implementation_files
      duration_estimate: "20-40 min"
      requires: implementation_files
      optional: true
      notes: |
        OPCIONAL: Agente QA (Novo Chat): @qa → review-story
        - Revisão de dev sênior com capacidade de refatoração
        - Corrige pequenos problemas diretamente
        - Deixa um checklist para os itens restantes
        - Atualiza o status da story (Review → Done ou permanece Review)

    - id: dev-address-qa-feedback
      agent: dev
      action: address_qa_feedback
      updates: implementation_files
      requires: implementation_files
      duration_estimate: "30-60 min"
      condition: qa_left_unchecked_items
      notes: |
        Se o QA deixou itens não marcados:
        - Agente Dev (Novo Chat): Tratar os itens restantes
        - Retornar ao QA para aprovação final

    - meta: repeat
      target_steps: [sm-create-story, dev-implement-story, qa-review-implementation]
      condition: stories_remaining
      notes: |
        Repita o ciclo de story (SM → Dev → QA) para todas as stories do epic
        Continue até que todas as stories no PRD estejam concluídas

    - id: po-epic-retrospective
      agent: po
      action: epic_retrospective
      creates: epic-retrospective.md
      duration_estimate: "15-30 min"
      condition: epic_complete
      optional: true
      notes: |
        OPCIONAL: Após a conclusão do epic
        - NOTA: task epic-retrospective em breve
        - Validar que o epic foi concluído corretamente
        - Documentar aprendizados e melhorias

    - meta: end
      notes: |
        Todas as stories implementadas e revisadas!
        Fase de desenvolvimento do projeto concluída.

        Referência: .aiox-core/data/aiox-kb.md#IDE Development Workflow

  flow_diagram: |
    ```mermaid
    graph TD
        A[Start: Brownfield Enhancement] --> B[analyst: classify enhancement scope]
        B --> C{Enhancement Size?}

        C -->|Single Story| D[pm: brownfield-create-story]
        C -->|1-3 Stories| E[pm: brownfield-create-epic]
        C -->|Major Enhancement| F[analyst: check documentation]

        D --> END1[To Dev Implementation]
        E --> END2[To Story Creation]

        F --> G{Docs Adequate?}
        G -->|No| H[architect: document-project]
        G -->|Yes| I[pm: brownfield PRD]
        H --> I

        I --> J{Architecture Needed?}
        J -->|Yes| K[architect: architecture.md]
        J -->|No| L[po: validate artifacts]
        K --> L

        L --> M{PO finds issues?}
        M -->|Yes| N[po: delegate fixes to relevant agent]
        M -->|No| O[po: shard documents]
        N --> L

        O --> P[sm: create story]
        P --> Q{Story Type?}
        Q -->|Sharded PRD| R[create-next-story]
        Q -->|Brownfield Docs| S[create-brownfield-story]

        R --> T{Review draft?}
        S --> T
        T -->|Yes| U[pm/analyst: review & approve story]
        T -->|No| V[dev: implement]
        U --> V

        V --> W{QA review?}
        W -->|Yes| X[qa: review]
        W -->|No| Y{More stories?}
        X --> Z{Issues?}
        Z -->|Yes| AA[dev: fix]
        Z -->|No| Y
        AA --> X
        Y -->|Yes| P
        Y -->|No| AB{Retrospective?}
        AB -->|Yes| AC[po: retrospective]
        AB -->|No| AD[Complete]
        AC --> AD

        style AD fill:#90EE90
        style END1 fill:#90EE90
        style END2 fill:#90EE90
        style D fill:#87CEEB
        style E fill:#87CEEB
        style I fill:#FFE4B5
        style K fill:#FFE4B5
        style O fill:#ADD8E6
        style P fill:#ADD8E6
        style V fill:#ADD8E6
        style U fill:#F0E68C
        style X fill:#F0E68C
        style AC fill:#F0E68C
    ```

  decision_guidance:
    when_to_use:
      - O aprimoramento requer stories coordenadas
      - Mudanças arquiteturais são necessárias
      - Trabalho significativo de integração necessário
      - Avaliação de riscos e planejamento de mitigação necessários
      - Múltiplos membros da equipe trabalharão em mudanças relacionadas

    when_not_to_use:
      - Novo projeto do zero (use greenfield-fullstack)
      - Aprimoramento apenas de serviço (use brownfield-service)
      - Aprimoramento apenas de frontend (use brownfield-ui)
      - Apenas avaliação de dívida técnica (use brownfield-discovery)

  handoff_prompts:
    classification_complete: |
      Aprimoramento classificado como: {{enhancement_type}}
      {{if single_story}}: Prosseguindo com a task brownfield-create-story para implementação imediata.
      {{if small_feature}}: Criando epic focado com a task brownfield-create-epic.
      {{if major_enhancement}}: Continuando com o workflow de planejamento abrangente.

    documentation_assessment: |
      Avaliação da documentação concluída:
      {{if adequate}}: A documentação existente é suficiente. Prosseguindo diretamente para a criação do PRD.
      {{if inadequate}}: Rodando document-project para capturar o estado atual do sistema antes do PRD.

    document_project_to_pm: |
      Análise do projeto concluída. Principais achados documentados em:
      - {{document_list}}
      Use esses achados para informar a criação do PRD e evitar reanalisar os mesmos aspectos.

    pm_to_architect_decision: |
      PRD concluído e salvo como docs/prd.md.
      Mudanças arquiteturais identificadas: {{yes/no}}
      {{if yes}}: Prosseguindo para criar o documento de arquitetura para: {{specific_changes}}
      {{if no}}: Nenhuma mudança arquitetural necessária. Prosseguindo para a validação.

    architect_to_po: "Arquitetura concluída. Salve-a como docs/architecture.md. Por favor, valide todos os artefatos quanto à segurança da integração."

    po_to_sm: |
      Todos os artefatos validados.
      Tipo de documentação disponível: {{sharded_prd / brownfield_docs}}
      {{if sharded}}: Use a task padrão create-next-story.
      {{if brownfield}}: Use a task create-brownfield-story para lidar com formatos de documentação variados.

    sm_story_creation: |
      Criando story a partir de {{documentation_type}}.
      {{if missing_context}}: Pode ser necessário coletar contexto adicional do usuário durante a criação da story.

    complete: "Todos os artefatos de planejamento validados e o desenvolvimento pode começar. As stories serão criadas com base no formato de documentação disponível."
