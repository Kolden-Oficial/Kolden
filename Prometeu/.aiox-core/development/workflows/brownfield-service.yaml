workflow:
  id: brownfield-service
  name: Aprimoramento Brownfield de Serviço/API
  description: >-
    Workflow de agentes para aprimorar serviços backend e APIs existentes com novas funcionalidades,
    modernização ou melhorias de performance. Lida com a análise do sistema existente e a integração segura.
  type: brownfield
  version: "1.0"
  project_types:
    - service-modernization
    - api-enhancement
    - microservice-extraction
    - performance-optimization
    - integration-enhancement

  metadata:
    elicit: true
    confirmation_required: true

  phases:
    - phase_1: Análise e Planejamento do Serviço
    - phase_2: Fragmentação de Documentos
    - phase_3: Ciclo de Desenvolvimento

  sequence:
    - phase: 1
      name: Análise e Planejamento do Serviço
      description: "Analisar o serviço existente e criar os artefatos de planejamento"

    - id: architect-service-analysis
      step: service_analysis
      agent: architect
      action: document-project  # task-reference
      creates: [project-documentation.md]
      duration_estimate: "30-60 min"
      notes: "Revisar a documentação do serviço existente, a base de código, as métricas de performance e identificar as dependências de integração."

    - id: pm-create-prd
      agent: pm
      creates: prd.md
      uses: brownfield-prd-tmpl
      duration_estimate: "30-60 min"
      requires: existing_service_analysis
      notes: "Cria um PRD abrangente focado no aprimoramento do serviço com a análise do sistema existente. SALVAR SAÍDA: Copie o prd.md final para a pasta docs/ do seu projeto."

    - id: architect-create-architecture
      agent: architect
      creates: architecture.md
      uses: brownfield-architecture-tmpl
      duration_estimate: "30-60 min"
      requires: prd.md
      notes: "Cria a arquitetura com a estratégia de integração do serviço e o planejamento da evolução da API. SALVAR SAÍDA: Copie o architecture.md final para a pasta docs/ do seu projeto."

    - id: po-validate-artifacts
      agent: po
      validates: all_artifacts
      uses: po-master-checklist
      duration_estimate: "15-30 min"
      notes: "Valida todos os documentos quanto à segurança da integração do serviço e à compatibilidade da API. Pode exigir atualizações em qualquer documento."

    - id: po-delegate-fixes
      agent: po
      action: delegate_fixes
      delegates_to: [analyst, pm, architect]
      updates: any_flagged_documents
      duration_estimate: "15-30 min"
      condition: po_checklist_issues
      notes: "Se o PO encontrar problemas, o PO delega as correções ao agente relevante e revalida os documentos atualizados na pasta docs/."

    - phase: 2
      name: Fragmentação de Documentos
      description: "Quebrar o PRD e a arquitetura em blocos prontos para o desenvolvimento"

    - id: po-shard-documents
      agent: po
      action: shard_documents
      creates: sharded_docs
      duration_estimate: "15-30 min"
      requires:
        - prd.md
        - architecture.md
      notes: |
        Fragmente os documentos para o desenvolvimento na IDE:
        - Opção A: Use o agente PO para fragmentar: @po e então peça para fragmentar docs/prd.md
        - Opção B: Manual: Arraste a task shard-doc + docs/prd.md para o chat
        - Cria as pastas docs/prd/ e docs/architecture/ com o conteúdo fragmentado

    - phase: 3
      name: Ciclo de Desenvolvimento
      description: "Implementação iterativa de stories com revisão de QA"

    - id: sm-create-story
      agent: sm
      action: create_story
      creates: story.md
      duration_estimate: "15-30 min"
      requires: sharded_docs
      repeats: for_each_epic
      notes: |
        Ciclo de criação de story:
        - Agente SM (Novo Chat): @sm → *create
        - Cria a próxima story a partir dos docs fragmentados
        - A story começa no status "Draft"

    - id: pm-review-draft-story
      agent: pm
      alternative_agent: analyst
      action: review_draft_story
      updates: story.md
      duration_estimate: "10-20 min"
      requires: story.md
      optional: true
      condition: user_wants_story_review
      notes: |
        OPCIONAL: Revisar e aprovar a story em rascunho
        - NOTA: task story-review em breve
        - Revisar a completude e o alinhamento da story
        - Atualizar o status da story: Draft → Approved

    - id: dev-implement-story
      agent: dev
      action: implement_story
      creates: implementation_files
      duration_estimate: "1-4 hours"
      requires: story.md
      notes: |
        Agente Dev (Novo Chat): @dev
        - Implementa a story aprovada
        - Atualiza a File List com todas as mudanças
        - Marca a story como "Review" ao concluir

    - id: qa-review-implementation
      agent: qa
      action: review_implementation
      updates: implementation_files
      duration_estimate: "20-40 min"
      requires: implementation_files
      optional: true
      notes: |
        OPCIONAL: Agente QA (Novo Chat): @qa → review-story
        - Revisão de dev sênior com capacidade de refatoração
        - Corrige pequenos problemas diretamente
        - Deixa um checklist para os itens restantes
        - Atualiza o status da story (Review → Done ou permanece Review)

    - id: dev-address-qa-feedback
      agent: dev
      action: address_qa_feedback
      updates: implementation_files
      requires: implementation_files
      duration_estimate: "30-60 min"
      condition: qa_left_unchecked_items
      notes: |
        Se o QA deixou itens não marcados:
        - Agente Dev (Novo Chat): Tratar os itens restantes
        - Retornar ao QA para aprovação final

    - meta: repeat
      target_steps: [sm-create-story, pm-review-draft-story, dev-implement-story, qa-review-implementation, dev-address-qa-feedback]
      condition: stories_remaining
      notes: |
        Repita o ciclo de story (SM → Dev → QA) para todas as stories do epic
        Continue até que todas as stories no PRD estejam concluídas

    - id: po-epic-retrospective
      agent: po
      action: epic_retrospective
      creates: epic-retrospective.md
      duration_estimate: "15-30 min"
      condition: epic_complete
      optional: true
      notes: |
        OPCIONAL: Após a conclusão do epic
        - NOTA: task epic-retrospective em breve
        - Validar que o epic foi concluído corretamente
        - Documentar aprendizados e melhorias

    - meta: end
      action: project_complete
      notes: |
        Todas as stories implementadas e revisadas!
        Fase de desenvolvimento do projeto concluída.
        Referência: .aiox-core/data/aiox-kb.md#IDE Development Workflow

  flow_diagram: |
    ```mermaid
    graph TD
        A[Start: Service Enhancement] --> B[architect: analyze existing service]
        B --> C[pm: prd.md]
        C --> D[architect: architecture.md]
        D --> E[po: validate with po-master-checklist]
        E --> F{PO finds issues?}
        F -->|Yes| G[po: delegate fixes to relevant agent]
        F -->|No| H[po: shard documents]
        G --> E

        H --> I[sm: create story]
        I --> J{Review draft story?}
        J -->|Yes| K[pm/analyst: review & approve story]
        J -->|No| L[dev: implement story]
        K --> L
        L --> M{QA review?}
        M -->|Yes| N[qa: review implementation]
        M -->|No| O{More stories?}
        N --> P{QA found issues?}
        P -->|Yes| Q[dev: address QA feedback]
        P -->|No| O
        Q --> N
        O -->|Yes| I
        O -->|No| R{Epic retrospective?}
        R -->|Yes| S[po: epic retrospective]
        R -->|No| T[Project Complete]
        S --> T

        style T fill:#90EE90
        style H fill:#ADD8E6
        style I fill:#ADD8E6
        style L fill:#ADD8E6
        style C fill:#FFE4B5
        style D fill:#FFE4B5
        style K fill:#F0E68C
        style N fill:#F0E68C
        style S fill:#F0E68C
    ```

  decision_guidance:
    when_to_use:
      - O aprimoramento do serviço requer stories coordenadas
      - Versionamento de API ou breaking changes necessários
      - Mudanças no schema do banco de dados necessárias
      - Melhorias de performance ou escalabilidade necessárias
      - Múltiplos pontos de integração afetados
    when_not_to_use:
      - Novo serviço do zero (use greenfield-service)
      - Aprimoramento de frontend (use brownfield-ui)
      - Aprimoramento full-stack (use brownfield-fullstack)
      - Auditoria abrangente de dívida técnica (use brownfield-discovery)

  handoff_prompts:
    architect_to_pm: "Análise do serviço concluída. Crie um PRD abrangente com a estratégia de integração do serviço."
    pm_to_architect: "PRD pronto. Salve-o como docs/prd.md, depois crie a arquitetura do serviço."
    architect_to_po: "Arquitetura concluída. Salve-a como docs/architecture.md. Por favor, valide todos os artefatos quanto à segurança da integração do serviço."
    po_issues: "O PO encontrou problemas com [documento]. Por favor, retorne ao [agente] para corrigir e re-salvar o documento atualizado."
    complete: "Todos os artefatos de planejamento validados e salvos na pasta docs/. Vá para o ambiente da IDE para iniciar o desenvolvimento."
