workflow:
  id: qa-loop
  name: Orquestrador do QA Loop - Ciclo Revisão Correção Re-revisão
  version: "1.0"
  description: >-
    QA loop automatizado que orquestra o ciclo revisão → correção → re-revisão.
    Executa até maxIterations (padrão 5), rastreando os resultados de cada iteração.
    Escala para um humano quando o máximo de iterações é atingido ou quando uma parada manual é solicitada.

    Parte do Epic 6 - QA Evolution: Autonomous Development Engine (ADE).

  type: loop
  project_types:
    - aiox-development
    - autonomous-development
    - qa-automation

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO DE GATILHOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  triggers:
    # Gatilho primário: Comando explícito para iniciar o loop
    - event: command
      command: "*qa-loop"
      action: start_loop

    # Iniciar a partir de uma fase específica
    - event: command
      command: "*qa-loop-review"
      action: run_step
      step: review

    - event: command
      command: "*qa-loop-fix"
      action: run_step
      step: fix

    # Comando de parada (AC5)
    - event: command
      command: "*stop-qa-loop"
      action: stop_loop

    # Comando de retomada
    - event: command
      command: "*resume-qa-loop"
      action: resume_loop

    # Forçar escalonamento
    - event: command
      command: "*escalate-qa-loop"
      action: escalate

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  config:
    # AC2: Máximo de iterações (configurável)
    maxIterations: 5
    configPath: autoClaude.qaLoop.maxIterations

    # Rastreamento de progresso
    showProgress: true
    verbose: true

    # Localização do arquivo de status (AC4)
    statusFile: qa/loop-status.json

    # Integração com o dashboard (AC7)
    dashboardStatusPath: .aiox/dashboard/status.json
    legacyStatusPath: .aiox/status.json

    # Timeout por fase (milissegundos)
    reviewTimeout: 1800000  # 30 minutos
    fixTimeout: 3600000     # 60 minutos

    # Configuração de retentativas
    maxRetries: 2
    retryDelay: 5000

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              SCHEMA DO STATUS DO LOOP (AC4)
  # ═══════════════════════════════════════════════════════════════════════════════════

  status_schema:
    storyId: string
    currentIteration: number
    maxIterations: number
    status: "pending | in_progress | completed | stopped | escalated"
    startedAt: ISO-8601
    updatedAt: ISO-8601
    history:
      - iteration: number
        reviewedAt: ISO-8601
        verdict: "APPROVE | REJECT | BLOCKED"
        issuesFound: number
        fixedAt: ISO-8601 | null
        issuesFixed: number | null
        duration: number  # milissegundos

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              SEQUÊNCIA DO WORKFLOW
  # ═══════════════════════════════════════════════════════════════════════════════════

  sequence:

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 1: REVISÃO (Agente QA)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: review
      phase: 1
      phase_name: "Revisão QA"
      agent: qa

      description: >-
        Executa uma revisão de QA abrangente da implementação da story.
        Produz um veredito: APPROVE, REJECT ou BLOCKED.

      task: qa-review-story.md

      inputs:
        storyId: "{storyId}"
        iteration: "{currentIteration}"
        previousIssues: "{history[-1].issuesFound|0}"

      outputs:
        - gate-file.yaml
        - verdict
        - issuesFound

      timeout: "{config.reviewTimeout}"

      on_success:
        log: "Revisão concluída: {verdict} ({issuesFound} problemas)"
        next: check_verdict

      on_failure:
        action: retry
        max_retries: "{config.maxRetries}"
        on_exhausted: escalate

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 2: VERIFICAR VEREDITO (AC1)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: check_verdict
      phase: 2
      phase_name: "Verificação do Veredito"
      agent: system

      description: >-
        Avalia o veredito da revisão e determina a próxima ação.
        APPROVE = concluir, REJECT = continuar para a correção, BLOCKED = escalar.

      condition_check:
        - condition: verdict == "APPROVE"
          action: complete
          log: "Story APPROVED após {currentIteration} iteração(ões)"

        - condition: verdict == "BLOCKED"
          action: escalate
          reason: "Revisão de QA BLOCKED - requer intervenção humana"

        - condition: verdict == "REJECT"
          action: continue
          next: create_fix_request

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 3: CRIAR PEDIDO DE CORREÇÃO (Agente QA)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: create_fix_request
      phase: 3
      phase_name: "Criar Pedido de Correção"
      agent: qa

      description: >-
        Gera um documento estruturado de pedido de correção a partir dos achados da revisão.
        Prioriza os problemas e fornece instruções de correção acionáveis.

      task: qa-create-fix-request.md

      inputs:
        storyId: "{storyId}"
        gateFile: "{outputs.review.gate-file}"
        iteration: "{currentIteration}"

      outputs:
        - fix-request.md
        - prioritizedIssues

      on_success:
        log: "Pedido de correção criado com {prioritizedIssues.length} problemas priorizados"
        next: fix_issues

      on_failure:
        action: continue
        fallback: "Usar o arquivo de gate bruto para as correções"

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 4: CORRIGIR PROBLEMAS (Agente Dev)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: fix_issues
      phase: 4
      phase_name: "Aplicar Correções"
      agent: dev

      description: >-
        O agente desenvolvedor aplica as correções com base no pedido de correção.
        Roda os testes e valida as mudanças.

      task: dev-apply-qa-fixes.md

      inputs:
        storyId: "{storyId}"
        fixRequest: "{outputs.create_fix_request.fix-request}"
        iteration: "{currentIteration}"

      outputs:
        - fixes-applied.json
        - issuesFixed

      timeout: "{config.fixTimeout}"

      on_success:
        log: "Corrigidos {issuesFixed} de {issuesFound} problemas"
        next: increment_iteration

      on_failure:
        action: retry
        max_retries: "{config.maxRetries}"
        on_exhausted:
          action: escalate
          reason: "Agente Dev incapaz de aplicar as correções após as retentativas"

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 5: INCREMENTAR ITERAÇÃO (AC2)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: increment_iteration
      phase: 5
      phase_name: "Verificar Iteração"
      agent: system

      description: >-
        Incrementa o contador de iterações e verifica contra o máximo.
        Se o máximo for atingido, escala para um humano (AC3).

      action: increment_and_check

      condition_check:
        - condition: currentIteration >= maxIterations
          action: escalate
          reason: "Máximo de iterações ({maxIterations}) atingido sem APPROVE"
          log: "Máximo de iterações atingido - escalando para um humano"

        - condition: currentIteration < maxIterations
          action: continue
          next: review
          log: "Iniciando a iteração {currentIteration + 1}/{maxIterations}"

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              ESCALONAMENTO (AC3)
  # ═══════════════════════════════════════════════════════════════════════════════════

  escalation:
    enabled: true

    triggers:
      - max_iterations_reached
      - verdict_blocked
      - fix_failure
      - manual_escalate

    action:
      log: "Escalando para um humano com o contexto completo"
      status: "escalated"

      context_package:
        - loop-status.json
        - todos os arquivos de gate do histórico
        - todos os pedidos de correção
        - resumo das iterações

      notification:
        message: |
          Escalonamento do QA Loop para {storyId}

          Motivo: {escalation.reason}
          Iterações concluídas: {currentIteration}
          Último veredito: {history[-1].verdict}
          Problemas pendentes: {history[-1].issuesFound - history[-1].issuesFixed}

          Revise o pacote de contexto e decida:
          1. Retomar o loop: *resume-qa-loop {storyId}
          2. Corrigir e aprovar manualmente
          3. Rejeitar a story e criar um follow-up

        channels: [log, console]

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONCLUSÃO DO WORKFLOW (AC6)
  # ═══════════════════════════════════════════════════════════════════════════════════

  completion:
    success_message: |
      ╔══════════════════════════════════════════════════════════════╗
      ║  QA Loop Concluído                                           ║
      ╚══════════════════════════════════════════════════════════════╝

      Story:        {storyId}
      Status:       {status}
      Iterações:    {currentIteration}/{maxIterations}
      Veredito Final: {history[-1].verdict}

      Histórico de Iterações:
      {history.map(h => `  ${h.iteration}. ${h.verdict} - ${h.issuesFound} found, ${h.issuesFixed || 0} fixed`).join('\n')}

      Duração: {totalDuration}

    summary:
      storyId: "{storyId}"
      status: "{status}"
      iterations: "{currentIteration}"
      finalVerdict: "{history[-1].verdict}"
      totalIssuesFound: "{history.reduce((sum, h) => sum + h.issuesFound, 0)}"
      totalIssuesFixed: "{history.reduce((sum, h) => sum + (h.issuesFixed || 0), 0)}"
      duration: "{totalDuration}"

    outputs:
      - loop-status.json
      - summary.md

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              TRATAMENTO DE ERROS
  # ═══════════════════════════════════════════════════════════════════════════════════

  error_handling:
    missing_story_id:
      message: "O ID da story é obrigatório"
      suggestion: "Uso: *qa-loop STORY-42"
      action: prompt

    review_timeout:
      message: "A fase de revisão atingiu o timeout"
      suggestion: "Verifique o status do agente QA e tente novamente: *resume-qa-loop {storyId}"
      action: escalate

    fix_timeout:
      message: "A fase de correção atingiu o timeout"
      suggestion: "Verifique o status do agente Dev e tente novamente: *resume-qa-loop {storyId}"
      action: escalate

    invalid_status:
      message: "O arquivo de status do loop está corrompido ou inválido"
      suggestion: "Resete o loop: *qa-loop {storyId} --reset"
      action: halt

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              SUPORTE A PARAR/RETOMAR (AC5)
  # ═══════════════════════════════════════════════════════════════════════════════════

  control:
    stop:
      command: "*stop-qa-loop"
      action: |
        - Definir o status como "stopped"
        - Salvar o estado atual em loop-status.json
        - Log: "QA loop parado na iteração {currentIteration}"
        - Permitir retomada posterior

    resume:
      command: "*resume-qa-loop"
      action: |
        - Carregar o estado de loop-status.json
        - Verificar se o status era "stopped" ou "escalated"
        - Definir o status como "in_progress"
        - Continuar a partir do último passo
        - Log: "QA loop retomado na iteração {currentIteration}"

    reset:
      command: "*qa-loop --reset"
      action: |
        - Excluir loop-status.json
        - Iniciar um loop novo
        - Log: "QA loop resetado para {storyId}"

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              INTEGRAÇÃO COM O DASHBOARD (AC7)
  # ═══════════════════════════════════════════════════════════════════════════════════

  integration:
    status_json:
      track_loop: true
      field: qaLoop
      update_on_each_iteration: true

      schema:
        storyId: string
        status: string
        currentIteration: number
        maxIterations: number
        lastVerdict: string
        lastIssuesFound: number
        updatedAt: ISO-8601

    project_status:
      update_story_status: true
      status_field: qaLoopStatus

    notifications:
      on_approve:
        message: "QA Loop APPROVED: {storyId}"
        channels: [log]
      on_escalate:
        message: "QA Loop ESCALATED: {storyId} - requer atenção"
        channels: [log]
      on_stop:
        message: "QA Loop STOPPED: {storyId}"
        channels: [log]

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              METADADOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  metadata:
    story: "6.5"
    epic: "Epic 6 - QA Evolution"
    created: "2026-01-29"
    author: "@architect (Aria)"
    dependencies:
      - qa-review-story.md
      - qa-create-fix-request.md
      - dev-apply-qa-fixes.md
    tags:
      - qa-loop
      - workflow
      - orchestration
      - ade
      - autonomous
