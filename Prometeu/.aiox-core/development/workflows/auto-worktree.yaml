workflow:
  id: auto-worktree
  name: Auto-Worktree - Ambiente de Desenvolvimento Isolado Automático
  version: "1.0"
  description: >-
    Cria e gerencia automaticamente worktrees isolados para o desenvolvimento de stories.
    Disparado quando o @dev começa a trabalhar em uma story, garantindo capacidade de
    desenvolvimento paralelo e isolamento limpo entre diferentes tasks de desenvolvimento.

    Parte da infraestrutura Auto-Claude ADE (Autonomous Development Engine).

  type: automation
  project_types:
    - aiox-development
    - autonomous-development
    - parallel-development

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO DE GATILHOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  triggers:
    # Gatilho primário: Quando o @dev inicia uma story
    - event: story_started
      agent: dev
      condition: projectConfig.autoWorktree.enabled === true
      action: create_worktree

    # Gatilho secundário: Quando o @po atribui uma story
    - event: story_assigned
      agent: po
      condition: projectConfig.autoWorktree.createOnAssign === true
      action: create_worktree

    # Gatilho manual: Comando explícito
    - event: command
      command: "*auto-worktree"
      action: interactive_flow

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  config:
    # Habilita a criação automática de worktree
    enabled: true

    # Cria o worktree quando a story é atribuída (antes de o desenvolvimento começar)
    createOnAssign: false

    # Troca automaticamente para o worktree após a criação
    autoSwitch: true

    # Exibe o resumo de criação do worktree
    verbose: true

    # Limpa worktrees obsoletos antes de criar um novo
    autoCleanup: false

    # Máximo de worktrees antes de exigir limpeza
    maxWorktrees: 10

    # Dias até um worktree ser considerado obsoleto
    staleDays: 30

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              VERIFICAÇÕES PRE-FLIGHT
  # ═══════════════════════════════════════════════════════════════════════════════════

  pre_flight:
    enabled: true

    checks:
      - id: git_repo
        description: Verificar repositório git
        command: git rev-parse --is-inside-work-tree
        blocking: true
        error: "Não é um repositório git. O Auto-worktree requer git."

      - id: worktree_support
        description: Verificar suporte a git worktree
        command: git worktree list
        blocking: true
        error: "Git worktree não suportado. Requer git >= 2.5."

      - id: worktree_manager
        description: Verificar se o WorktreeManager está disponível
        file_exists: .aiox-core/infrastructure/scripts/worktree-manager.js
        blocking: true
        error: "WorktreeManager não encontrado. Infraestrutura AIOX incompleta."

      - id: check_limit
        description: Verificar se o limite de worktrees não foi excedido
        script: |
          const WorktreeManager = require('./.aiox-core/infrastructure/scripts/worktree-manager.js');
          const manager = new WorktreeManager();
          const count = await manager.getCount();
          return count.total < manager.maxWorktrees;
        blocking: false
        warning: "Aproximando-se do limite de worktrees. Considere fazer limpeza."

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              SEQUÊNCIA DO WORKFLOW
  # ═══════════════════════════════════════════════════════════════════════════════════

  sequence:

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 1: EXTRAIR CONTEXTO DA STORY
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: extract_story_context
      phase: 1
      phase_name: "Extrair Contexto"
      action: extract_story_info

      description: >-
        Extrai as informações da story a partir do contexto do gatilho.
        Determina o ID da story a ser usado para nomear o worktree.

      script: |
        // Extract story ID from various sources
        function extractStoryId(context) {
          // From explicit parameter
          if (context.storyId) return context.storyId;

          // From story file path
          if (context.storyFile) {
            const match = context.storyFile.match(/story-(\d+\.\d+)/);
            if (match) return match[1];
          }

          // From current task
          if (context.currentTask?.storyId) return context.currentTask.storyId;

          // From git branch (if following convention)
          const branch = await execGit(['branch', '--show-current']);
          const branchMatch = branch.match(/story[-\/](\d+\.\d+)/i);
          if (branchMatch) return branchMatch[1];

          return null;
        }

        const storyId = extractStoryId(context);
        if (!storyId) {
          throw new Error('Could not determine story ID. Please provide explicitly.');
        }

        return { storyId };

      outputs:
        - storyId

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 2: VERIFICAR WORKTREE EXISTENTE
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: check_existing
      phase: 2
      phase_name: "Verificar Existente"
      action: check_worktree_exists

      description: >-
        Verifica se já existe um worktree para esta story.
        Se existir, pula a criação e, opcionalmente, troca para ele.

      script: |
        const WorktreeManager = require('./.aiox-core/infrastructure/scripts/worktree-manager.js');
        const manager = new WorktreeManager();
        const exists = await manager.exists(storyId);

        if (exists) {
          const info = await manager.get(storyId);
          return {
            exists: true,
            worktree: info,
            action: config.autoSwitch ? 'switch' : 'skip'
          };
        }

        return { exists: false, action: 'create' };

      outputs:
        - exists
        - worktree
        - action

      on_exists:
        log: "Worktree já existe para a story {storyId}"
        skip_to: switch_worktree

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 3: AUTO-LIMPEZA (OPCIONAL)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: auto_cleanup
      phase: 3
      phase_name: "Auto-Limpeza"
      action: cleanup_stale_worktrees
      condition: config.autoCleanup === true

      description: >-
        Limpa automaticamente worktrees obsoletos antes de criar um novo.
        Só executa se autoCleanup estiver habilitado na config.

      script: |
        const WorktreeManager = require('./.aiox-core/infrastructure/scripts/worktree-manager.js');
        const manager = new WorktreeManager();
        const removed = await manager.cleanupStale();

        return {
          cleaned: removed.length,
          removedIds: removed
        };

      outputs:
        - cleaned
        - removedIds

      on_cleanup:
        log: "{cleaned} worktrees obsoletos limpos"

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 4: CRIAR WORKTREE
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: create_worktree
      phase: 4
      phase_name: "Criar Worktree"
      action: create_isolated_worktree

      description: >-
        Cria um novo worktree isolado para a story.
        Cria o branch auto-claude/{storyId} e o diretório de trabalho.

      task: create-worktree.md

      inputs:
        story_id: "{storyId}"

      script: |
        const WorktreeManager = require('./.aiox-core/infrastructure/scripts/worktree-manager.js');
        const manager = new WorktreeManager();

        try {
          const worktree = await manager.create(storyId);
          return {
            success: true,
            worktree: worktree,
            path: worktree.path,
            branch: worktree.branch
          };
        } catch (error) {
          return {
            success: false,
            error: error.message
          };
        }

      outputs:
        - success
        - worktree
        - path
        - branch
        - error

      on_success:
        log: "Worktree criado em {path}"

      on_failure:
        action: halt
        error: "Falha ao criar o worktree: {error}"

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 5: TROCAR PARA O WORKTREE (OPCIONAL)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: switch_worktree
      phase: 5
      phase_name: "Trocar Contexto"
      action: switch_to_worktree
      condition: config.autoSwitch === true

      description: >-
        Troca automaticamente o contexto de trabalho para o novo worktree.
        Atualiza o ambiente do shell e notifica o usuário.

      script: |
        const worktreePath = worktree?.path || path;

        // Note: Cannot actually change parent process cwd
        // Instead, provide instructions and set environment hint

        console.log(`\n📂 Switch to worktree:`);
        console.log(`   cd ${worktreePath}\n`);

        // Set environment variable for shell integration
        process.env.AIOX_WORKTREE = worktreePath;
        process.env.AIOX_STORY = storyId;

        return {
          worktreePath,
          instructions: `cd ${worktreePath}`
        };

      outputs:
        - worktreePath
        - instructions

    # ═════════════════════════════════════════════════════════════════════════════════
    # PASSO 6: EXIBIR RESUMO
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: display_summary
      phase: 6
      phase_name: "Resumo"
      action: show_summary
      condition: config.verbose === true

      description: >-
        Exibe o resumo de conclusão do workflow com os detalhes do worktree
        e os próximos passos para o desenvolvedor.

      template: |
        ╔══════════════════════════════════════════════════════════════╗
        ║  🌲 Auto-Worktree Concluído                                  ║
        ╚══════════════════════════════════════════════════════════════╝

        Story:      {storyId}
        Worktree:   {worktree.path}
        Branch:     {worktree.branch}
        Status:     {worktree.status}

        ─────────────────────────────────────────────────────────────────
        📌 Referência Rápida:

        Navegar:    cd {worktree.path}
        Status:     *list-worktrees
        Merge:      *merge-worktree {storyId}
        Remover:    *remove-worktree {storyId}

        ─────────────────────────────────────────────────────────────────
        💡 Você agora está trabalhando em um ambiente isolado.
           As mudanças aqui não afetarão o branch main até serem mergeadas.

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONCLUSÃO DO WORKFLOW
  # ═══════════════════════════════════════════════════════════════════════════════════

  completion:
    success_message: "Worktree pronto para a story {storyId}"

    outputs:
      - storyId
      - worktree
      - path
      - branch

    next_steps:
      - "Navegue até o worktree: cd {path}"
      - "Inicie o desenvolvimento em isolamento"
      - "Quando concluir: *merge-worktree {storyId}"

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              TRATAMENTO DE ERROS
  # ═══════════════════════════════════════════════════════════════════════════════════

  error_handling:
    max_worktrees_reached:
      message: "Limite máximo de worktrees ({maxWorktrees}) atingido"
      suggestion: "Execute *cleanup-worktrees para remover worktrees obsoletos"
      action: halt

    worktree_creation_failed:
      message: "Falha ao criar o worktree"
      suggestion: "Verifique o git status e tente novamente"
      action: halt

    story_id_not_found:
      message: "Não foi possível determinar o ID da story"
      suggestion: "Forneça o ID da story explicitamente: *auto-worktree STORY-42"
      action: prompt

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              INTEGRAÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  integration:
    # Integração com o agente @dev
    dev_agent:
      hook: on_story_start
      action: trigger_workflow
      pass_context: true

    # Integração com o status do projeto
    project_status:
      update_on_create: true
      field: activeWorktree

    # Integração com o status.json
    status_json:
      track_worktrees: true
      include_in_context: true

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              METADADOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  metadata:
    story: "1.4"
    epic: "Epic 1 - Worktree Manager"
    created: "2026-01-28"
    author: "@architect (Aria)"
    dependencies:
      - worktree-manager.js
      - create-worktree.md
    tags:
      - automation
      - worktree
      - isolation
      - ade
