# ============================================
# Template de Workflow de Orquestração de Epic
#
# Template genérico e reutilizável para executar epics
# com execução paralela baseada em waves e quality gates.
#
# Cada story dentro de uma wave roda o development-cycle completo
# (PO valida → Executor desenvolve → Self-healing → Quality Gate → push do DevOps)
#
# Planos de execução específicos do projeto referenciam este template
# e vivem em docs/stories/epics/{epic-name}/
#
# @version 1.0.0
# @author @pm (Bob) + @architect (Aria)
# ============================================

workflow:
  id: epic-orchestration
  name: "Orquestração de Epic por Waves"
  version: "1.0.0"
  description: >-
    Template reutilizável para executar epics com desenvolvimento paralelo baseado em waves.
    As stories dentro de cada wave rodam o workflow development-cycle completo
    (PO → Executor → Self-Healing → Quality Gate → DevOps → Checkpoint).
    Os gates de wave validam a integração antes de prosseguir para a próxima wave.
    Suporta isolamento por worktree para desenvolvimento paralelo livre de conflitos.

  type: epic-orchestration
  project_types:
    - greenfield
    - brownfield
    - aiox-development
    - epic-execution

  metadata:
    elicit: true
    confirmation_required: true

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              MODOS DE EXECUÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  execution_modes:
    - mode: yolo
      description: Autônomo - as waves rodam com interação mínima, checkpoints com auto-GO
      prompts: 0-2
    - mode: interactive
      description: Checkpoints humanos entre waves e nos quality gates
      prompts: 5-10
      default: true
    - mode: preflight
      description: Análise completa de dependências antes do início da execução
      prompts: 10-15

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO (sobrescrita pelo plano de execução do projeto)
  # ═══════════════════════════════════════════════════════════════════════════════════

  config:
    # Estes valores são SOBRESCRITOS pelo plano de execução específico do projeto
    epicId: "${epicId}"
    epicIndex: "${epicIndex}"
    storyBasePath: "${storyBasePath}"

    # Padrões de execução paralela
    maxConcurrency: 4
    worktreeIsolation: true

    # Timeouts
    storyTimeout: 7200000       # 2 horas por story (total do development-cycle)
    gateTimeout: 1800000        # 30 min por gate de wave
    totalTimeout: 43200000      # 12 horas no total

    # Quality gates
    gatePolicy: strict          # strict | lenient | skip
    requireIntegrationReview: true

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              WORKFLOW INTERNO
  # ═══════════════════════════════════════════════════════════════════════════════════
  #
  # Cada story dentro de uma wave executa o development-cycle completo:
  #
  #   Fase 1: @po valida a story (validate-story-draft)
  #   Fase 2: ${story.executor} desenvolve (executor dinâmico)
  #   Fase 3: @dev self-healing (CodeRabbit, condicional)
  #   Fase 4: ${story.quality_gate} revisa (agente != executor)
  #   Fase 5: @devops push & PR
  #   Fase 6: @po checkpoint (AUTO-GO no modo wave, humano no interativo)
  #
  # Referência: .aiox-core/development/workflows/development-cycle.yaml

  inner_workflow:
    ref: development-cycle
    per_story: true
    checkpoint_mode:
      in_wave: auto_go           # Não pausar entre stories paralelas
      between_waves: interactive  # Pausar para decisão humana entre waves

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              PADRÃO DE EXECUÇÃO DE WAVE
  # ═══════════════════════════════════════════════════════════════════════════════════
  #
  # As waves são definidas no plano de execução específico do projeto.
  # Este template define o PADRÃO que cada wave segue:
  #
  #   ┌─────────────────────────────────────────────────────┐
  #   │  WAVE N                                              │
  #   │                                                      │
  #   │  Story A ──→ development-cycle ──→ branch pushed     │
  #   │  Story B ──→ development-cycle ──→ branch pushed     │ PARALELO
  #   │  Story C ──→ development-cycle ──→ branch pushed     │
  #   │                                                      │
  #   │  ──→ WAVE GATE (revisão de integração) ──→ merge     │
  #   └─────────────────────────────────────────────────────┘

  wave_pattern:

    # Passo 1: Desenvolvimento por story (paralelo dentro da wave)
    story_execution:
      parallel: true
      max_concurrency: "${config.maxConcurrency}"
      worktree_isolation: "${config.worktreeIsolation}"
      workflow: development-cycle
      inputs:
        story_file: "${story.file}"
        epic_context:
          epicId: "${config.epicId}"
          waveNumber: "${wave.number}"
          totalWaves: "${wave.total}"

    # Passo 2: Gate de wave (sequencial, após todas as stories da wave concluírem)
    wave_gate:
      description: "Revisão de integração após a wave concluir"
      steps:

        - id: integration-review
          agent: "${wave.gate_agent}"
          action: review_wave_integration
          notes: |
            Foco da revisão (o QA por story já foi feito no development-cycle):
            - Compatibilidade de integração entre stories
            - Detecção de conflitos em arquivos compartilhados
            - A suíte de testes combinada passa
            - Sem regressões das mudanças paralelas
            - Consistência de arquitetura entre as stories

        - id: merge-wave
          agent: devops
          action: merge_wave_branches
          condition: gate_approved
          notes: |
            Faça o merge de todas as branches da wave para a main:
            - Siga a ordem de merge do plano de execução
            - Resolva os conflitos, se houver
            - Rode a suíte de testes completa no resultado mesclado
            - Tag: wave-{N}-complete
            - Limpe os worktrees

    # Passo 3: Checkpoint humano (entre waves)
    checkpoint:
      agent: po
      elicit: true
      options:
        GO: "Continuar para a próxima wave"
        PAUSE: "Salvar o estado, parar a execução"
        REVIEW: "Mostrar o resumo da wave antes de decidir"
        ABORT: "Parar o epic"
      on_go: next_wave
      on_pause: save_state
      on_abort: abort_epic

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              GERENCIAMENTO DE ESTADO
  # ═══════════════════════════════════════════════════════════════════════════════════

  state:
    persistence:
      enabled: true
      location: ".aiox/workflow-state/"
      format: json
      file: "${config.epicId}-pipeline.json"

    tracked_fields:
      - current_wave
      - wave_status
      - story_statuses
      - gate_verdicts
      - started_at
      - last_updated

    recovery:
      enabled: true
      auto_resume: true
      resume_from: last_completed_wave

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              TRATAMENTO DE ERROS
  # ═══════════════════════════════════════════════════════════════════════════════════

  error_handling:
    story_failed:
      description: "O development-cycle de uma story falhou"
      action: |
        - O development-cycle lida com retentativas internamente (máx. 3 tentativas)
        - Se ainda falhar, marque a story como bloqueada
        - Continue as outras stories paralelas da wave
        - Reporte a story bloqueada no gate de wave
      escalation: wave_gate

    gate_failed:
      description: "O gate de integração da wave falhou"
      action: |
        - Identifique as stories/integrações que falharam
        - Crie tasks de correção para os problemas específicos
        - Reexecute o development-cycle para as stories afetadas
        - Reenvie para a revisão do gate
      max_retries: 2
      escalation: human

    merge_conflict:
      description: "Conflito durante o merge das branches da wave"
      action: |
        - Siga a ordem de merge do plano de execução
        - Resolva os conflitos na ordem recomendada
        - Reexecute os testes após a resolução
      escalation: human

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              DIAGRAMA DE FLUXO
  # ═══════════════════════════════════════════════════════════════════════════════════

  flow_diagram: |
    ```
    ┌─────────────────────────────────────────────────────────────┐
    │              ORQUESTRAÇÃO DE EPIC POR WAVES                  │
    └─────────────────────────────────────────────────────────────┘

    Para cada WAVE definida no plano de execução do projeto:

    ┌─────────────────────────────────────────────────────────────┐
    │  WAVE N (stories rodam em PARALELO)                        │
    │                                                             │
    │  Story A ──→ development-cycle ──→ branch pushed            │
    │    (PO valida → Executor dev → Self-heal → QA → Push)     │
    │                                                             │
    │  Story B ──→ development-cycle ──→ branch pushed            │
    │    (PO valida → Executor dev → Self-heal → QA → Push)     │
    │                                                             │
    │  Story C ──→ development-cycle ──→ branch pushed            │
    │    (PO valida → Executor dev → Self-heal → QA → Push)     │
    └───────────────────────┬─────────────────────────────────────┘
                            │
                            ▼
    ┌─────────────────────────────────────────────────────────────┐
    │  WAVE GATE (só revisão de integração - QA por story feito)  │
    │                                                             │
    │  gate_agent: Revisar integração entre stories              │
    │  @devops:    Merge das branches → main                      │
    └───────────────────────┬─────────────────────────────────────┘
                            │
                            ▼
    ┌─────────────────────────────────────────────────────────────┐
    │  CHECKPOINT (entre waves)                                   │
    │                                                             │
    │  @po pergunta: [ GO ] [ PAUSE ] [ REVIEW ] [ ABORT ]       │
    └───────────────────────┬─────────────────────────────────────┘
                            │
                            ▼
                      Próxima Wave...
    ```

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              ORIENTAÇÃO DE DECISÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  decision_guidance:
    when_to_use:
      - Epic com 4+ stories que podem ser agrupadas em waves paralelas
      - Stories têm um grafo de dependências claro (algumas paralelas, algumas sequenciais)
      - Necessidade de quality gates entre grupos de stories relacionadas
      - A equipe tem capacidade para fluxos de desenvolvimento paralelos

    when_not_to_use:
      - Epic com 1-3 stories (use story-development-cycle diretamente)
      - Todas as stories são estritamente sequenciais (use story-development-cycle em loop)
      - Correções simples de bug sem preocupações de integração

    how_to_use:
      - Crie o plano de execução do projeto em docs/stories/epics/{epic}/
      - Defina as waves, as atribuições de story, as branches, os gates
      - Referencie este template como o padrão de orquestração
      - Execute via WorkflowOrchestrator com a config do plano de execução

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              WORKFLOWS RELACIONADOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  related:
    - id: development-cycle
      role: "Loop interno - roda por story dentro de cada wave"
      file: development-cycle.yaml

    - id: qa-loop
      role: "Ciclo de revisão de QA - usado dentro da Fase 4 do development-cycle"
      file: qa-loop.yaml

    - id: auto-worktree
      role: "Criação de worktree - usado para o isolamento de stories paralelas"
      file: auto-worktree.yaml

    - id: story-development-cycle
      role: "Ciclo de story simplificado (legado) - use development-cycle em vez disso"
      file: story-development-cycle.yaml

metadata:
  author: "@pm (Bob) + @architect (Aria)"
  created: "2026-02-06"
  version: 1.0.0
  tags:
    - epic-orchestration
    - parallel-execution
    - wave-executor
    - quality-gates
    - worktree-isolation
    - reusable-template
