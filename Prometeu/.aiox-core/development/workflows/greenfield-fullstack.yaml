workflow:
  id: greenfield-fullstack
  name: Desenvolvimento Greenfield de Aplicação Full-Stack
  description: >-
    Workflow de agentes para construir aplicações full-stack do conceito ao desenvolvimento.
    Suporta tanto o planejamento abrangente para projetos complexos quanto a prototipagem rápida para os simples.
    Inclui o bootstrap de ambiente da Fase 0 para a configuração adequada do ferramental.
  type: greenfield
  version: "1.0"
  project_types:
    - web-app
    - saas
    - enterprise-app
    - prototype
    - mvp

  metadata:
    elicit: true
    confirmation_required: true

  phases:
    - phase_0: Bootstrap de Ambiente
    - phase_1: Descoberta e Planejamento
    - phase_2: Fragmentação de Documentos
    - phase_3: Ciclo de Desenvolvimento

  sequence:
    # ═══════════════════════════════════════════════════════════════════════════
    # FASE 0: BOOTSTRAP DE AMBIENTE
    # ═══════════════════════════════════════════════════════════════════════════
    - phase: 0
      name: Bootstrap de Ambiente
      description: "Configurar o ambiente de desenvolvimento antes de iniciar o planejamento do projeto"

    - id: devops-environment-bootstrap
      agent: devops
      action: environment_bootstrap
      duration_estimate: "15-30 min"
      creates:
        - .aiox/config.yaml
        - .aiox/environment-report.json
        - .gitignore
        - README.md
        - package.json
      task: environment-bootstrap.md
      optional: false
      notes: |
        PRIMEIRO PASSO CRÍTICO - Execute antes de qualquer planejamento:
        - @devops → *environment-bootstrap
        - Verifica/instala CLIs (git, gh, node, supabase, railway)
        - Autentica serviços (GitHub, Supabase, Railway)
        - Cria o repositório Git localmente e no GitHub
        - Estrutura o esqueleto do projeto AIOX
        - Gera o relatório de ambiente

        CONDIÇÕES PARA PULAR:
        - Só pule se o projeto já tiver .aiox/environment-report.json
        - Reexecute ao trocar de máquina ou quando novos membros da equipe entrarem

    # ═══════════════════════════════════════════════════════════════════════════
    # FASE 1: DESCOBERTA E PLANEJAMENTO
    # ═══════════════════════════════════════════════════════════════════════════
    - phase: 1
      name: Descoberta e Planejamento
      description: "Criar todos os artefatos de planejamento (project brief, PRD, specs, arquitetura)"

    - id: analyst-project-brief
      agent: analyst
      creates: project-brief.md
      duration_estimate: "30-60 min"
      requires: environment_bootstrap_complete
      optional_steps:
        - brainstorming-session
        - market-research-prompt
      notes: "Pode fazer brainstorming primeiro, depois pesquisa aprofundada opcional antes de criar o project brief. SALVAR SAÍDA: Copie o project-brief.md final para a pasta docs/ do seu projeto."

    - id: pm-create-prd
      agent: pm
      creates: prd.md
      duration_estimate: "30-60 min"
      requires: project-brief.md
      notes: "Cria o PRD a partir do project brief usando prd-tmpl. SALVAR SAÍDA: Copie o prd.md final para a pasta docs/ do seu projeto."

    - id: ux-create-frontend-spec
      agent: ux-design-expert
      creates: front-end-spec.md
      duration_estimate: "30-45 min"
      requires: prd.md
      optional_steps:
        - user-research-prompt
      notes: "Cria a especificação de UI/UX usando front-end-spec-tmpl. SALVAR SAÍDA: Copie o front-end-spec.md final para a pasta docs/ do seu projeto."

    - id: ux-generate-v0-prompt
      agent: ux-design-expert
      creates: v0_prompt (optional)
      duration_estimate: "15-30 min"
      requires: front-end-spec.md
      condition: user_wants_ai_generation
      notes: "OPCIONAL MAS RECOMENDADO: Gerar prompt de UI por IA para ferramentas como v0, Lovable, etc. Use a task generate-ai-frontend-prompt. O usuário pode então gerar a UI na ferramenta externa e baixar a estrutura do projeto."

    - id: architect-create-architecture
      agent: architect
      creates: fullstack-architecture.md
      duration_estimate: "30-60 min"
      requires:
        - prd.md
        - front-end-spec.md
      optional_steps:
        - technical-research-prompt
        - review-generated-ui-structure
      notes: "Cria a arquitetura abrangente usando fullstack-architecture-tmpl. Se o usuário gerou a UI com v0/Lovable, pode incorporar a estrutura do projeto na arquitetura. Pode sugerir mudanças nas stories do PRD ou novas stories. SALVAR SAÍDA: Copie o fullstack-architecture.md final para a pasta docs/ do seu projeto."

    - id: pm-update-prd
      agent: pm
      updates: prd.md
      duration_estimate: "15-30 min"
      requires: fullstack-architecture.md
      condition: architecture_suggests_prd_changes
      notes: "Se o arquiteto sugerir mudanças nas stories, atualize o PRD e re-exporte o prd.md completo e sem redações para a pasta docs/."

    - id: po-validate-artifacts
      agent: po
      validates: all_artifacts
      uses: po-master-checklist
      duration_estimate: "15-30 min"
      notes: "Valida todos os documentos quanto à consistência e completude. Pode exigir atualizações em qualquer documento."

    - id: po-delegate-fixes
      agent: po
      action: delegate_fixes
      delegates_to: [analyst, pm, ux-design-expert, architect]
      updates: any_flagged_documents
      duration_estimate: "15-30 min"
      condition: po_checklist_issues
      notes: "Se o PO encontrar problemas, o PO delega as correções ao agente relevante e revalida os documentos atualizados na pasta docs/."

    - meta: guidance
      id: project-setup-guidance
      action: guide_project_structure
      condition: user_has_generated_ui
      notes: "Se o usuário gerou a UI com v0/Lovable: Para configuração polyrepo, coloque o projeto baixado em um repositório frontend separado ao lado do repositório backend. Para monorepo, coloque no diretório apps/web ou packages/frontend. Revise o documento de arquitetura para orientação específica."

    - meta: guidance
      id: development-order-guidance
      action: guide_development_sequence
      notes: "Com base nas stories do PRD: Se as stories forem majoritariamente de frontend, comece primeiro pelo projeto/diretório de frontend. Se forem majoritariamente de backend ou API-first, comece pelo backend. Para funcionalidades fortemente acopladas, siga a sequência de stories na configuração monorepo. Consulte os epics fragmentados do PRD para a ordem de desenvolvimento."

    # ═══════════════════════════════════════════════════════════════════════════
    # FASE 2: FRAGMENTAÇÃO DE DOCUMENTOS
    # ═══════════════════════════════════════════════════════════════════════════
    - phase: 2
      name: Fragmentação de Documentos
      description: "Quebrar o PRD e a arquitetura em blocos prontos para o desenvolvimento"

    - id: po-shard-documents
      agent: po
      action: shard_documents
      creates: sharded_docs
      duration_estimate: "15-30 min"
      requires:  # todos os artefatos validados devem estar salvos na pasta docs/ do projeto
        - prd.md
        - front-end-spec.md
        - fullstack-architecture.md
      notes: |
        Fragmente os documentos para o desenvolvimento na IDE:
        - Opção A: Use o agente PO para fragmentar: @po e então peça para fragmentar docs/prd.md
        - Opção B: Manual: Arraste a task shard-doc + docs/prd.md para o chat
        - Cria as pastas docs/prd/ e docs/architecture/ com o conteúdo fragmentado
        - Gera: source-tree.md, tech-stack.md, coding-standards.md

    # ═══════════════════════════════════════════════════════════════════════════
    # FASE 3: CICLO DE DESENVOLVIMENTO
    # ═══════════════════════════════════════════════════════════════════════════
    - phase: 3
      name: Ciclo de Desenvolvimento
      description: "Implementação iterativa de stories com revisão de QA"

    - id: sm-create-story
      agent: sm
      action: create_story
      creates: story.md
      duration_estimate: "15-30 min"
      requires: sharded_docs
      repeats: for_each_epic
      notes: |
        Ciclo de criação de story:
        - Agente SM (Novo Chat): @sm → *create
        - Cria a próxima story a partir dos docs fragmentados
        - A story começa no status "Draft"

    - id: pm-review-draft-story
      agent: pm
      action: review_draft_story
      alternative_agent: analyst
      updates: story.md
      duration_estimate: "10-20 min"
      requires: story.md
      optional: true
      condition: user_wants_story_review
      notes: |
        OPCIONAL: Revisar e aprovar a story em rascunho
        - NOTA: task story-review em breve
        - Revisar a completude e o alinhamento da story
        - Atualizar o status da story: Draft → Approved

    - id: dev-implement-story
      agent: dev
      action: implement_story
      creates: implementation_files
      duration_estimate: "1-4 hours"
      requires: story.md
      notes: |
        Agente Dev (Novo Chat): @dev
        - Implementa a story aprovada
        - Atualiza a File List com todas as mudanças
        - Marca a story como "Review" ao concluir

    - id: qa-review-implementation
      agent: qa
      action: review_implementation
      updates: implementation_files
      duration_estimate: "20-40 min"
      requires: implementation_files
      optional: true
      notes: |
        OPCIONAL: Agente QA (Novo Chat): @qa → review-story
        - Revisão de dev sênior com capacidade de refatoração
        - Corrige pequenos problemas diretamente
        - Deixa um checklist para os itens restantes
        - Atualiza o status da story (Review → Done ou permanece Review)

    - id: dev-address-qa-feedback
      agent: dev
      action: address_qa_feedback
      updates: implementation_files
      requires: implementation_files
      duration_estimate: "30-60 min"
      condition: qa_left_unchecked_items
      notes: |
        Se o QA deixou itens não marcados:
        - Agente Dev (Novo Chat): Tratar os itens restantes
        - Retornar ao QA para aprovação final

    - meta: repeat
      target_steps: [sm-create-story, dev-implement-story, qa-review-implementation]
      condition: stories_remaining
      notes: |
        Repita o ciclo de story (SM → Dev → QA) para todas as stories do epic
        Continue até que todas as stories no PRD estejam concluídas

    - id: po-epic-retrospective
      agent: po
      action: epic_retrospective
      creates: epic-retrospective.md
      duration_estimate: "15-30 min"
      condition: epic_complete
      optional: true
      notes: |
        OPCIONAL: Após a conclusão do epic
        - NOTA: task epic-retrospective em breve
        - Validar que o epic foi concluído corretamente
        - Documentar aprendizados e melhorias

    - meta: end
      action: project_complete
      notes: |
        Todas as stories implementadas e revisadas!
        Fase de desenvolvimento do projeto concluída.
        Referência: .aiox-core/data/aiox-kb.md#IDE Development Workflow

  flow_diagram: |
    ```mermaid
    graph TD
        subgraph PHASE_0["PHASE 0: Environment Bootstrap"]
            A[Start: Greenfield Project] --> A1{Environment ready?}
            A1 -->|No| A2[devops: environment-bootstrap]
            A2 --> A3[CLIs installed + GitHub repo created]
            A1 -->|Yes| A3
        end

        subgraph PHASE_1["PHASE 1: Discovery & Planning"]
            A3 --> B[analyst: project-brief.md]
            B --> C[pm: prd.md]
            C --> D[ux-design-expert: front-end-spec.md]
            D --> D2{Generate v0 prompt?}
            D2 -->|Yes| D3[ux-design-expert: create v0 prompt]
            D2 -->|No| E[architect: fullstack-architecture.md]
            D3 --> D4[User: generate UI in v0/Lovable]
            D4 --> E
            E --> F{Architecture suggests PRD changes?}
            F -->|Yes| G[pm: update prd.md]
            F -->|No| H[po: validate all artifacts]
            G --> H
            H --> I{PO finds issues?}
            I -->|Yes| J[po: delegate fixes to relevant agent]
            I -->|No| K_GATE[Phase 1 Complete]
            J --> H
        end

        subgraph PHASE_2["PHASE 2: Document Sharding"]
            K_GATE --> K[po: shard documents]
            K --> K1[Creates: source-tree, tech-stack, coding-standards]
        end

        subgraph PHASE_3["PHASE 3: Development Cycle"]
            K1 --> L[sm: create story]
            L --> M{Review draft story?}
            M -->|Yes| N[pm/analyst: review & approve story]
            M -->|No| O[dev: implement story]
            N --> O
            O --> P{QA review?}
            P -->|Yes| Q[qa: review implementation]
            P -->|No| R{More stories?}
            Q --> S{QA found issues?}
            S -->|Yes| T[dev: address QA feedback]
            S -->|No| R
            T --> Q
            R -->|Yes| L
            R -->|No| U{Epic retrospective?}
            U -->|Yes| V[po: epic retrospective]
            U -->|No| W[Project Complete]
            V --> W
        end

        %% Optional paths
        B -.-> B1[Optional: brainstorming]
        B -.-> B2[Optional: market research]
        D -.-> D1[Optional: user research]
        E -.-> E1[Optional: technical research]

        %% Styling
        style A2 fill:#FF6B6B,color:#fff
        style A3 fill:#FF6B6B,color:#fff
        style W fill:#90EE90
        style K fill:#ADD8E6
        style K1 fill:#ADD8E6
        style L fill:#ADD8E6
        style O fill:#ADD8E6
        style D3 fill:#E6E6FA
        style D4 fill:#E6E6FA
        style B fill:#FFE4B5
        style C fill:#FFE4B5
        style D fill:#FFE4B5
        style E fill:#FFE4B5
        style N fill:#F0E68C
        style Q fill:#F0E68C
        style V fill:#F0E68C
    ```

  decision_guidance:
    when_to_use:
      - Construir aplicações prontas para produção
      - Múltiplos membros da equipe estarão envolvidos
      - Requisitos de funcionalidade complexos
      - Necessidade de documentação abrangente
      - Manutenção de longo prazo esperada
      - Aplicações corporativas ou voltadas ao cliente
    when_not_to_use:
      - Projeto simples apenas de API sem frontend (use greenfield-service)
      - Projeto apenas de frontend sem backend (use greenfield-ui)
      - Aprimorar aplicação existente (use brownfield-fullstack)
      - Avaliação de dívida técnica em projeto existente (use brownfield-discovery)

  handoff_prompts:
    # Fase 0 → Fase 1
    bootstrap_to_analyst: "Bootstrap de ambiente concluído! Repositório Git criado, CLIs verificadas, estrutura do projeto pronta. Inicie um novo chat com @analyst para criar o project brief."

    # Interno da Fase 1
    analyst_to_pm: "O project brief está completo. Salve-o como docs/project-brief.md no seu projeto, depois crie o PRD."
    pm_to_ux: "O PRD está pronto. Salve-o como docs/prd.md no seu projeto, depois crie a especificação de UI/UX."
    ux_to_architect: "A spec de UI/UX está completa. Salve-a como docs/front-end-spec.md no seu projeto, depois crie a arquitetura fullstack."
    architect_review: "A arquitetura está completa. Salve-a como docs/fullstack-architecture.md. Você sugere alguma mudança nas stories do PRD ou precisa adicionar novas stories?"
    architect_to_pm: "Por favor, atualize o PRD com as mudanças de story sugeridas, depois re-exporte o prd.md completo para docs/."
    updated_to_po: "Todos os documentos prontos na pasta docs/. Por favor, valide todos os artefatos quanto à consistência."
    po_issues: "O PO encontrou problemas com [documento]. Por favor, retorne ao [agente] para corrigir e re-salvar o documento atualizado."

    # Fase 1 → Fase 2
    phase1_to_phase2: "Todos os artefatos de planejamento validados. Agora fragmente os documentos para o desenvolvimento: @po → *shard-doc docs/prd.md"

    # Fase 2 → Fase 3
    phase2_to_phase3: "Documentos fragmentados! source-tree.md, tech-stack.md, coding-standards.md criados. Inicie o desenvolvimento: @sm → *create-story"

    # Conclusão
    complete: "Todas as stories implementadas e revisadas. Fase de desenvolvimento do projeto concluída!"
