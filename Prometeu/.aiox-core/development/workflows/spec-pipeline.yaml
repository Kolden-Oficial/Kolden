workflow:
  id: spec-pipeline
  name: Spec Pipeline - De Requisitos a Especificação
  version: "1.0"
  description: >-
    Pipeline completo que transforma requisitos informais em especificações
    executáveis. Orquestra 5 fases: Gather → Assess → Research → Write → Critique.
    Adapta as fases baseado na complexidade do requisito.

    Parte da infraestrutura do Auto-Claude ADE (Autonomous Development Engine).

  type: pipeline
  project_types:
    - aiox-development
    - autonomous-development
    - spec-generation

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO DE GATILHOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  triggers:
    # Gatilho primário: Comando explícito
    - event: command
      command: "*create-spec"
      action: run_pipeline

    # Gatilho secundário: Nova story criada
    - event: story_created
      condition: projectConfig.autoSpec.enabled === true
      action: run_pipeline

    # Gatilhos específicos de agente
    - event: command
      command: "*gather-requirements"
      action: run_phase
      phase: gather

    - event: command
      command: "*assess-complexity"
      action: run_phase
      phase: assess

    - event: command
      command: "*research-deps"
      action: run_phase
      phase: research

    - event: command
      command: "*write-spec"
      action: run_phase
      phase: spec

    - event: command
      command: "*critique-spec"
      action: run_phase
      phase: critique

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONFIGURAÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  config:
    # Auto-spec quando a story é criada
    autoSpec:
      enabled: false
      trigger: story_created

    # Rastreamento de progresso
    showProgress: true
    verbose: true

    # Configuração de retentativa
    maxRetries: 2
    retryDelay: 1000

    # Comportamento do gate
    strictGate: true  # O veredito BLOCKED interrompe o pipeline

    # Padrão do diretório de saída
    outputDir: docs/stories/{storyId}/spec/

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              FASES BASEADAS EM COMPLEXIDADE
  # ═══════════════════════════════════════════════════════════════════════════════════

  phases:
    # SIMPLE: Pipeline mínimo para tarefas diretas
    SIMPLE:
      description: "Tarefa direta, padrões existentes"
      steps:
        - gather
        - spec
        - critique
      estimated_time: "30-60 min"

    # STANDARD: Pipeline completo para complexidade moderada
    STANDARD:
      description: "Complexidade moderada, alguma pesquisa necessária"
      steps:
        - gather
        - assess
        - research
        - spec
        - critique
        - plan
      estimated_time: "2-4 hours"

    # COMPLEX: Pipeline estendido com loop de revisão
    COMPLEX:
      description: "Alta complexidade, múltiplas iterações"
      steps:
        - gather
        - assess
        - research
        - spec
        - critique_1
        - revise
        - critique_2
        - plan
      estimated_time: "4-8 hours"
      flags:
        - "Revisão arquitetural recomendada"
        - "Considere quebrar em stories menores"

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              VERIFICAÇÕES PRÉ-EXECUÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  pre_flight:
    enabled: true

    checks:
      - id: story_exists
        description: "Verificar se o diretório da story existe ou pode ser criado"
        script: |
          const fs = require('fs');
          const path = `docs/stories/${storyId}`;
          if (!fs.existsSync(path)) {
            fs.mkdirSync(path, { recursive: true });
          }
          return true;
        blocking: true
        error: "Não foi possível criar o diretório da story"

      - id: no_existing_spec
        description: "Verificar se há spec existente (evitar sobrescrita)"
        script: |
          const fs = require('fs');
          const specPath = `docs/stories/${storyId}/spec/spec.md`;
          return !fs.existsSync(specPath);
        blocking: false
        warning: "Spec existente encontrada - vai iterar"

      - id: agents_available
        description: "Verificar se os agentes necessários estão configurados"
        check: "All spec pipeline agents have autoClaude.specPipeline defined"
        blocking: true

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              SEQUÊNCIA DO WORKFLOW
  # ═══════════════════════════════════════════════════════════════════════════════════

  sequence:

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 1: COLETAR REQUISITOS
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: gather
      phase: 1
      phase_name: "Coletar Requisitos"
      agent: pm

      description: >-
        Coletar e estruturar requisitos a partir da entrada do usuário, do PRD ou de spec existente.
        Cria requirements.json com requisitos funcionais, não funcionais e restrições.

      task: spec-gather-requirements.md

      inputs:
        storyId: "{storyId}"
        source: "{source|user}"
        prdPath: "{prdPath|null}"

      outputs:
        - requirements.json

      elicit: true  # Requer interação do usuário

      on_success:
        log: "✅ Requisitos coletados: {requirements.functional.length} FR, {requirements.nonFunctional.length} NFR"
        next: assess

      on_failure:
        action: halt
        error: "Falha ao coletar requisitos"

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 2: AVALIAR COMPLEXIDADE
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: assess
      phase: 2
      phase_name: "Avaliar Complexidade"
      agent: architect

      description: >-
        Avaliar a complexidade em 5 dimensões: escopo, integração, infraestrutura,
        conhecimento, risco. Determina quais fases do pipeline são necessárias.

      task: spec-assess-complexity.md

      inputs:
        storyId: "{storyId}"
        requirements: "docs/stories/{storyId}/spec/requirements.json"
        overrideComplexity: "{complexity|null}"

      outputs:
        - complexity.json

      skip_if: "source === 'simple' OR overrideComplexity === 'SIMPLE'"

      on_success:
        log: "📊 Complexidade avaliada: {complexity.result} (score: {complexity.totalScore})"
        dynamic_phases: true  # Usa complexity.result para determinar as fases
        next: research

      on_failure:
        action: continue
        fallback: "Assumir complexidade STANDARD"

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 3: PESQUISAR DEPENDÊNCIAS
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: research
      phase: 3
      phase_name: "Pesquisar Dependências"
      agent: analyst

      description: >-
        Pesquisar dependências externas usando Context7 (docs de bibliotecas) e EXA (busca na web).
        Valida tecnologias e reúne padrões de implementação.

      task: spec-research-dependencies.md

      inputs:
        storyId: "{storyId}"
        requirements: "docs/stories/{storyId}/spec/requirements.json"
        complexity: "docs/stories/{storyId}/spec/complexity.json"

      outputs:
        - research.json

      skip_if: "complexity.result === 'SIMPLE'"

      tools:
        - context7
        - exa

      on_success:
        log: "🔍 Pesquisa concluída: {research.dependencies.length} dependências, {research.unverifiedClaims.length} não verificadas"
        next: spec

      on_failure:
        action: continue
        fallback: "Prosseguir com saída mínima de pesquisa"

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 4: ESCREVER ESPECIFICAÇÃO
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: spec
      phase: 4
      phase_name: "Escrever Especificação"
      agent: pm

      description: >-
        Gerar o spec.md completo a partir de todos os artefatos anteriores.
        Sem invenção - derivar o conteúdo apenas das entradas.

      task: spec-write-spec.md

      inputs:
        storyId: "{storyId}"
        requirements: "docs/stories/{storyId}/spec/requirements.json"
        complexity: "docs/stories/{storyId}/spec/complexity.json"
        research: "docs/stories/{storyId}/spec/research.json"

      outputs:
        - spec.md

      on_success:
        log: "📝 Especificação escrita: docs/stories/{storyId}/spec/spec.md"
        next: critique

      on_failure:
        action: halt
        error: "Falha ao escrever a especificação"

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 5: CRITICAR ESPECIFICAÇÃO
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: critique
      phase: 5
      phase_name: "Criticar Especificação"
      agent: qa

      description: >-
        Quality gate que valida a spec em relação aos requisitos.
        Avalia precisão, completude, consistência, viabilidade e alinhamento.

      task: spec-critique.md

      inputs:
        storyId: "{storyId}"
        spec: "docs/stories/{storyId}/spec/spec.md"
        requirements: "docs/stories/{storyId}/spec/requirements.json"
        complexity: "docs/stories/{storyId}/spec/complexity.json"
        research: "docs/stories/{storyId}/spec/research.json"

      outputs:
        - critique.json

      gate: true  # Gate bloqueante

      on_verdict:
        APPROVED:
          log: "✅ Spec APROVADA (score: {critique.scores.average})"
          next: plan
          action: continue

        NEEDS_REVISION:
          log: "⚠️ Spec PRECISA DE REVISÃO: {critique.verdictReason}"
          action: return_to_spec
          pass: [critique.json, critique.autoFixes]
          max_iterations: 2

        BLOCKED:
          log: "🛑 Spec BLOQUEADA: {critique.verdictReason}"
          action: halt
          escalate_to: "@architect"

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 5b: REVISAR ESPECIFICAÇÃO (apenas COMPLEX)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: revise
      phase: "5b"
      phase_name: "Revisar Especificação"
      agent: pm

      description: >-
        Aplicar o feedback da crítica e as correções automáticas para melhorar a especificação.
        Só roda no pipeline COMPLEX ou quando NEEDS_REVISION.

      condition: "complexity.result === 'COMPLEX' OR critique.verdict === 'NEEDS_REVISION'"

      inputs:
        storyId: "{storyId}"
        spec: "docs/stories/{storyId}/spec/spec.md"
        critique: "docs/stories/{storyId}/spec/critique.json"

      outputs:
        - spec.md (updated)

      on_success:
        log: "🔄 Especificação revisada com base na crítica"
        next: critique_2

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 5c: SEGUNDA CRÍTICA (apenas COMPLEX)
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: critique_2
      phase: "5c"
      phase_name: "Segunda Crítica"
      agent: qa

      description: >-
        Segundo quality gate para a especificação revisada.
        Mais tolerante com problemas MEDIUM se forem demonstradas melhorias.

      condition: "complexity.result === 'COMPLEX'"

      task: spec-critique.md

      inputs:
        storyId: "{storyId}"
        spec: "docs/stories/{storyId}/spec/spec.md"
        requirements: "docs/stories/{storyId}/spec/requirements.json"
        iteration: 2

      outputs:
        - critique.json (updated)

      gate: true

      on_verdict:
        APPROVED:
          next: plan
        NEEDS_REVISION:
          action: halt
          error: "A spec falhou na segunda crítica - intervenção manual necessária"
        BLOCKED:
          action: halt
          escalate_to: "@architect"

    # ═════════════════════════════════════════════════════════════════════════════════
    # FASE 6: CRIAR PLANO DE IMPLEMENTAÇÃO
    # ═════════════════════════════════════════════════════════════════════════════════

    - step: plan
      phase: 6
      phase_name: "Criar Plano de Implementação"
      agent: architect

      description: >-
        Gerar o plano de implementação a partir da especificação aprovada.
        Quebra a spec em tasks, identifica dependências, estima o esforço.

      condition: "critique.verdict === 'APPROVED'"

      task: plan-create-implementation.md  # Task futura

      inputs:
        storyId: "{storyId}"
        spec: "docs/stories/{storyId}/spec/spec.md"
        complexity: "docs/stories/{storyId}/spec/complexity.json"

      outputs:
        - plan.json

      on_success:
        log: "📋 Plano de implementação criado"
        complete: true

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              CONCLUSÃO DO WORKFLOW
  # ═══════════════════════════════════════════════════════════════════════════════════

  completion:
    success_message: |
      ╔══════════════════════════════════════════════════════════════╗
      ║  ✅ Spec Pipeline Concluído                                  ║
      ╚══════════════════════════════════════════════════════════════╝

      Story:       {storyId}
      Complexidade: {complexity.result}
      Veredito:    {critique.verdict}
      Score:       {critique.scores.average}/5

      📁 Artefatos:
         • docs/stories/{storyId}/spec/requirements.json
         • docs/stories/{storyId}/spec/complexity.json
         • docs/stories/{storyId}/spec/research.json
         • docs/stories/{storyId}/spec/spec.md
         • docs/stories/{storyId}/spec/critique.json

      📌 Próximos Passos:
         • Revisar o spec.md
         • Rodar @dev *develop {storyId}

    outputs:
      - storyId
      - requirements.json
      - complexity.json
      - research.json
      - spec.md
      - critique.json

    next_steps:
      - "Revisar a especificação: docs/stories/{storyId}/spec/spec.md"
      - "Iniciar o desenvolvimento: @dev *develop {storyId}"
      - "Ver a crítica: docs/stories/{storyId}/spec/critique.json"

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              TRATAMENTO DE ERROS
  # ═══════════════════════════════════════════════════════════════════════════════════

  error_handling:
    missing_story_id:
      message: "O ID da story é obrigatório"
      suggestion: "Uso: *create-spec STORY-42"
      action: prompt

    phase_failed:
      message: "A fase {phase} falhou"
      suggestion: "Verifique os logs e tente novamente: *create-spec {storyId} --resume"
      action: halt

    max_iterations_reached:
      message: "Número máximo de iterações de revisão atingido"
      suggestion: "Intervenção manual necessária - escalando para @architect"
      action: escalate

    critique_blocked:
      message: "Especificação bloqueada pelo QA gate"
      suggestion: "Revise o critique.json e trate os problemas de severidade HIGH"
      action: halt

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              SUPORTE A RETOMADA
  # ═══════════════════════════════════════════════════════════════════════════════════

  resume:
    enabled: true

    state_file: docs/stories/{storyId}/spec/.pipeline-state.json

    checkpoints:
      - after: gather
        state: requirements_gathered
      - after: assess
        state: complexity_assessed
      - after: research
        state: research_complete
      - after: spec
        state: spec_written
      - after: critique
        state: critique_complete

    resume_from:
      requirements_gathered: assess
      complexity_assessed: research
      research_complete: spec
      spec_written: critique
      critique_complete: plan

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              INTEGRAÇÃO
  # ═══════════════════════════════════════════════════════════════════════════════════

  integration:
    # Integração com status.json
    status_json:
      track_pipeline: true
      field: specPipeline
      update_on_each_phase: true

    # Integração com o status do projeto
    project_status:
      update_story_status: true
      status_field: specStatus

    # Hooks de notificação
    notifications:
      on_complete:
        message: "Spec pronta para {storyId}"
        channels: [log]
      on_blocked:
        message: "Spec bloqueada para {storyId} - precisa de atenção"
        channels: [log]

  # ═══════════════════════════════════════════════════════════════════════════════════
  #                              METADADOS
  # ═══════════════════════════════════════════════════════════════════════════════════

  metadata:
    story: "3.6"
    epic: "Epic 3 - Spec Pipeline"
    created: "2026-01-28"
    author: "@architect (Aria)"
    dependencies:
      - spec-gather-requirements.md
      - spec-assess-complexity.md
      - spec-research-dependencies.md
      - spec-write-spec.md
      - spec-critique.md
    tags:
      - spec-pipeline
      - workflow
      - orchestration
      - ade
