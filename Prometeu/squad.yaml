tier_0:
  agent_chief: prometeu-chief
  path: ".claude/agents/prometeu-chief.md"

tier_1:
  # 12 aiox-agents especializados AIOX vendor
  # PATH CANÔNICO AIOX: .aiox-core/development/agents/<id>/
  # Sub-onda 3.2 cuidará da conformidade Kolden interna (respeitando path AIOX)
  agents:
    - id: aiox-master
      persona: Orion
      path: ".aiox-core/development/agents/aiox-master.md"
    - id: analyst
      persona: Alex
      path: ".aiox-core/development/agents/analyst.md"
    - id: architect
      persona: Aria
      path: ".aiox-core/development/agents/architect.md"
    - id: data-engineer
      persona: Dara
      path: ".aiox-core/development/agents/data-engineer.md"
    - id: dev
      persona: Dex
      path: ".aiox-core/development/agents/dev.md"
    - id: devops
      persona: Gage
      path: ".aiox-core/development/agents/devops.md"
    - id: pm
      persona: Morgan
      path: ".aiox-core/development/agents/pm.md"
    - id: po
      persona: Pax
      path: ".aiox-core/development/agents/po.md"
    - id: qa
      persona: Quinn
      path: ".aiox-core/development/agents/qa.md"
    - id: sm
      persona: River
      path: ".aiox-core/development/agents/sm.md"
    - id: squad-creator
      persona: Craft
      path: ".aiox-core/development/agents/squad-creator.md"
    - id: ux-design-expert
      persona: Uma
      path: ".aiox-core/development/agents/ux-design-expert.md"

external_handoffs:
  - de: hermes
    tipo: dispatch
    canal: "@Prometeu"
  - de: zeus
    tipo: contrato-de-missao
    canal: "Olimpo/contratos/missoes/*.yaml"
  - de: hefesto
    tipo: especificacao-tecnica-cto
    canal: "Contrato de Missão"
  - para: qualquer_squad_kolden
    tipo: consumo-de-skill-publica
    canal: "/spec-build-review, /mcp-builder, /orquestracao-de-comandos-slash, /checklist-runner, /tech-search, /briefing-padrao"

fronteira_vendor_synkraai:
  origem: "SynkraAI/aiox-core (commit 77265d5)"
  importado_em: "2026-06-19"
  procedencia: "Prometeu/_origem.md"
  regra_invariante: |
    Vendor AIOX (.aiox-core/**, bin/aiox.js, bin/aiox-init.js, packages/, pro/,
    docs/, README*.md, LICENSE, CHANGELOG.md) preservado intocado. Camada Kolden
    externa (CLAUDE.md, prd-de-ia.md, squad.yaml, constitution.md, MEMORY.md,
    ferramentas.md, roteiro-de-teste.md, .claude/agents/prometeu-chief.md,
    .claude/reflexos/interrupt-before-mutation.sh, agent-memory/prometeu.md)
    envelopa vendor.
  aiox_boundary:
    L1_never_modify:
      - ".aiox-core/core/**"
      - ".aiox-core/constitution.md"
      - "bin/aiox.js"
      - "bin/aiox-init.js"
    L2_never_modify:
      - ".aiox-core/development/tasks/**"
      - ".aiox-core/development/templates/**"
      - ".aiox-core/development/checklists/**"
      - ".aiox-core/development/workflows/**"
      - ".aiox-core/infrastructure/**"
    L3_mutable_exception:
      - ".aiox-core/data/**"
      - ".aiox-core/development/agents/<id>/MEMORY.md"
      - "core-config.yaml"
    L4_always_modify:
      - "docs/stories/"
      - "packages/"
      - "squads/"
      - "tests/"

cross_cutting:
  # Skills públicas invocadas por outros squads Kolden como tools funcionais
  # Categoria constitucional emergente "skills-como-tools cross-squad"
  # Candidata emenda METODO v1.1 (§5 modelos ou §7 buckets)
  skills_publicas:
    - nome: spec-build-review
      path: ".claude/skills/spec-build-review/"
      consumida_por: "todos os 25 squads Kolden que precisem spec → build → review"
      grounding_required: false
    - nome: mcp-builder
      path: ".claude/skills/mcp-builder/"
      consumida_por: "@devops de qualquer squad + Caos ao criar MCP novo"
      grounding_required: true
    - nome: orquestracao-de-comandos-slash
      path: ".claude/skills/orquestracao-de-comandos-slash/"
      consumida_por: "Caos ao desenhar/rever comando slash"
      grounding_required: false
    - nome: checklist-runner
      path: ".claude/skills/checklist-runner/"
      consumida_por: "qualquer agente validando checklist"
      grounding_required: false
    - nome: tech-search
      path: ".claude/skills/tech-search/"
      consumida_por: "qualquer squad precisando pesquisa técnica autocontida"
      grounding_required: true
    - nome: briefing-padrao
      path: ".claude/skills/briefing-padrao/"
      consumida_por: "Hermes + Zeus + orquestradores ao despachar subagentes"
      grounding_required: false

constituition_kolden: "Prometeu/constitution.md"
constituition_aiox: ".aiox-core/constitution.md"
metodo_kolden_ref: "C:\\Kolden\\METODO-KOLDEN.md v1.0"
data_ratificacao: "2026-07-07"
sub_onda_ratificacao: "3.1"
contrato_mae: "m-20260706-metodo-kolden"

# Adicionado Sub-onda 3.2 (2026-07-07) — Q3.A aprovada
# Fronteira canônica entre 5 camadas Kolden (METODO §3) e sub-camada aiox-agent interno AIOX vendor
mapeamento_cross_camada:
  descricao: "Fronteira canônica entre 5 camadas Kolden (METODO §3) e sub-camada aiox-agent interno AIOX vendor"

  entrada_externa_kolden:
    - de: "Humano (Ronan)"
      canal: "@Prometeu"
      via: "sessao raiz Claude Code em C:\\Kolden\\"
      ativa: "prometeu-chief (tier-0 externo Kolden)"
    - de: "Hermes (Camada 2)"
      canal: "@Prometeu"
      via: "dispatch cross-squad Kolden com lacre sha256"
      ativa: "prometeu-chief"
    - de: "Zeus (Camada 3 CEO)"
      canal: "Contrato de Missao"
      via: "arquivo YAML em Olimpo/contratos/missoes/*.yaml"
      ativa: "prometeu-chief"
    - de: "Hefesto (Camada 4 CTO)"
      canal: "especificacao tecnica CTO"
      via: "Contrato de Missao com detalhamento tecnico Hefesto"
      ativa: "prometeu-chief"

  roteamento_interno_aiox:
    executor: "prometeu-chief (dentro da sessao dedicada Prometeu)"
    regra_ativacao: |
      prometeu-chief diagnostica intencao e roteia para aiox-agent AIOX interno via convencao AIOX @{id}:
      - feature/bug + story existe -> @dev (Dex — ASL-3)
      - feature/bug + sem story -> @sm (River — ASL-2) primeiro
      - refactor/architecture -> @architect (Aria — ASL-2)
      - schema/DB/migration -> @data-engineer (Dara — ASL-3 CRITICO)
      - teste/QA -> @qa (Quinn — ASL-2)
      - PRD/product/roadmap -> @pm (Bob — ASL-2)
      - story validation/backlog -> @po (Pax — ASL-2)
      - deploy/push/release/MCP -> @devops (Gage — ASL-3 CRITICO — AUTORIDADE EXCLUSIVA)
      - pesquisa/analise -> @analyst (Atlas — ASL-2)
      - UX/UI -> @ux-design-expert (Uma — ASL-2)
      - cross-disciplinar sem escopo claro -> @aiox-master (Orion — ASL-3 governanca)
      - criacao de squad AIOX -> @squad-creator (Craft) [FORA DE ESCOPO KOLDEN — factory = Caos]
    referencia_persona_aiox: ".claude/commands/AIOX/agents/{id}.md (12 personas AIOX vendor)"
    referencia_variante_claude_code: ".claude/agents/aiox-{id}.md (11 pos-3.2: 10 pre + aiox-master CREATE 3.2; aiox-squad-creator SEM variante Claude Code)"
    referencia_canonico_aiox_vendor: ".aiox-core/development/agents/{id}.md (12 preservados intocados)"
    referencia_memory_canonico_aiox: ".aiox-core/development/agents/<id>/MEMORY.md (10 canonicos; aiox-master e squad-creator sem MEMORY canonico)"

  saida_externa_kolden:
    - para: "Hefesto (Camada 4)"
      canal: "Entrega tecnica"
      via: "PR + release note + Contrato-de-Missao entregue"
      trigger: "aiox-devops (Gage) faz git push"
    - para: "Dike (verificador na subida)"
      canal: "Verificacao independente"
      via: "CAOS-CL-002 checklist"
      trigger: "APOS entrega Prometeu, ANTES de Hermes devolver ao Ronan"
    - para: "Outros 25 squads Kolden"
      canal: "6 skills publicas cross-squad"
      via: "invocacao /spec-build-review, /mcp-builder, /orquestracao-de-comandos-slash, /checklist-runner, /tech-search, /briefing-padrao"
      trigger: "qualquer squad Kolden que precise servico Prometeu como tool funcional"
      grounding_required_map:
        spec-build-review: false
        mcp-builder: true
        orquestracao-de-comandos-slash: false
        checklist-runner: false
        tech-search: true
        briefing-padrao: false

  fronteira_autoridade:
    kolden_art_x_prevalece:
      condicao: "conflito entre Constitution AIOX (engenharia-focada) e Kolden Art. X (agent-safety-focada)"
      regra: "Kolden Art. X prevalece por ser norma canonica externa da Kolden"
      procedencia: "Prometeu/constitution.md Regra de precedencia + Sub-onda 3.1"
    aiox_constitution_interna:
      condicao: "escopo de engenharia (CLI First, Story-Driven, No Invention, Quality First)"
      regra: "AIOX Constitution v1.0.0 aplicada dentro do framework"
      procedencia: ".aiox-core/constitution.md v1.0.0 preservada intocada"

  handoff_para_dike:
    quem_verifica: "Dike (temporariamente prometeu-chief com 3 salvaguardas ate Dike agent-funcional nascer via Ritual do Caos)"
    checklist_canonico: "Caos/checklists/CAOS-CL-002.md"
    escopo_verificacao: "8 gates Art. X aplicados aos 12 aiox-agents internos + refactor MEMORY + mapeamento cross-camada"

  data_ratificacao_bloco: "2026-07-07"
  sub_onda_ratificacao_bloco: "3.2"
